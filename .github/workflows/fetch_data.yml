name: WAVE Data Fetch

on:
  workflow_dispatch:           # manual trigger (also used by cron-job.org)
  schedule:
    - cron: '30 9 * * 1-5'    # fallback: 3:00 PM IST = 09:30 UTC (weekdays)

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Checkout data branch into ./data
        run: |
          git fetch origin data:data || git checkout --orphan data
          mkdir -p data/yf_cache data/wave_hist
          git checkout data -- . 2>/dev/null || true

      - name: Fetch scan cache  (yf_cache/)
        run: |
          python wave_fetch.py --tf 1d --merge \
            --outdir ./data/yf_cache \
            --delay 0.3

      - name: Fetch backfill history  (wave_hist/)
        run: |
          python wave_fetch.py --hist --merge \
            --outdir ./data \
            --delay 0.3

      - name: Commit & push to data branch
        run: |
          cd data
          git init 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git 2>/dev/null || \
            git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -B data
          git add -A
          git diff --cached --quiet || git commit -m "data: auto-fetch $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin data --force
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Ping Render to reload data
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK }}" || true
        # RENDER_DEPLOY_HOOK: optional — set in repo secrets to auto-restart Render on new data
