<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f0f4f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WAVE">
<title>WAVE</title>
<link rel="manifest" href="./manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f0f4f1;
  --bg2:      #ffffff;
  --card:     #ffffff;
  --card2:    #f7faf8;
  --border:   #dde8e0;
  --border2:  #c4d8ca;
  --text:     #1a2e20;
  --text2:    #3d5a45;
  --muted:    #6b8a72;
  --faint:    #a8c4af;

  --green:    #1a7a42;
  --green2:   #0f5c30;
  --green-l:  #e8f5ec;
  --green-bg: rgba(26,122,66,.08);
  --green-bd: rgba(26,122,66,.22);

  --red:      #c0202e;
  --red2:     #8b0018;
  --red-l:    #fef0f0;
  --red-bg:   rgba(192,32,46,.08);
  --red-bd:   rgba(192,32,46,.22);

  --amber:    #b06010;
  --amber-bg: rgba(176,96,16,.08);
  --amber-bd: rgba(176,96,16,.25);

  --blue:     #1a50a0;
  --blue-bg:  rgba(26,80,160,.07);
  --blue-bd:  rgba(26,80,160,.22);

  --purple:   #6030a0;

  --hdr-h:    54px;
  --safe-b:   env(safe-area-inset-bottom, 0px);
  --safe-t:   env(safe-area-inset-top, 0px);
  --shadow:   0 1px 4px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { height:100%; overflow:hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#root { height:100%; display:flex; flex-direction:column; }
.app { height:100%; display:flex; flex-direction:column; overflow:hidden; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }

/* ── HEADER ── */
.hdr {
  height: calc(var(--hdr-h) + var(--safe-t));
  padding-top: var(--safe-t);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: var(--safe-t) 16px 0;
  height: calc(var(--hdr-h) + var(--safe-t));
  gap: 10px; flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.hdr-logo {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  background: linear-gradient(145deg, #1a3a5c 0%, #0e7c7b 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.hdr-title { font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:700; color:var(--text); flex:1; }
.hdr-sub { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; display:block; margin-top:1px; }
.hdr-badge { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; padding:4px 10px; border-radius:20px; border:1px solid; white-space:nowrap; }
.hdr-badge.buy { color:var(--green); background:var(--green-bg); border-color:var(--green-bd); }
.hdr-badge.sell { color:var(--red); background:var(--red-bg); border-color:var(--red-bd); }

/* ── SCROLL AREA ── */
.scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
.scroll::-webkit-scrollbar { display:none; }

/* ── SCANNER CONTROLS ── */
.ctrl-wrap { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
.ctrl-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.ctrl-lbl { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; flex-shrink:0; width:100%; }

/* TF chips */
.chip-row { display:flex; gap:5px; overflow-x:auto; }
.chip-row::-webkit-scrollbar { display:none; }
.chip { flex-shrink:0; padding:7px 13px; border-radius:20px; border:1px solid var(--border); background:transparent; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); cursor:pointer; transition:all .15s; white-space:nowrap; display:flex; flex-direction:column; align-items:center; }
.chip:active { opacity:.7; }
.chip-label { font-weight:700; font-size:12px; }
.chip-sub { font-size:9px; color:var(--faint); margin-top:1px; }
.chip.on { background:var(--green-bg); border-color:var(--green-bd); color:var(--green); }
.chip.on .chip-sub { color:var(--green); opacity:.7; }
.chip.on-s { background:var(--blue-bg); border-color:var(--blue-bd); color:var(--blue); }

/* Scan button */
.scan-btn { flex:1; min-width:120px; padding:13px 18px; border-radius:10px; border:none; background:linear-gradient(135deg,var(--green),var(--green2)); color:#fff; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:all .2s; }
.scan-btn:active:not(:disabled) { transform:scale(.97); opacity:.9; }
.scan-btn:disabled { opacity:.4; cursor:not-allowed; }
.cancel-btn { flex:1; min-width:120px; padding:13px 18px; border-radius:10px; border:1.5px solid var(--red-bd); background:var(--red-bg); color:var(--red); font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; }
.cancel-btn:active { opacity:.7; }
.prog-wrap { flex:1; display:flex; flex-direction:column; gap:4px; }
.prog-txt { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); }
.prog-bar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.prog-fill { height:100%; background:linear-gradient(90deg,var(--green),var(--blue)); border-radius:2px; transition:width .3s; }

/* Spin */
.spin { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:rot .7s linear infinite; flex-shrink:0; }
.spin-g { border:2px solid var(--green-bd); border-top-color:var(--green); }
@keyframes rot { to { transform:rotate(360deg); } }

/* ── RESET BUTTON ── */
.reset-btn { width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--card2); color:var(--muted); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; }
.reset-btn:active { background:var(--red-bg); border-color:var(--red-bd); color:var(--red); transform:rotate(-45deg); }

/* ── CLEAR LINK ── */
.clr-link { background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--blue); cursor:pointer; padding:0; text-decoration:underline; }

/* ── UNIVERSE CHIPS ── */
.uni-chip { min-width:72px; }
.uni-on-fno   { background:rgba(26,122,66,.12) !important; border-color:var(--green-bd) !important; color:var(--green) !important; }
.uni-on-large { background:rgba(26,80,160,.1)  !important; border-color:var(--blue-bd)  !important; color:var(--blue)  !important; }
.uni-on-mid   { background:rgba(176,96,16,.1)  !important; border-color:var(--amber-bd) !important; color:var(--amber) !important; }
.uni-on-small { background:rgba(192,32,46,.09) !important; border-color:var(--red-bd)   !important; color:var(--red)   !important; }
.uni-on-fno   .chip-sub, .uni-on-large .chip-sub, .uni-on-mid .chip-sub, .uni-on-small .chip-sub { opacity:.75; }

/* ── SECTOR MULTI-CHIPS ── */
.sec-chip { flex-shrink:0; }
.sec-on { background:rgba(26,80,160,.12) !important; border-color:var(--blue-bd) !important; color:var(--blue) !important; font-weight:700 !important; }

/* ── STOCK COUNT BAR ── */
.stock-count-bar { background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:9px 13px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text2); display:flex; align-items:center; gap:6px; }
.stock-count-bar strong { color:var(--green); font-size:15px; }
.scan-mode-row { display:flex; gap:6px; }
.mode-btn { flex:1; padding:10px 8px; border-radius:10px; border:1.5px solid var(--border); background:transparent; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; transition:all .15s; text-align:center; line-height:1.3; }
.mode-btn.active-sector { background:var(--green-bg); border-color:var(--green-bd); color:var(--green); }
.mode-btn.active-single { background:var(--blue-bg); border-color:var(--blue-bd); color:var(--blue); }
.stock-search-wrap { position:relative; }
.stock-search-input { width:100%; padding:12px 40px 12px 14px; border-radius:10px; border:1.5px solid var(--border); background:var(--bg2); font-family:'DM Sans',sans-serif; font-size:16px; color:var(--text); outline:none; transition:border-color .15s; -webkit-appearance:none; }
.stock-search-input:focus { border-color:var(--blue-bd); box-shadow:0 0 0 3px rgba(26,80,160,.07); }
.stock-search-input::placeholder { color:var(--faint); }
.stock-search-clear { position:absolute; right:12px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:50%; border:none; background:var(--border); color:var(--muted); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.stock-dropdown { position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:600; background:var(--bg2); border:1.5px solid var(--blue-bd); border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.14); max-height:260px; overflow-y:auto; }
.stock-dropdown::-webkit-scrollbar { display:none; }
.sdi { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; border-bottom:1px solid var(--border); }
.sdi:last-child { border-bottom:none; border-radius:0 0 11px 11px; }
.sdi:first-child { border-radius:11px 11px 0 0; }
.sdi:only-child { border-radius:11px; }
.sdi:active { background:var(--blue-bg); }
.sdi-sym { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; color:var(--text); min-width:95px; }
.sdi-name { font-size:13px; color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sdi-sec { font-family:'IBM Plex Mono',monospace; font-size:9px; padding:2px 7px; border-radius:4px; background:var(--card2); border:1px solid var(--border); color:var(--faint); flex-shrink:0; }
.sdi-match { color:var(--blue); font-weight:700; }
.sdi-manual { background:var(--blue-bg); border-top:1px solid var(--blue-bd); }
.selected-pill { display:flex; align-items:center; gap:10px; padding:11px 13px; background:var(--blue-bg); border:1.5px solid var(--blue-bd); border-radius:10px; }
.sp-sym { font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; color:var(--blue); }
.sp-name { font-size:13px; color:var(--text2); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-clear { background:transparent; border:none; font-size:20px; color:var(--muted); cursor:pointer; line-height:1; padding:0 2px; flex-shrink:0; }
.single-scan-btn { padding:6px 11px; border-radius:8px; border:none; background:linear-gradient(135deg,var(--blue),#0e3880); color:#fff; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; transition:all .15s; flex-shrink:0; }
.single-scan-btn:active:not(:disabled) { opacity:.85; transform:scale(.98); }
.single-scan-btn:disabled { opacity:.35; cursor:not-allowed; }

/* ── SORT / COUNT BAR ── */
.sort-bar { display:flex; align-items:center; gap:6px; padding:8px 14px; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; }
.sort-bar::-webkit-scrollbar { display:none; }
.sort-lbl { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--faint); flex-shrink:0; }
.sort-chip { font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 12px; border:1px solid var(--border); border-radius:20px; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap; flex-shrink:0; }
.sort-chip.on { background:var(--blue-bg); border-color:var(--blue-bd); color:var(--blue); font-weight:700; }
.sort-counts { display:flex; gap:8px; margin-left:auto; flex-shrink:0; }
.sc-b { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; color:var(--green); }
.sc-s { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; color:var(--red); }

/* ── RESULTS LIST ── */
.results { padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
.sec-title { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; display:flex; align-items:center; gap:8px; padding:6px 0 4px; }
.sec-title.buy { color:var(--green); }
.sec-title.sell { color:var(--red); }
.sec-line { flex:1; height:1px; background:var(--border); }
.sec-cnt { font-size:10px; font-weight:400; color:var(--muted); letter-spacing:0; }

/* Opportunity card */
.opp { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 15px; display:flex; flex-direction:column; gap:6px; cursor:pointer; position:relative; overflow:hidden; box-shadow:var(--shadow); transition:transform .15s, box-shadow .15s; }
.opp:active { transform:scale(.98); box-shadow:none; }
.opp::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:12px 0 0 12px; }
.opp.bo::before { background:var(--green); }
.opp.so::before { background:var(--red); }
.opp.bo { border-color:var(--green-bd); }
.opp.so { border-color:var(--red-bd); }
.opp-row1 { display:flex; align-items:center; justify-content:space-between; }
.opp-sym { font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; color:var(--text); }
.opp-chips { display:flex; gap:4px; align-items:center; }
.opp-chip { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; padding:3px 9px; border-radius:4px; }
.oc-buy { color:var(--green); background:var(--green-bg); border:1px solid var(--green-bd); }
.oc-sell { color:var(--red); background:var(--red-bg); border:1px solid var(--red-bd); }
.oc-tf { color:var(--blue); background:var(--blue-bg); border:1px solid var(--blue-bd); }
.opp-nm { font-size:13px; color:var(--muted); }
.opp-chg { display:flex; align-items:center; gap:8px; margin-top:2px; }
.chg-val { font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; }
.chg-val.pos { color:var(--green); }
.chg-val.neg { color:var(--red); }
.chg-period { font-size:12px; color:var(--muted); }
.opp-levels { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:4px; }
.ol { display:flex; flex-direction:column; gap:2px; }
.ol-l { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.ol-v { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; }
.opp-conf { display:flex; align-items:center; gap:7px; margin-top:3px; }
.opp-cbar { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.opp-cfill { height:100%; border-radius:2px; }
.opp-cfill.b { background:var(--green); }
.opp-cfill.s { background:var(--red); }
.opp-cpct { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; }
.opp-cpct.b { color:var(--green); }
.opp-cpct.s { color:var(--red); }
.opp-arrow { font-size:18px; color:var(--faint); margin-left:auto; }
.opp-empty { text-align:center; padding:20px; font-size:14px; color:var(--muted); background:var(--card2); border:1px dashed var(--border); border-radius:10px; }

/* ── EMPTY / LOADING STATES ── */
.empty-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:60px 20px; text-align:center; }
.empty-icon { font-size:52px; opacity:.15; }
.empty-title { font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; color:var(--text2); }
.empty-body { font-size:13px; color:var(--muted); line-height:1.65; max-width:280px; }
.load-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding:50px 20px; }
.bspin { width:38px; height:38px; border-radius:50%; border:3px solid var(--border); animation:rot .9s linear infinite; }
.bspin.g { border-top-color:var(--green); border-right-color:var(--green); }
.bspin.b { border-top-color:var(--blue); border-right-color:var(--blue); }
.load-txt { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; text-align:center; }
.load-sub { font-size:12px; color:var(--muted); }

/* ── DETAIL SHEET (slide-up panel) ── */
.sheet-overlay { position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:300; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.sheet { position:fixed; left:0; right:0; bottom:0; top:0; background:var(--bg); z-index:301; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; animation:slideUp .28s cubic-bezier(.22,.61,.36,1); }
@keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
.sheet::-webkit-scrollbar { display:none; }
.sheet-hdr {
  position:sticky; top:0; z-index:10;
  background:var(--bg2); border-bottom:1px solid var(--border);
  padding:calc(var(--safe-t) + 12px) 14px 12px;
  display:flex; align-items:center; gap:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.back-btn { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card2); font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; color:var(--text2); cursor:pointer; }
.back-btn:active { opacity:.7; }
.sheet-sym { font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; color:var(--text); }
.sheet-nm { font-size:12px; color:var(--muted); }
.sheet-type { margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; padding:5px 12px; border-radius:20px; }
.sheet-type.buy { color:var(--green); background:var(--green-bg); border:1px solid var(--green-bd); }
.sheet-type.sell { color:var(--red); background:var(--red-bg); border:1px solid var(--red-bd); }

.sheet-body { padding:14px; display:flex; flex-direction:column; gap:12px; padding-bottom:calc(var(--safe-b) + 24px); }

/* Price hero row */
.price-hero { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
.ph-top { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.ph-price { font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:700; color:var(--text); letter-spacing:-1px; }
.ph-right { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
.ph-chg { font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700; }
.ph-chg.pos { color:var(--green); }
.ph-chg.neg { color:var(--red); }
.ph-period { font-size:12px; color:var(--muted); }
.ph-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
.ph-stat { background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:9px; }
.ph-stat-l { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.ph-stat-v { font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; margin-top:3px; }

/* Phase bar */
.phase-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
.section-title { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
.ph-track { display:flex; gap:4px; }
.ph-seg { flex:1; height:5px; border-radius:2px; background:var(--border); }
.ph-a{background:var(--amber)}.ph-b{background:#c07810}.ph-c{background:var(--green)}.ph-d{background:var(--blue)}.ph-e{background:var(--purple)}
.ph-ra{background:var(--amber)}.ph-rb{background:var(--red)}.ph-rc{background:#c02030}.ph-rd{background:var(--red2)}.ph-re{background:#500010}
.ph-blink{animation:sb 1.2s infinite}
@keyframes sb{0%,100%{opacity:1}50%{opacity:.15}}
.ph-lbls { display:flex; margin-top:4px; }
.ph-lbl { flex:1; font-family:'IBM Plex Mono',monospace; font-size:8px; color:var(--faint); text-align:center; }
.ph-lbl.cur { color:var(--text); font-weight:700; font-size:9px; }
.stage-pill { display:inline-flex; align-items:center; gap:8px; padding:11px 14px; border-radius:8px; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:700; border:1px solid; width:100%; margin-top:10px; }
.sp-a{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd);}
.sp-b{color:#c07810;background:rgba(192,120,16,.08);border-color:rgba(192,120,16,.3);}
.sp-c{color:var(--green);background:var(--green-bg);border-color:var(--green-bd);}
.sp-d{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd);}
.sp-e{color:var(--purple);background:rgba(96,48,160,.07);border-color:rgba(96,48,160,.28);}
.sp-ra{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd);}
.sp-rb{color:var(--red);background:var(--red-bg);border-color:var(--red-bd);}
.sp-rc{color:#c02030;background:rgba(192,32,48,.07);border-color:rgba(192,32,48,.28);}
.sp-rd{color:var(--red2);background:rgba(139,0,24,.07);border-color:rgba(139,0,24,.28);}
.sp-re{color:#500010;background:rgba(80,0,16,.06);border-color:rgba(80,0,16,.25);}
.stage-name { font-size:15px; color:var(--text2); margin-top:8px; line-height:1.5; }
.conf-row { display:flex; align-items:center; gap:10px; margin-top:10px; }
.conf-bar { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.conf-fill { height:100%; border-radius:3px; }
.conf-pct { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; }
.active-banner { padding:11px 14px; border-radius:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; letter-spacing:.3px; margin-top:10px; }
.ab-buy { color:var(--green); background:var(--green-bg); border:1px solid var(--green-bd); }
.ab-sell { color:var(--red); background:var(--red-bg); border:1px solid var(--red-bd); }

/* Wyckoff stage checklist */
.stages-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
.stage-row { display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); }
.stage-row:last-child { border-bottom:none; }
.stage-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; border:2px solid; }
.sd-done { background:var(--green); border-color:var(--green); }
.sd-active { background:var(--amber); border-color:var(--amber); animation:sb 1.2s infinite; }
.sd-warn { background:var(--red); border-color:var(--red); animation:sb 1.2s infinite; }
.sd-wait { background:transparent; border-color:var(--faint); }
.stage-row-label { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text); flex:1; }
.stage-row-tag { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; padding:3px 9px; border-radius:4px; }
.tag-done { color:var(--green); background:var(--green-bg); border:1px solid var(--green-bd); }
.tag-active { color:var(--amber); background:var(--amber-bg); border:1px solid var(--amber-bd); }
.tag-warn { color:var(--red); background:rgba(239,68,68,.08); border:1px solid var(--red-bd); }
.tag-wait { color:var(--muted); background:var(--card2); border:1px solid var(--border); }

/* Key levels */
.levels-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
.levels-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.lv { background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:10px; }
.lv-l { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.lv-v { font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700; margin-top:2px; }
.lv-n { font-size:11px; color:var(--muted); margin-top:2px; line-height:1.3; }

/* Entry cards */
.entry-card { background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:13px; margin-bottom:7px; }
.ec-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.ec-type { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; }
.ec-meta { display:flex; align-items:center; gap:6px; }
.ec-rr { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--amber); font-weight:700; }
.ec-tag { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; padding:3px 9px; border-radius:4px; }
.tag-ab { color:var(--green); background:var(--green-bg); border:1px solid var(--green-bd); }
.tag-as { color:var(--red); background:var(--red-bg); border:1px solid var(--red-bd); }
.tag-w { color:var(--amber); background:var(--amber-bg); border:1px solid var(--amber-bd); }
.tag-wt { color:var(--muted); background:var(--bg); border:1px solid var(--border); }
.ec-levels { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
.ec-lv { display:flex; flex-direction:column; gap:2px; }
.ec-lv-l { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.ec-lv-v { font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:700; }
.ec-desc { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.55; }

/* Chart */
.chart-card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
.chart-hdr { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:6px; }
.rng-row { display:flex; gap:5px; }
.r-btn { font-family:'IBM Plex Mono',monospace; font-size:9px; padding:4px 10px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--muted); cursor:pointer; transition:all .15s; }
.r-btn.ra { background:var(--green-bg); border-color:var(--green-bd); color:var(--green); font-weight:700; }
.r-btn.rd { background:var(--red-bg); border-color:var(--red-bd); color:var(--red); font-weight:700; }
.chart-zoom-wrap { position:relative; overflow:hidden; touch-action:none; user-select:none; cursor:grab; }
.chart-zoom-wrap.panning { cursor:grabbing; }
canvas.cc { width:100%; display:block; }
.chart-zoom-hint { position:absolute; bottom:8px; right:10px; font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--faint); pointer-events:none; }
.zoom-reset-btn { padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:var(--card2); color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:9px; cursor:pointer; }

/* Heatmap */
.heatmap-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
.hm-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.hm-cell { border-radius:8px; padding:9px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; border:1px solid; }
.hm-cell.bh { background:var(--green-bg); border-color:var(--green-bd); }
.hm-cell.sh { background:var(--red-bg); border-color:var(--red-bd); }
.hm-cell.nh { background:var(--card2); border-color:var(--border); }
.hm-sec { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; }
.hm-cell.bh .hm-sec { color:var(--green); }
.hm-cell.sh .hm-sec { color:var(--red); }
.hm-cell.nh .hm-sec { color:var(--text2); }
.hm-cnt { font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; line-height:1; }
.hm-cell.bh .hm-cnt { color:var(--green); }
.hm-cell.sh .hm-cnt { color:var(--red); }
.hm-cell.nh .hm-cnt { color:var(--faint); }
.hm-sub { font-size:10px; color:var(--muted); }

.disclaimer { background:var(--amber-bg); border:1px solid var(--amber-bd); border-radius:10px; padding:11px 13px; font-size:12px; color:var(--text2); line-height:1.65; }
.disclaimer strong { color:var(--amber); }

@media(min-width:600px){
  .hm-grid{grid-template-columns:repeat(6,1fr);}
  .opp-levels{grid-template-columns:repeat(4,1fr);}
  .levels-grid{grid-template-columns:repeat(3,1fr);}
}

/* DARK MODE */
body.dark{--bg:#0e1410;--bg2:#161e18;--card:#1c2820;--card2:#1a2218;--border:#2a3d2e;--text:#d8edd0;--text2:#a8c8a0;--muted:#6a9070;--faint:#3d5a42;--green:#3dd670;--green2:#28b055;--green-l:#0e2415;--green-bg:rgba(61,214,112,.10);--green-bd:rgba(61,214,112,.28);--red:#ff5a5a;--red2:#d03030;--red-l:#1e0808;--red-bg:rgba(255,90,90,.10);--red-bd:rgba(255,90,90,.28);--amber:#f0a040;--amber-bg:rgba(240,160,64,.10);--amber-bd:rgba(240,160,64,.28);--blue:#5090e0;--blue-bg:rgba(80,144,224,.10);--blue-bd:rgba(80,144,224,.28);--shadow:0 1px 6px rgba(0,0,0,.4)}
body.dark .hdr,body.dark .ctrl-wrap,body.dark .sort-bar{background:var(--bg2);border-color:var(--border)}
body.dark .stock-search-input{background:var(--card);color:var(--text);border-color:var(--border)}
body.dark .stock-dropdown{background:var(--card);border-color:var(--blue-bd)}
body.dark .opp,body.dark .heatmap-card,body.dark .detail-sheet{background:var(--card)}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{opacity:.7}
canvas.sparkline{width:100%;height:36px;display:block;margin:3px 0}
.opp-badges{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0}
.bdg{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
.bdg-g{color:var(--green);background:var(--green-bg);border-color:var(--green-bd)}
.bdg-r{color:var(--red);background:var(--red-bg);border-color:var(--red-bd)}
.bdg-a{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
.wl-btn{background:transparent;border:none;font-size:18px;cursor:pointer;padding:0 3px;opacity:.35;line-height:1;flex-shrink:0}
.wl-btn.on{opacity:1}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;margin:10px 14px 0;padding:12px;box-shadow:var(--shadow)}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.panel-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.wl-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.wl-item:last-child{border-bottom:none;padding-bottom:0}
.wl-sym{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;color:var(--text);min-width:80px}
.wl-name{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-go{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--blue);cursor:pointer}
.wl-rm{background:transparent;border:none;font-size:15px;color:var(--faint);cursor:pointer}
.panel-empty{font-size:12px;color:var(--faint);text-align:center;padding:6px 0;font-style:italic}
.alert-banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:10px;right:10px;z-index:900;background:var(--amber);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:slideDown .3s ease}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.alert-close{background:rgba(255,255,255,.25);border:none;border-radius:6px;color:#fff;font-size:13px;padding:2px 8px;cursor:pointer;margin-left:auto}
.alert-row{display:flex;gap:6px;align-items:center}
.alert-inp{flex:1;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg2);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text);outline:none}
.alert-inp:focus{border-color:var(--amber-bd)}
.alert-set{padding:8px 12px;border-radius:8px;border:1px solid var(--amber-bd);background:var(--amber-bg);color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.alert-active{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber)}
.alert-rm{background:transparent;border:none;color:var(--amber);font-size:13px;cursor:pointer;margin-left:auto}
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
.hist-row:last-child{border-bottom:none;padding-bottom:0}
.hist-row:active{opacity:.7}
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
.hist-row:last-child{border-bottom:none;padding-bottom:0}
.hist-row:active{opacity:.7}
.dl-day{border-radius:10px;border:1px solid var(--border);background:var(--card2);overflow:hidden;margin-bottom:8px;}
.dl-day-hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none;}
.dl-day-hdr:active{opacity:.7}
.dl-date{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--text);}
.dl-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;}
.dl-badge-pre{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd);}
.dl-badge-post{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
.dl-badge-acc{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);}
.dl-scan-row{display:flex;align-items:center;gap:6px;padding:5px 12px;border-top:1px solid var(--border);}
.dl-scan-sym{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:800;color:var(--text);min-width:90px;}
.dl-scan-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);flex:1;}
.dl-outcome{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;margin-left:auto;white-space:nowrap;}
.dl-accuracy{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--border);background:var(--bg);}
.dl-acc-stat{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);}
.dl-acc-val{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:800;}
.an-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.an-title{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.an-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.an-stat{background:var(--card2);border-radius:8px;padding:8px 10px;text-align:center;border:1px solid var(--border);}
.an-stat-val{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:800;line-height:1.2;}
.an-stat-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--muted);margin-top:2px;}
.an-stat-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--faint);margin-top:1px;}
.an-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.an-bar-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);width:70px;flex-shrink:0;}
.an-bar-track{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;}
.an-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
.an-bar-pct{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;width:32px;text-align:right;flex-shrink:0;}
.an-bar-n{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--faint);width:36px;text-align:right;flex-shrink:0;}
.stor-bar{height:4px;border-radius:2px;background:var(--bg2);overflow:hidden;margin:4px 0;}
.stor-fill{height:100%;border-radius:2px;transition:width .3s;}
.hist-t{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);min-width:44px}
.hist-tf{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--blue);padding:2px 6px;border-radius:4px;background:var(--blue-bg);border:1px solid var(--blue-bd)}
.hist-d{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── RESULT FILTER BAR ── */
.filter-bar { padding:8px 14px 6px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
.filter-row { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.filter-lbl { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--faint); flex-shrink:0; min-width:38px; letter-spacing:.5px; text-transform:uppercase; }
.f-chip { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; padding:3px 9px; border-radius:20px; border:1.5px solid var(--border); background:var(--card2); color:var(--muted); cursor:pointer; transition:all .12s; white-space:nowrap; }
.f-chip.on { border-color:var(--blue-bd); background:var(--blue-bg); color:var(--blue); }
.f-chip.cap-large.on { border-color:var(--green-bd); background:var(--green-bg); color:var(--green); }
.f-chip.cap-mid.on   { border-color:var(--amber-bd); background:var(--amber-bg); color:var(--amber); }
.f-chip.cap-small.on { border-color:var(--red-bd); background:var(--red-bg); color:var(--red); }
.f-chip.cap-index.on { border-color:var(--blue-bd); background:var(--blue-bg); color:var(--blue); }
.filter-reset { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--blue); cursor:pointer; border:none; background:none; padding:0 2px; margin-left:auto; flex-shrink:0; }
.filter-active-count { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); margin-left:4px; }

/* ── LOCKED OVERLAY (scanning) ── */
.ctrl-wrap.locked { pointer-events:none; user-select:none; }
.ctrl-wrap.locked::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,.45); border-radius:inherit; z-index:10; pointer-events:none; }
body.dark .ctrl-wrap.locked::after { background:rgba(0,0,0,.45); }
.scan-lock-banner { display:flex; align-items:center; gap:8px; padding:6px 14px; background:var(--amber-bg); border-bottom:1px solid var(--amber-bd); font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--amber); justify-content:space-between; }

/* ── COLLAPSIBLE CONTROLS ── */
.ctrl-wrap { position:relative; transition:all .25s ease; overflow:hidden; }
.ctrl-wrap.collapsed { padding-top:0; padding-bottom:0; gap:0; }
.ctrl-collapse-bar { display:flex; align-items:center; justify-content:space-between; padding:7px 14px; background:var(--bg2); border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
.ctrl-collapse-bar:active { opacity:.7; }
.ctrl-collapse-label { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:.5px; }
.ctrl-collapse-chevron { font-size:12px; color:var(--faint); transition:transform .2s; }
.ctrl-collapse-chevron.open { transform:rotate(180deg); }
body.dark .ctrl-collapse-bar { background:var(--bg2); border-color:var(--border); }

/* ── ENTRY ZONE HIGHLIGHT ── */
.opp.in-zone { box-shadow:0 0 0 2px var(--green), 0 2px 12px rgba(26,122,66,.18); }
.opp.in-zone.so { box-shadow:0 0 0 2px var(--red), 0 2px 12px rgba(192,32,46,.18); }
.zone-badge { display:inline-flex; align-items:center; gap:4px; font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700; padding:2px 8px; border-radius:4px; border:1px solid; }
.zone-badge.in  { color:var(--green); background:var(--green-bg); border-color:var(--green-bd); animation:pulse-g 2s ease-in-out infinite; }
.zone-badge.out { color:var(--muted);  background:transparent;     border-color:var(--border); }
@keyframes pulse-g { 0%,100%{opacity:1} 50%{opacity:.6} }
body.dark .opp.in-zone    { box-shadow:0 0 0 2px var(--green),0 2px 12px rgba(61,214,112,.22); }
body.dark .opp.in-zone.so { box-shadow:0 0 0 2px var(--red),  0 2px 12px rgba(255,90,90,.22); }

/* ── CMP ROW on result card ── */
.opp-cmp { display:flex; align-items:baseline; gap:7px; margin:5px 0 3px; flex-wrap:wrap; }
.cmp-label { font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); flex-shrink:0; }
.cmp-price { font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:800; color:var(--text); letter-spacing:-.3px; }
.cmp-chg   { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; }
.cmp-chg.pos { color:var(--green); }
.cmp-chg.neg { color:var(--red); }

.conf-thresh-row{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.conf-thresh-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);white-space:nowrap;}
.conf-thresh-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--amber);min-width:30px;text-align:right;}
input[type=range].conf-slider{flex:1;accent-color:var(--amber);}

.rsi-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid;}
.rsi-ob{color:#c04050;background:rgba(192,64,80,.10);border-color:rgba(192,64,80,.30);}
.rsi-os{color:var(--green);background:var(--green-bg);border-color:var(--green-bd);}
.rsi-mid{color:var(--muted);background:var(--card2);border-color:var(--border);}

.hm-bar{background:var(--bg2);border-bottom:1px solid var(--border);}
.hm-bar-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;cursor:pointer;user-select:none;}
.hm-bar-hdr:active{opacity:.7;}
.hm-bar-title{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);flex:1;}
.hm-bar-toggle{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--blue);}
.hm-grid-row{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px;}
.hm-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1.5px solid var(--border);background:var(--card2);cursor:pointer;}
.hm-pill.bh{border-color:var(--green-bd);background:var(--green-bg);}
.hm-pill.sh{border-color:var(--red-bd);background:var(--red-bg);}
.hm-pill.on{box-shadow:0 0 0 2px var(--blue);}
.hm-pill-sec{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--text);}
.hm-pill-pip{font-family:'IBM Plex Mono',monospace;font-size:9px;}
.hm-pill-pip .g{color:var(--green);}
.hm-pill-pip .r{color:var(--red);}

.results-split{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:start;}
.results-col{min-width:0;border-right:1px solid var(--border);}
.results-col:last-child{border-right:none;}
.results-col-hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:6px 8px 5px;border-bottom:2px solid;}
.results-col-hdr.buy{background:var(--green-bg);border-color:var(--green-bd);}
.results-col-hdr.sell{background:var(--red-bg);border-color:var(--red-bd);}
.col-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;flex-shrink:0;}
.col-title.buy{color:var(--green);}
.col-title.sell{color:var(--red);}
.col-sort{display:flex;gap:3px;overflow-x:auto;flex:1;}
.col-sort::-webkit-scrollbar{display:none;}
.col-sort-chip{font-family:'IBM Plex Mono',monospace;font-size:8px;padding:2px 5px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--faint);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.col-sort-chip.on{border-color:var(--blue-bd);background:var(--blue-bg);color:var(--blue);}
.col-cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:800;flex-shrink:0;}
.col-cnt.buy{color:var(--green);}
.col-cnt.sell{color:var(--red);}
.opp.compact{padding:8px;margin:6px 6px 0;}
.opp.compact .opp-sym{font-size:13px;}
.opp.compact .opp-nm{font-size:10px;}
.opp.compact .cmp-price{font-size:13px;}
.opp.compact .alert-row{display:none;}
.opp.compact .bdg{font-size:8px;padding:1px 5px;}

.filter-bar-hdr{display:flex;align-items:center;justify-content:space-between;padding:5px 14px;cursor:pointer;user-select:none;background:var(--bg2);}
.filter-bar-hdr:active{opacity:.7;}
.filter-bar-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--muted);}
.filter-bar-toggle{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--blue);}
.filter-bar-summary{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--blue);margin-left:6px;}

.levels-row2{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px;margin-top:4px;}

.phase-filter-row{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0;}
.ph-chip{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--faint);cursor:pointer;white-space:nowrap;transition:all .15s;opacity:.55;}
.ph-chip:active{opacity:.4;}
.ph-chip.buy{border-color:var(--green-bd);color:var(--green);}
.ph-chip.sell{border-color:var(--red-bd);color:var(--red);}
.ph-chip.mixed{border-color:var(--amber);color:var(--amber);}
/* Selected — solid fill, full opacity, matching colour */
.ph-chip.on{opacity:1;font-weight:800;}
.ph-chip.on.buy{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 6px rgba(26,122,66,.35);}
.ph-chip.on.sell{background:var(--red-bd);border-color:var(--red-bd);color:#fff;box-shadow:0 2px 6px rgba(180,30,30,.3);}
.ph-chip.on.mixed{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 2px 6px rgba(184,134,11,.3);}

.conf-btn-grp{display:flex;gap:2px;}
.conf-btn{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;}
.conf-btn.on{background:var(--amber);border-color:var(--amber);color:#fff;}

.filter-tag-badge { display:inline-flex; align-items:center; gap:3px; font-family:'IBM Plex Mono',monospace; font-size:8px; font-weight:700; padding:2px 7px; border-radius:10px; background:rgba(96,48,160,.09); border:1px solid rgba(96,48,160,.28); color:var(--purple); white-space:nowrap; }
.filter-tag-badge.warn { background:var(--amber-bg); border-color:var(--amber-bd); color:var(--amber); }
.install-banner{position:relative;background:var(--navy,#1a3a5c);color:#fff;padding:10px 14px;display:flex;align-items:flex-start;gap:10px;z-index:50;}
.install-banner-icon{font-size:22px;flex-shrink:0;margin-top:2px;}
.install-banner-body{flex:1;min-width:0;}
.install-banner-title{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;margin-bottom:3px;}
.install-banner-steps{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,.75);line-height:1.7;}
.install-banner-steps b{color:#fff;}
.install-banner-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:16px;cursor:pointer;padding:0 0 0 6px;flex-shrink:0;line-height:1;}
.install-banner-close:active{opacity:.5;}
.install-btn{margin-top:7px;display:inline-block;background:#fff;color:#1a3a5c;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;border:none;cursor:pointer;}
</style>

// MTF trend: weekly close vs 20-week EMA — true = uptrend
// HTF trend: last close vs EMA of HTF candles — works for weekly, daily, monthly
function isWeeklyUptrend(htfCandles) {
  if (!htfCandles || htfCandles.length < 12) return null; // null = unknown
  const cls = htfCandles.map(c => c.close);
  const n = cls.length;
  // Use 20-bar EMA if enough bars, else 10-bar EMA for monthly
  const period = n >= 20 ? 20 : 10;
  if (n < period) return null;
  let ema = cls.slice(0, period).reduce((a, b) => a + b, 0) / period;
  const k = 2 / (period + 1);
  for (let i = period; i < n; i++) ema = cls[i] * k + ema * (1 - k);
  return cls[n - 1] > ema; // last close above EMA = uptrend
}

// Build scan list from universe selections (multi) and sector selections (multi)
function buildScanList(universeSet, sectorSet) {
  const wantsIndex = sectorSet.has('INDEX');
  let pool = [];
  if (universeSet.size === 0) {
    // nothing selected = all non-index
    pool = wantsIndex ? ALL_STOCKS.slice() : ALL_STOCKS.filter(s => s.cap !== 'index');
  } else {
    if (universeSet.has('fno'))   pool = pool.concat(FNO_STOCKS);
    if (universeSet.has('large')) pool = pool.concat(LARGE_STOCKS);
    if (universeSet.has('mid'))   pool = pool.concat(MID_STOCKS);
    if (universeSet.has('small')) pool = pool.concat(SMALL_STOCKS);
    if (wantsIndex) pool = pool.concat(ALL_STOCKS.filter(s => s.cap === 'index'));
  }
  // Deduplicate
  const seen = new Set();
  pool = pool.filter(s => { if (seen.has(s.symbol)) return false; seen.add(s.symbol); return true; });
  // Apply sector filter
  if (sectorSet.size > 0) {
    pool = pool.filter(s => sectorSet.has(s.sector));
  }
  return pool;
}

const CLOUD_URL = localStorage.getItem('wave_cloud_url') || 'https://wave-app-clkq.onrender.com';

// ── Cloud: fetch a yf_cache file from Render backend ──────────────────
async function fetchCloudYF(key) {
  if (!CLOUD_URL) return null;
  try {
    const safe = key.replace(/[^a-zA-Z0-9_\-\.]/g, '_');
    const url  = CLOUD_URL.replace(/\/$/, '') + '/api/yf_cache/' + safe + '.json';
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) return null;
    const parsed = await res.json();
    // Backend stores {ts, data:[...]} — same shape as WaveFS
    if (parsed?.data?.length) return parsed;
    return null;
  } catch { return null; }
}

// ── Cloud: fetch a wave_hist file from Render backend ─────────────────
async function fetchCloudHist(symbol) {
  if (!CLOUD_URL) return null;
  try {
    const url  = CLOUD_URL.replace(/\/$/, '') + '/api/wave_hist/' + encodeURIComponent(symbol) + '.json';

  } catch { return null; }
}

// ── Fetch cache: memory → sessionStorage (4 min) → localStorage (24 hr) → App_Wave/yf_cache ──
const _fetchMem = {};
const _fetchFailed = new Set(); // tickers that failed all proxies this session — skip retries
let _waveFSRef = null; // set by App on connect
// Module-level sector candle cache — persists across scans within the browser session
const _sectorScanCache = {};  // key: sector_interval → candles[]
const _sectorHtfCache  = {};  // key: sector_htfInterval → candles[]
async function fetchOHLCV(ticker, period, interval, forceFresh=false) {
  const key = ticker + '|' + period + '|' + interval;
  // 1. Memory cache (instant) — skip if forceFresh
  if (!forceFresh && _fetchMem[key]) return _fetchMem[key];
  // 2. SessionStorage (< 4 min old)
  if (!forceFresh) {
    try {
      const raw = sessionStorage.getItem('yf_' + key);
      if (raw) {
        const {ts, data} = JSON.parse(raw);
        if (Date.now() - ts < 4 * 60 * 1000) { _fetchMem[key] = data; return data; }
      }
    } catch {}
  }
  // 3. IndexedDB persistent cache (survives tab close — much faster than file read)
  if (!forceFresh) {
    try {
      const safeKey = key.replace(/[^a-zA-Z0-9_\-\.]/g,'_');
      const cached = await WaveFS.readYFIDB(safeKey);
      if (cached && Date.now() - cached.ts < 48 * 60 * 60 * 1000 && cached.data?.length) {
        _fetchMem[key] = cached.data;
        try { sessionStorage.setItem('yf_' + key, JSON.stringify({ts:cached.ts, data:cached.data})); } catch {}
        return cached.data;
      }
    } catch {}
  }
  // 4. WaveFS yf_cache files (written by wave_fetch.py — 48h TTL, skip if forceFresh)
  if (!forceFresh && _waveFSRef) {
    try {
      const cached = await _waveFSRef.readYF(key);
      if (cached && Date.now() - cached.ts < 48 * 60 * 60 * 1000) {
        _fetchMem[key] = cached.data;
        try { sessionStorage.setItem('yf_' + key, JSON.stringify({ts:cached.ts, data:cached.data})); } catch {}
        // Promote to IDB so next session skips filesystem read
        const safeKey = key.replace(/[^a-zA-Z0-9_\-\.]/g,'_');
        WaveFS.readYFIDB(safeKey).then(existing => {
          if (!existing) WaveFS.writeYF(key, cached); // triggers IDB write via writeYF
        }).catch(()=>{});
        return cached.data;
      }
    } catch {}
  }
  // 4b. Cloud backend yf_cache (Render — 48h TTL, skip if forceFresh or WaveFS already hit)
  if (!forceFresh && CLOUD_URL) {
    try {
      const cloudData = await fetchCloudYF(key);
      if (cloudData && Date.now() - cloudData.ts < 48 * 60 * 60 * 1000 && cloudData.data?.length) {
        _fetchMem[key] = cloudData.data;
        try { sessionStorage.setItem('yf_' + key, JSON.stringify({ts: cloudData.ts, data: cloudData.data})); } catch {}
        // Promote to IDB for faster future reads
        const safeKey = key.replace(/[^a-zA-Z0-9_\-\.]/g,'_');
        WaveFS._idbWritePublic && WaveFS._idbWritePublic(safeKey, cloudData).catch(()=>{});
        return cloudData.data;
      }
    } catch {}
  }
  // 4c. localStorage (48h TTL, skip if forceFresh)
  if (!forceFresh) {
    try {
      const raw = localStorage.getItem('yf_' + key);
      if (raw) {
        const {ts, data} = JSON.parse(raw);
        if (Date.now() - ts < 48 * 60 * 60 * 1000) {
          _fetchMem[key] = data;
          try { sessionStorage.setItem('yf_' + key, JSON.stringify({ts, data})); } catch {}
          return data;
        } else {
          localStorage.removeItem('yf_' + key);
        }
      }
    } catch {}
  }
  // 5. Network fetch — skip entirely when CLOUD_URL is set (data already fetched at 5 PM)
  if (CLOUD_URL) throw new Error('Cloud mode: no live Yahoo fetch for ' + ticker);
  // 5. Network fetch — try multiple proxies with retry
  const url  = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=${interval}&range=${period}`;
  const url2 = `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=${interval}&range=${period}`;

  const PROXIES = [
    u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/get?url=${encodeURIComponent(u.replace('query1','query2'))}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u.replace('query1','query2'))}`,
  ];

  function parseYahoo(text) {
    let json;
    try { json = JSON.parse(text); } catch { throw new Error('Bad JSON'); }
    if (json.contents) {
      try { json = JSON.parse(json.contents); } catch { throw new Error('Bad allorigins contents'); }
    }
    const r = json?.chart?.result?.[0];
    if (!r) throw new Error('No chart data');
    return r;
  }

  // Skip tickers that failed all proxies earlier this session (avoids 16s+ delay on re-scan)
  if (_fetchFailed.has(key)) throw new Error('Skipped (all proxies failed earlier): ' + ticker);

  let r = null;
  for (let attempt = 0; attempt < PROXIES.length; attempt++) {
    try {
      const proxyUrl = PROXIES[attempt](url);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4000);
      const res = await fetch(proxyUrl, { signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      r = parseYahoo(text);
      break;
    } catch(e) {
      console.warn(`Proxy ${attempt+1} failed for ${ticker}:`, e?.message||e);
      if (attempt < PROXIES.length - 1) {
        await new Promise(ok => setTimeout(ok, 300 * (attempt + 1)));
      }
    }
  }
  if (!r) _fetchFailed.add(key); // mark so subsequent scans skip the proxy round-trip

  // Live fetch failed — fall back to ANY cached data regardless of age (stale > nothing)
  if (!r) {
    // Try WaveFS stale
    if (_waveFSRef) {
      try {
        const cached = await _waveFSRef.readYF(key);
        if (cached?.data?.length) {
          console.warn(`[WAVE] Using stale WaveFS cache for ${ticker} (live failed)`);
          _fetchMem[key] = cached.data;
          return cached.data;
        }
      } catch {}
    }
    // Try localStorage stale
    try {
      const raw = localStorage.getItem('yf_' + key);
      if (raw) {
        const {data} = JSON.parse(raw);
        if (data?.length) {
          console.warn(`[WAVE] Using stale localStorage for ${ticker} (live failed)`);
          _fetchMem[key] = data;
          return data;
        }
      }
    } catch {}
    throw new Error('All proxies failed for ' + ticker);
  }

  const ts = r.timestamp, q = r.indicators.quote[0];
  const data = ts.map((t,i) => ({
    date: new Date(t*1000).toISOString(),
    open:q.open[i]||0, high:q.high[i]||0, low:q.low[i]||0, close:q.close[i]||0, volume:q.volume[i]||0
  })).filter(c => c.open&&c.high&&c.low&&c.close);
  // Store in all caches
  _fetchMem[key] = data;
  const cacheEntry = JSON.stringify({ts: Date.now(), data});
  try { sessionStorage.setItem('yf_' + key, cacheEntry); } catch {}
  if (_waveFSRef) { _waveFSRef.writeYF(key, {ts: Date.now(), data}).catch(()=>{}); }
  try { localStorage.setItem('yf_' + key, cacheEntry); } catch(e) {
    try {
      const yfKeys = Object.keys(localStorage).filter(k=>k.startsWith('yf_'));
      const sorted = yfKeys.map(k=>{
        try { return {k, ts:JSON.parse(localStorage.getItem(k)).ts}; } catch { return {k,ts:0}; }
      }).sort((a,b)=>a.ts-b.ts);
      const toRemove = Math.max(10, Math.floor(sorted.length*0.2));
      sorted.slice(0, toRemove).forEach(({k})=>localStorage.removeItem(k));
      localStorage.setItem('yf_' + key, cacheEntry);
    } catch {}
  }
  return data;
}

/* ── ATR-based stop helper ──
   atrStop(candles, price, type, multiplier)
   Returns a stop price = price ± (multiplier × ATR14)
   BUY:  stop = entry - (mult × ATR)  — below entry
   SELL: stop = entry + (mult × ATR)  — above entry
   Falls back to fixed % if not enough candles.
*/
// ── Wyckoff Structural Stop ──
// Uses structural Wyckoff levels but caps at 3×ATR to prevent oversized stops
// on weekly timeframes where Spring low can be 10-15% below entry.
// Phase E uses tighter 1.5×ATR trail — already in trend, protect gains.
function wyckoffStop(candles, entry, type, wyckoffResult) {
  const atr = calcATR(candles);
  const atrFallback = atrStop(candles, entry, type, 2.5);
  if (!atr || atr <= 0) return atrFallback;

  if (!wyckoffResult) return atrFallback;
  const phase = wyckoffResult.phase;

  if (type === 'BUY') {
    if (phase === 'E') {
      // In markup — 2×ATR balances protection vs survival through volatile sessions
      return Math.round(entry - 2.0 * atr);
    }
    // Phase C/D: structural level preferred, capped at 3.5×ATR
    // Wider than Phase E — consolidation range oscillation is normal, stop must be outside it
    const maxStop = atr * 3.5;
    const springLow = wyckoffResult.springLow;
    const scPrice   = wyckoffResult.scPrice;
    if (springLow && springLow > 0 && entry - springLow <= maxStop) return Math.round(springLow * 0.995);
    if (scPrice   && scPrice   > 0 && entry - scPrice   <= maxStop) return Math.round(scPrice   * 0.995);
    return Math.round(entry - 3.0 * atr); // fallback: wide ATR for consolidation phase
  } else {
    if (phase === 'E') {
      return Math.round(entry + 2.0 * atr);
    }
    const maxStop = atr * 3.5;
    const bcTop = wyckoffResult.bcTopPrice;
    if (bcTop && bcTop > 0 && bcTop - entry <= maxStop) return Math.round(bcTop * 1.005);
    return Math.round(entry + 3.0 * atr);
  }
}

function calcATR(candles, period=14) {
  const n = candles.length;
  if (n < period+1) return null;
  let atr = 0;
  // First ATR = simple avg of first `period` TRs
  for (let i = n-period; i < n; i++) {
    const h = candles[i].high, l = candles[i].low;
    const pc = candles[i-1].close;
    const tr = Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc));
    atr += tr;
  }
  atr /= period;
  return atr;
}

function atrStop(candles, entryPrice, type, mult=2.5) {
  const atr = calcATR(candles);
  if (!atr || atr <= 0) {
    // Fallback to fixed %
    return type==='BUY' ? entryPrice * 0.982 : entryPrice * 1.022;
  }
  return type==='BUY'
    ? entryPrice - mult * atr
    : entryPrice + mult * atr;
}

/* ══════════════════════════════════════════════════════════════
   WAVE v1.3 — REGIME-AWARE ADAPTIVE SIGNAL FILTER
   Three-phase market regime detection drives all thresholds.
   BUY and SELL have completely separate logic trees.
   INDEX sector suppressed. Thresholds tighten/relax with market.
   ══════════════════════════════════════════════════════════════ */

// INDEX sector: zero historical hit rate — suppress from all scan results
const SUPPRESS_ALL_SECTORS = new Set(['INDEX']);

/*
  REGIME THRESHOLDS — driven by Nifty Wyckoff phase detected at scan time
  ─────────────────────────────────────────────────────────────────────────
  dist-DE : Nifty in distribution Ph D/E  → Bear regime
    BUY needs higher bar, SELL gets easier pass
    Ph D BUY hard-blocked (distribution = bad time to accumulate)
    RSI overbought BUY block is strict

  acc-DE  : Nifty in accumulation Ph D/E  → Bull regime
    BUY gets easier pass, SELL needs higher bar
    Ph D SELL hard-blocked (accumulation = bad time to short)
    RSI oversold SELL block applied

  neutral : No clear Wyckoff regime on Nifty
    Balanced thresholds, moderate guards
*/
const REGIME_PARAMS = {
  'dist-DE': {
    buyFloor:      62,
    sellFloor:     62,
    phDBuyMin:     78,   // Phase D BUY needs high conf in bear
    phDSellMin:    999,  // Phase D SELL hard-blocked in bear — SoW gets stopped by bounces (PF 0.4)
    phDSellBlock:  true, // BLOCK: only Phase E SELL has edge in bear (PF 1.5)
    rsiBuyHardBlock: 68,
    rsiBuySoftPen:  60,
    rsiSellOsBlock: 38,
    rsiSellHardBlock: 28,
    buyWeeklyReq:  true,
    sellWeeklyBan: false,
    regimeLabel:   '🐻 Bear',
  },
  'acc-DE': {
    buyFloor:      52,   // easier BUY bar in bull market
    sellFloor:     65,   // tighter SHORT bar in bull market
    phDBuyMin:     58,   // Phase D BUY fine in bull
    phDSellMin:    999,  // Phase D SELL effectively blocked in bull (phDSellBlock handles it)
    phDSellBlock:  true, // Phase D SELL hard-blocked in bull
    rsiBuyHardBlock: 80, // very relaxed RSI OB block in bull (momentum carries)
    rsiBuySoftPen:  75,
    rsiSellOsBlock: 32,  // if RSI < 32 in bull, SELL is risky (OS = could bounce)
    rsiSellHardBlock: null,
    buyWeeklyReq:  false,// BUY weekly uptrend not required in strong bull
    sellWeeklyBan: true, // SELL blocked if weekly uptrend
    regimeLabel:   '🐂 Bull',
  },
  'neutral': {
    buyFloor:      55,
    sellFloor:     60,   // raised from 55: neutral should still require decent quality
    phDBuyMin:     70,   // moderate Phase D BUY guard
    phDSellMin:    70,   // moderate Phase D SELL guard
    phDSellBlock:  false,
    rsiBuyHardBlock: 72, // moderate RSI OB block
    rsiBuySoftPen:  65,
    rsiSellOsBlock: 35,
    rsiSellHardBlock: null,
    buyWeeklyReq:  false,
    sellWeeklyBan: false,
    regimeLabel:   '〰 Neutral',
  },
};

/*
  applySmartFilters — v1.3 regime-aware
  Separate BUY / SELL logic trees, all thresholds driven by niftyPhase.
  Returns: { pass: bool, adjConf: number, tag: string|null }
*/
function applySmartFilters(type, phase, confidence, rsi14, sector, weeklyTrend, niftyPhase, rs, phCFloor=null) {
  let adjConf = confidence;
  let tag = null;

  // ── Rule 0: Suppress INDEX sector entirely (0% hit rate historically) ──
  if (SUPPRESS_ALL_SECTORS.has(sector)) {
    return { pass: false, adjConf: 0, tag: null };
  }

  // ── Select regime params ──
  const rp = REGIME_PARAMS[niftyPhase] || REGIME_PARAMS['neutral'];

  // ── Phase C override: use lower floor if provided ──
  const effectiveFloor = (phase === 'C' && phCFloor !== null)
    ? phCFloor
    : (type === 'BUY' ? rp.buyFloor : rp.sellFloor);

  // ══════════════════════════════════
  //  BUY LOGIC TREE
  // ══════════════════════════════════
  if (type === 'BUY') {
    const floor = effectiveFloor;

    // B1: Base confidence floor (regime-adjusted)
    if (adjConf < floor) {
      return { pass: false, adjConf, tag: null };
    }

    // B2: Phase D BUY guard — regime-adjusted minimum
    if (phase === 'D') {
      if (adjConf < rp.phDBuyMin) {
        return { pass: false, adjConf, tag: null };
      }
      if (rp.phDBuyMin >= 70) tag = '⚡ Ph D verified';
    }

    // B3: Nifty dist-DE hard-block Phase D BUYs
    if (niftyPhase === 'dist-DE' && phase === 'D') {
      return { pass: false, adjConf, tag: null };
    }

    // B4: RSI overbought — separate hard/soft blocks per regime
    if (rsi14 !== null) {
      if (rsi14 > rp.rsiBuyHardBlock) {
        return { pass: false, adjConf, tag: null }; // hard block — silent filter
      }
      if (rsi14 > rp.rsiBuySoftPen) {
        adjConf = Math.max(0, adjConf - 12);
        if (adjConf < floor) return { pass: false, adjConf, tag: null };
        tag = tag || `⚠ RSI ${rsi14}`;
      }
    }

    // B5: Weekly trend requirement — bear regime requires uptrend confirmation
    if (rp.buyWeeklyReq && weeklyTrend === false) {
      // Weekly downtrend in bear regime — BUY is counter-trend, penalise hard
      adjConf = Math.max(0, adjConf - 10);
      if (adjConf < floor) return { pass: false, adjConf, tag: null };
      tag = tag || '⚠ Contra-trend';
    }

    // B6: Nifty dist-DE penalty on Phase E BUYs + RS requirement
    if (niftyPhase === 'dist-DE') {
      adjConf = Math.max(0, adjConf - 8);
      if (adjConf < floor) return { pass: false, adjConf, tag: null };
      tag = tag || '⚠ Bear regime';
    }

    // B7: RS penalty — BUY in bear needs relative strength to justify counter-trend
    if (rs !== null && rs !== undefined) {
      if (rs < 0) {
        // Underperforming Nifty — counter-trend BUY with no RS makes no sense
        adjConf = Math.max(0, adjConf - 8);
        if (adjConf < floor) return { pass: false, adjConf, tag: null };
        tag = tag || `⚠ RS ${rs.toFixed(1)}%`;
      }
    }

    return { pass: true, adjConf, tag };
  }

  // ══════════════════════════════════
  //  SELL / SHORT LOGIC TREE
  // ══════════════════════════════════
  if (type === 'SELL') {
    const floor = effectiveFloor;

    // S1: Base confidence floor (regime-adjusted)
    if (adjConf < floor) {
      return { pass: false, adjConf, tag: null };
    }

    // S2: Phase D SELL hard-block in bull regime
    if (phase === 'D' && rp.phDSellBlock) {
      return { pass: false, adjConf, tag: null };
    }

    // S2b: Phase D SELL minimum confidence — in bear/neutral, SoW/Ice Break needs decent signal
    if (phase === 'D' && rp.phDSellMin && adjConf < rp.phDSellMin) {
      return { pass: false, adjConf, tag: null };
    }

    // S3: Nifty acc-DE hard-block Phase D SHORTs
    if (niftyPhase === 'acc-DE' && phase === 'D') {
      return { pass: false, adjConf, tag: null };
    }

    // S4: RSI oversold hard block — extremely OS stocks have high bounce risk
    if (rsi14 !== null && rp.rsiSellHardBlock !== null && rsi14 < rp.rsiSellHardBlock) {
      return { pass: false, adjConf, tag: null };
    }

    // S4b: RSI oversold soft penalty — mildly OS = penalise, not block
    if (rsi14 !== null && rp.rsiSellOsBlock !== null && rsi14 < rp.rsiSellOsBlock) {
      adjConf = Math.max(0, adjConf - 10);
      if (adjConf < floor) return { pass: false, adjConf, tag: null };
      tag = tag || `⚠ RSI ${rsi14} OS`;
    }

    // S5: Weekly uptrend ban — bull regime blocks SELL if weekly is up
    if (rp.sellWeeklyBan && weeklyTrend === true) {
      adjConf = Math.max(0, adjConf - 10);
      if (adjConf < floor) return { pass: false, adjConf, tag: null };
      tag = tag || '⚠ Contra-trend';
    }

    // S6: Nifty acc-DE penalty on Phase E SHORTs
    if (niftyPhase === 'acc-DE') {
      adjConf = Math.max(0, adjConf - 6);
      if (adjConf < floor) return { pass: false, adjConf, tag: null };
      tag = tag || '⚠ Bull regime';
    }

    // S7: RS bonus/penalty for SELL — weak RS confirms distribution, strong RS warns
    if (rs !== null && rs !== undefined) {
      if (rs >= 5) {
        // Stock is outperforming Nifty — shorting a relative leader is risky
        adjConf = Math.max(0, adjConf - 6);
        if (adjConf < floor) return { pass: false, adjConf, tag: null };
        tag = tag || `⚠ RS leader ${rs.toFixed(1)}%`;
      }
      // rs < 0: confirming weakness — implicit bonus via confidence (no penalty)
    }

    return { pass: true, adjConf, tag };
  }

  return { pass: true, adjConf, tag };
}

/*
  detectNiftyRegime(niftyCandles) — v1.3
  Detects Nifty Wyckoff phase from daily candles.
  Returns: 'dist-DE' | 'acc-DE' | 'neutral'
  Used both in live scan and in replay engine (per-day slice).
*/
function detectNiftyRegime(niftyCandles) {
  if (!niftyCandles || niftyCandles.length < 60) return 'neutral';
  try {
    const nAcc  = detectAccumulation(niftyCandles);
    const nDist = detectDistribution(niftyCandles);
    if (nDist && (nDist.phase==='D'||nDist.phase==='E') && nDist.confidence >= 55) return 'dist-DE';
    if (nAcc  && (nAcc.phase ==='D'||nAcc.phase ==='E') && nAcc.confidence  >= 55) return 'acc-DE';
  } catch {}
  return 'neutral';
}

/* ══════════════════════════════════════════════════════════════
   WAVE v1.5 — CAUSE & EFFECT ENGINE
   Wyckoff's Law: time in trading range (cause) determines the
   magnitude AND duration of the subsequent move (effect).
   
   outcomeWindow : how many trading days to check for the outcome
   targetMult    : fraction of measured range to use as target
                   (rangeSize × targetMult = projected move)
   ══════════════════════════════════════════════════════════════ */
function causeEffect(phase, rangeBars) {
  // Phase E — already in trend, momentum phase → fast resolution, full cause
  if (phase === 'E') {
    return { outcomeWindow: 12, targetMult: rangeBars > 50 ? 1.0 : 0.75 };
  }
  // Phase D — active breakout / retest zone → standard resolution
  if (phase === 'D') {
    if (rangeBars > 60) return { outcomeWindow: 25, targetMult: 1.00 }; // long cause → full measured move, extended window
    if (rangeBars > 25) return { outcomeWindow: 20, targetMult: 0.75 }; // standard
    return           { outcomeWindow: 15, targetMult: 0.50 };           // short cause → conservative target, tighter window
  }
  // Phase C — Spring/UTAD, still inside range → needs most time, moderate target
  return { outcomeWindow: 28, targetMult: 0.60 };
}

/* ── ACCUMULATION DETECTION ── */
function detectAccumulation(candles) {
  if (!candles||candles.length<30) return null;
  const n=candles.length;
  const closes=candles.map(c=>c.close), highs=candles.map(c=>c.high),
        lows=candles.map(c=>c.low), vols=candles.map(c=>c.volume);
  const avgVol=vols.reduce((a,b)=>a+b,0)/n;
  let scIdx=-1,arIdx=-1,springIdx=-1,jacIdx=-1,scPrice=0,arPrice=0;

  // ── Infer timeframe from candle spacing to set thresholds ──
  const _inferIsWeekly = () => {
    if(n < 2) return false;
    const d0 = new Date(candles[n-1].date), d1 = new Date(candles[n-2].date);
    return Math.abs(d0 - d1) / 86400000 >= 5;
  };
  const _isWeekly = _inferIsWeekly();
  const _scMinDrop  = _isWeekly ? 0.25 : 0.15;
  const _scLookback = _isWeekly ? 60   : 90;

  // ── Prior downtrend requirement ──
  const _validateSC = (idx) => {
    if(idx < 5) return false;
    const lookback = Math.max(0, idx - _scLookback);
    const priorHigh = Math.max(...highs.slice(lookback, idx));
    return (priorHigh - lows[idx]) / priorHigh >= _scMinDrop;
  };

  // ── Find most recent valid SC ──
  // Search backwards from n*0.75 so we catch recent accumulations.
  // Need at least n*0.25 bars after SC for AR+Spring+JAC to develop.
  // Priority 1: most recent high-volume bar that passes prior-downtrend check.
  // Priority 2: most recent lowest-low that passes prior-downtrend check.
  // Priority 3: fallback to highest-volume bar in window (keeps old behaviour).
  const _scSearchEnd   = Math.floor(n * 0.75); // allow room after SC
  const _scSearchStart = 10;

  // Pass 1: scan backwards for most recent high-vol SC with valid prior downtrend
  let found = false;
  for(let i = _scSearchEnd; i >= _scSearchStart; i--) {
    if(vols[i] > avgVol * 1.5 && _validateSC(i)) {
      scIdx = i; scPrice = lows[i]; found = true; break;
    }
  }
  // Pass 2: scan backwards for most recent lowest-low with valid prior downtrend
  if(!found) {
    for(let i = _scSearchEnd; i >= _scSearchStart; i--) {
      if(_validateSC(i) && (scIdx === -1 || lows[i] < lows[scIdx])) {
        scIdx = i; scPrice = lows[i]; found = true; break;
      }
    }
  }
  // Pass 3: fallback — highest-volume bar in window (original behaviour)
  if(!found) {
    let maxVol = 0;
    for(let i = _scSearchStart; i <= _scSearchEnd; i++) {
      if(vols[i] > maxVol) { maxVol = vols[i]; scIdx = i; }
    }
    scPrice = lows[scIdx];
  }
  // ── Timeframe-aware search windows ──
  // AR = first significant bounce after SC, not the highest point ever.
  // Daily: within 30 bars (~6 weeks). Weekly: within 12 bars (~3 months).
  // Spring: after AR, within 60 bars daily / 40 bars weekly.
  const _arWindow     = _isWeekly ? 12  : 30;
  const _springWindow = _isWeekly ? 40  : 60;
  const _springRecov  = _isWeekly ? 8   : 5;

  // AR: highest high within the tight window after SC
  let maxH=0;
  for(let i=scIdx+2;i<Math.min(scIdx+_arWindow,n-1);i++) if(highs[i]>maxH){maxH=highs[i];arIdx=i;}
  arPrice=maxH;

  // ── Spring detection ──
  // Primary: bar where low dips to/below SC and either closes above SC OR recovers above SC within window.
  // Weekly: close condition relaxed — weekly candles often close slightly below SC even on valid Springs.
  const _springCloseThresh = _isWeekly ? scPrice * 1.01 : scPrice * 0.998; // weekly: close within 1% of SC
  for(let i=arIdx+3;i<Math.min(arIdx+_springWindow,n-10);i++) {
    if(lows[i] < scPrice * 1.002 && closes[i] > _springCloseThresh) { springIdx=i; break; }
  }
  // Fallback: lowest low in window (classic Spring — just needs recovery check)
  if(springIdx===-1){
    let ml=Infinity,mi=-1;
    for(let i=arIdx+3;i<Math.min(arIdx+_springWindow,n-10);i++) if(lows[i]<ml){ml=lows[i];mi=i;}
    springIdx=mi;
  }

  // ── Spring recovery check ──
  // Must recover above SC within recovery window (weekly: 8 bars = 2 months)
  // Relaxed: recovery only needs to reach 98% of SC on weekly (wick-based Spring)
  const _recoveryThresh = _isWeekly ? scPrice * 0.98 : scPrice;
  let springValid = false;
  if(springIdx>0 && springIdx<n-1) {
    // Also accept: the spring bar itself has a close within 3% of SC on weekly
    if(_isWeekly && closes[springIdx] >= scPrice * 0.97) springValid = true;
    if(!springValid) {
      const recoveryBars = Math.min(_springRecov, n-1-springIdx);
      for(let i=1;i<=recoveryBars;i++) {
        if(closes[springIdx+i] > _recoveryThresh) { springValid=true; break; }
      }
    }
  }
  if(!springValid && springIdx>0) springIdx=-1;

  // ── v1.4 Gap 1: Spring volume quality ──
  let springVolQuality = 0;
  if(springIdx > 0 && scIdx > 0) {
    const springVol = vols[springIdx];
    const scVol     = vols[scIdx];
    if      (springVol < scVol * 0.70) springVolQuality = 2;
    else if (springVol < scVol)        springVolQuality = 1;
    else                               springVolQuality = 0;
  }

  // ── JAC detection ──
  // Daily: close above AR + volume > avgVol*1.1
  // Weekly: close above AR + volume > avgVol*0.9 (any meaningful volume is enough on weekly)
  const _jacVolThresh = _isWeekly ? avgVol * 0.9 : avgVol * 1.1;
  for(let i=(springIdx>0?springIdx+2:arIdx+10);i<n-5;i++) {
    if(closes[i] > arPrice && vols[i] > _jacVolThresh) { jacIdx=i; break; }
  }
  const lastClose=closes[n-1], volRatio=vols[n-1]/avgVol;
  const rangeSize=arPrice-scPrice, springLow=springIdx>0?lows[springIdx]:scPrice*.993;
  const target1=arPrice+rangeSize*.75, target2=arPrice+rangeSize*1.25;
  let phase="A",stageNum=2,stageName="Selling Climax / Accumulation Base",confidence=40,phClass="sp-a";
  // ── Creek retest quality after JAC ──
  let creekRetestQuality = 0; // 0=none, 1=ok, 2=textbook
  if(jacIdx>0 && jacIdx < n-3) {
    const postJacLows = lows.slice(jacIdx);
    const postJacVols = vols.slice(jacIdx);
    const avgPostVol = postJacVols.reduce((a,b)=>a+b,0)/postJacVols.length;
    const retestIdx = postJacLows.findIndex(l => l <= arPrice*1.03 && l >= arPrice*0.97);
    if(retestIdx >= 0) {
      const retestVol = postJacVols[retestIdx];
      creekRetestQuality = retestVol < avgPostVol * 0.8 ? 2 : 1; // low vol retest = textbook
    }
  }
  if(jacIdx>0){
    const rl=Math.min(...lows.slice(n-10));
    // Weekly: allow the 10-bar low to dip up to 3% below AR (normal post-JAC pullback)
    // Daily: strict — must hold above AR
    const _rlThresh = _isWeekly ? arPrice * 0.97 : arPrice * 0.99;
    const _closeThresh = _isWeekly ? arPrice * 0.97 : arPrice;
    if(rl > _rlThresh && lastClose > _closeThresh){
      if(n-1-jacIdx<15){phase="D";stageNum=9;stageName="Jump Across Creek (JAC)";confidence=75;phClass="sp-d";}
      else{
        const inLPS=(lastClose-Math.min(...lows.slice(n-5)))/lastClose<.03;
        if(inLPS){phase="D";stageNum=11;stageName="Last Point of Support (LPS)";confidence=80;phClass="sp-d";}
        else{
          // ── Markup exhaustion check ──
          const peak20 = Math.max(...highs.slice(Math.max(0,n-20)));
          const pullbackPct = (peak20 - lastClose) / peak20;
          const recentHigh10 = Math.max(...highs.slice(Math.max(0,n-10)));
          const priorHigh10  = Math.max(...highs.slice(Math.max(0,n-20),Math.max(0,n-10)));
          const lowerHighs   = recentHigh10 < priorHigh10 * 0.98;
          const markupStalling = pullbackPct > 0.08 && lowerHighs;
          if(markupStalling){
            phase="E"; stageNum=14; phClass="sp-e";
            stageName="Markup Stalling — Possible Top";
            confidence=45;
          } else {
            phase="E";stageNum=14;stageName="Range Breakout / Markup";confidence=70;phClass="sp-e";
          }
        }
      }
    } else {
      // JAC detected but price has since pulled back below AR — LPS forming or re-accumulating
      // Weekly: price pulling back to Creek after JAC is normal — classify as LPS watch zone
      const pullbackFromJac = jacIdx > 0 ? (closes[jacIdx] - lastClose) / closes[jacIdx] : 0;
      if(pullbackFromJac < 0.12) {
        // Within 12% of JAC price — still in play, LPS zone
        phase="D"; stageNum=11; stageName="Last Point of Support (LPS)"; confidence=72; phClass="sp-d";
      } else {
        // Deep pullback — back to Phase C / Spring territory
        phase="C"; stageNum=7; stageName="Spring / Secondary Test"; confidence=65; phClass="sp-c";
      }
    }
  } else if(springIdx>0){
    const rh=Math.max(...highs.slice(springIdx));
    if(rh>arPrice*.96){phase="C";stageNum=7;stageName="Spring / Secondary Test";confidence=72;phClass="sp-c";}
    else{phase="B";stageNum=6;stageName="Phase B — Creek Defined";confidence=60;phClass="sp-b";}
  } else if(scIdx>0&&arIdx>0){
