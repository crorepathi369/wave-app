          <div className="sdi" style={{color:'var(--muted)',cursor:'default',justifyContent:'center'}}>
            No match — type a valid NSE symbol (e.g. IREDA, CDSL)
          </div>
        </div>
      )}
      {/* Hint shown only briefly when dropdown is open with no results yet */}
    </div>
  );
}

/* ── SPARKLINE ── */
function drawSparkline(canvas, candles, color) {
  if (!canvas || !candles || candles.length < 2) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!W || !H) return;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const cls = candles.slice(-40).map(c => c.close);
  const mn = Math.min(...cls), mx = Math.max(...cls), rng = mx-mn||1;
  const px = i => (i/(cls.length-1))*W;
  const py = v => H - ((v-mn)/rng)*H*0.85 - H*0.075;
  ctx.clearRect(0,0,W,H);
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, color+'40'); grad.addColorStop(1, color+'00');
  ctx.beginPath(); ctx.moveTo(px(0),H);
  cls.forEach((v,i) => ctx.lineTo(px(i),py(v)));
  ctx.lineTo(px(cls.length-1),H); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath();
  cls.forEach((v,i) => i===0?ctx.moveTo(px(i),py(v)):ctx.lineTo(px(i),py(v)));
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.stroke();
}
function Sparkline({candles, positive}) {
  const ref = useRef(null);
  const color = positive ? '#1a7a42' : '#c0202e';
  useEffect(() => { if (ref.current) drawSparkline(ref.current, candles, color); }, [candles, color]);
  return <canvas ref={ref} className="sparkline" />;
}


/* ════════════════════════════════════════════════════════════════
   WaveFS — File System persistence layer
   Reads/writes to App_Wave/data/ folder on user's device.
   Falls back to localStorage when folder not connected.
   Data files are version-independent — survives any WAVE.html update.
   ════════════════════════════════════════════════════════════════ */
const WaveFS = (() => {
  let _dirHandle = null;   // App_Wave folder handle
  let _dataHandle = null;  // App_Wave/data subfolder handle
  let _histHandle = null;  // App_Wave/data/wave_hist subfolder handle
  let _yfHandle   = null;  // App_Wave/data/yf_cache subfolder handle
  const FOLDER_NAME = 'App_Wave';
  const DATA_FILES = {
    daily_log:   'daily_log.json',
    ic_weights:  'ic_weights.json',
    scan_history:'scan_history.json',
    watchlist:   'watchlist.json',
    alerts:      'alerts.json',
    prefs:       'prefs.json',
  };

  // ── IndexedDB: persist directory handle across sessions ──
  const IDB_DB   = 'wave_fs_store';
  const IDB_STORE = 'handles';
  const IDB_KEY   = 'root_dir';

  function openIDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(IDB_DB, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
      req.onsuccess = e => res(e.target.result);
      req.onerror   = () => rej(req.error);
    });
  }
  async function saveHandle(handle) {
    try {
      const db = await openIDB();
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(handle, IDB_KEY);
      await new Promise((res,rej) => { tx.oncomplete=res; tx.onerror=rej; });
      db.close();
    } catch(e) { console.warn('[WaveFS] saveHandle failed:', e.message); }
  }
  async function loadHandle() {
    try {
      const db = await openIDB();
      const tx = db.transaction(IDB_STORE, 'readonly');
      const handle = await new Promise((res,rej) => {
        const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
      db.close();
      return handle || null;
    } catch { return null; }
  }

  async function _openSubfolders(root) {
    _dirHandle  = root;  // root IS the App_Wave folder
    _dataHandle = await _dirHandle.getDirectoryHandle('data',      {create:true});
    _histHandle = await _dataHandle.getDirectoryHandle('wave_hist', {create:true});
    _yfHandle   = await _dataHandle.getDirectoryHandle('yf_cache',  {create:true});
  }

  // ── Connect to App_Wave folder (shows picker) ──
  async function connect() {
    try {
      if (!window.showDirectoryPicker) throw new Error('not supported');
      const root = await window.showDirectoryPicker({
        id: 'wave-data', mode: 'readwrite',
        startIn: 'documents',
      });
      await _openSubfolders(root);
      await saveHandle(root); // persist for auto-reconnect
      console.log('[WaveFS] Connected to', FOLDER_NAME);
      return true;
    } catch(e) {
      console.warn('[WaveFS] Connect failed:', e.message);
      return false;
    }
  }

  // ── Auto-reconnect using persisted handle (no picker needed) ──
  // Uses queryPermission() first (no user gesture needed).
  // Only calls requestPermission() from a click handler (see resumeFS).
  async function autoReconnect() {
    try {
      const root = await loadHandle();
      if (!root) return false;
      // queryPermission does NOT require a user gesture — safe to call on startup
      const perm = await root.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        // Permission was revoked or never granted in this session.
        // Store the handle so resumeFS() can use it with a button click.
        _pendingRoot = root;
        console.log('[WaveFS] Permission not yet granted — call resumeFS() from a user gesture');
        return 'needs-gesture';
      }
      await _openSubfolders(root);
      console.log('[WaveFS] Auto-reconnected to', FOLDER_NAME);
      return true;
    } catch(e) {
      console.warn('[WaveFS] Auto-reconnect failed:', e.message);
      return false;
    }
  }

  // ── Resume FS from a user gesture (button click) ──
  // Call this when autoReconnect() returns 'needs-gesture'.
  let _pendingRoot = null;
  async function resumeFS() {
    try {
      const root = _pendingRoot || await loadHandle();
      if (!root) return false;
      const perm = await root.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') return false;
      _pendingRoot = null;
      await _openSubfolders(root);
      console.log('[WaveFS] Resumed connection to', FOLDER_NAME);
      return true;
    } catch(e) {
      console.warn('[WaveFS] resumeFS failed:', e.message);
      return false;
    }
  }

  // ── Read a JSON file from data/ ──
  async function read(name) {
    if (!_dataHandle) return null;
    try {
      const fh = await _dataHandle.getFileHandle(name, {create:false});
      const file = await fh.getFile();
      const text = await file.text();
      return JSON.parse(text);
    } catch { return null; }
  }

  // ── Write a JSON file to data/ ──
  async function write(name, data) {
    if (!_dataHandle) return false;
    try {
      const fh = await _dataHandle.getFileHandle(name, {create:true});
      const writable = await fh.createWritable();
      await writable.write(JSON.stringify(data, null, 2));
      await writable.close();
      return true;
    } catch(e) { console.warn('[WaveFS] Write failed:', name, e.message); return false; }
  }

  // ── Read a stock history file from data/wave_hist/ ──
  async function readHist(symbol) {
    if (!_histHandle) return null;
    try {
      const fh = await _histHandle.getFileHandle(symbol + '.json', {create:false});
      const file = await fh.getFile();
      const text = await file.text();
      return JSON.parse(text);
    } catch { return null; }
  }

  // ── Write a stock history file to data/wave_hist/ ──
  async function writeHist(symbol, data) {
    if (!_histHandle) return false;
    try {
      const fh = await _histHandle.getFileHandle(symbol + '.json', {create:true});
      const writable = await fh.createWritable();
      await writable.write(JSON.stringify(data));
      await writable.close();
      return true;
    } catch(e) { console.warn('[WaveFS] WriteHist failed:', symbol, e.message); return false; }
  }

  // ── List all stock hist files ──
  async function listHist() {
    if (!_histHandle) return [];
    const names = [];
    try {
      for await (const [name] of _histHandle.entries()) {
        if (name.endsWith('.json')) names.push(name.replace('.json',''));
      }
    } catch {}
    return names;
  }

  // ── Smart save: try FS first, fall back to localStorage ──
  async function save(key, data) {
    const fileName = DATA_FILES[key];
    if (fileName && _dataHandle) {
      await write(fileName, data);
    }
    // Always mirror to localStorage as backup
    try { localStorage.setItem('wave_' + key === 'wave_daily_log' ? 'wave_daily_log' :
      key === 'watchlist' ? 'wyk_wl' :
      key === 'alerts' ? 'wyk_al' :
      key === 'scan_history' ? 'wave_history' :
      key === 'ic_weights' ? 'wave_ic_weights' :
      key === 'prefs' ? 'wave_prefs' : key,
      JSON.stringify(data)); } catch {}
  }

  // ── Load all data files on startup ──
  async function loadAll() {
    if (!_dataHandle) return null;
    const result = {};
    for (const [key, fileName] of Object.entries(DATA_FILES)) {
      result[key] = await read(fileName);
    }
    return result;
  }

  // ── Export full bundle to data/ ──
  async function exportBundle(dailyLog, icWeights, scanHistory, watchlist, alerts, prefs) {
    if (!_dataHandle) return false;
    await write(DATA_FILES.daily_log, dailyLog);
    await write(DATA_FILES.ic_weights, icWeights || {});
    await write(DATA_FILES.scan_history, scanHistory || []);
    await write(DATA_FILES.watchlist, watchlist || []);
    await write(DATA_FILES.alerts, alerts || []);
    await write(DATA_FILES.prefs, prefs || {});
    return true;
  }

  // ── Read/write yf scan cache (App_Wave/data/yf_cache/) ──
  async function readYF(key) {
    if (!_yfHandle) return null;
    try {
      const safe = key.replace(/[^a-zA-Z0-9_\-\.]/g,'_');
      const fh = await _yfHandle.getFileHandle(safe+'.json', {create:false});
      const file = await fh.getFile();
      const text = await file.text();
      const parsed = JSON.parse(text);
      // wave_fetch.py writes {data:[...]} with no ts — use file.lastModified as ts
      if (parsed && !parsed.ts) parsed.ts = file.lastModified;
      return parsed;
    } catch { return null; }
  }
  async function writeYF(key, data) {
    if (!_yfHandle) return false;
    // Only persist daily, weekly, and monthly timeframe files — not intraday alert fetches
    const keyInterval = key.split('|')[2];
    if (!['1d','1wk','1mo'].includes(keyInterval)) return false;
    try {
      const safe = key.replace(/[^a-zA-Z0-9_\-\.]/g,'_');
      const fh = await _yfHandle.getFileHandle(safe+'.json', {create:true});
      const writable = await fh.createWritable();
      await writable.write(JSON.stringify(data));
      await writable.close();
      // Mirror to IndexedDB for fast future reads
      _idbWrite(key, data).catch(()=>{});
      return true;
    } catch { return false; }
  }

  // ── IndexedDB: persistent yf cache — survives tab/browser close ──────────────
  // Much faster than re-reading 198 files from filesystem on every session.
  // Quota: typically 1–5 GB vs localStorage 5 MB.
  const IDB_YF_DB    = 'wave_yf_idb';
  const IDB_YF_STORE = 'yf_cache';

  function _openYFIDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(IDB_YF_DB, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_YF_STORE);
      req.onsuccess = e => res(e.target.result);
      req.onerror   = () => rej(req.error);
    });
  }

  async function _idbRead(key) {
    try {
      const db = await _openYFIDB();
      const tx = db.transaction(IDB_YF_STORE, 'readonly');
      const result = await new Promise((res, rej) => {
        const req = tx.objectStore(IDB_YF_STORE).get(key);
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
      db.close();
      return result || null;
    } catch { return null; }
  }

  async function _idbWrite(key, data) {
    try {
      const db = await _openYFIDB();
      const tx = db.transaction(IDB_YF_STORE, 'readwrite');
      tx.objectStore(IDB_YF_STORE).put(data, key);
      await new Promise((res, rej) => { tx.oncomplete=res; tx.onerror=rej; });
      db.close();
    } catch {}
  }

  async function _idbDelete(key) {
    try {
      const db = await _openYFIDB();
      const tx = db.transaction(IDB_YF_STORE, 'readwrite');
      tx.objectStore(IDB_YF_STORE).delete(key);
      await new Promise((res, rej) => { tx.oncomplete=res; tx.onerror=rej; });
      db.close();
    } catch {}
  }

  // Read from IndexedDB (fast persistent cache)
  async function readYFIDB(key) {
    return _idbRead(key);
  }

  // Flush: clear all IndexedDB yf cache entries
  async function flushYFIDB() {
    try {
      const db = await _openYFIDB();
      const tx = db.transaction(IDB_YF_STORE, 'readwrite');
      tx.objectStore(IDB_YF_STORE).clear();
      await new Promise((res, rej) => { tx.oncomplete=res; tx.onerror=rej; });
      db.close();
      // Reset warm timestamp so next warm re-reads every file from scratch
      try { localStorage.removeItem('wave_idb_warm_ts'); } catch {}
      console.log('[WaveFS] IndexedDB yf cache flushed');
      return true;
    } catch { return false; }
  }

  // Warm IndexedDB from WaveFS files.
  // Incremental: only reads files whose lastModified is newer than the last warm time.
  // On first run (or after Flush) lastWarm=0 so every file is read.
  // Returns total file count (not just written this round) for the "N indexed" display.
  async function warmIDBFromFS(onProgress) {
    if (!_yfHandle) return 0;
    let written = 0;
    try {
      // Load last warm timestamp — skip files unchanged since then
      let lastWarm = 0;
      try { lastWarm = parseInt(localStorage.getItem('wave_idb_warm_ts') || '0', 10); } catch {}

      const entries = [];
      for await (const [name, fh] of _yfHandle.entries()) {
        // Skip 1H timeframe files — not used
        if (name.endsWith('.json') && fh.kind === 'file' && /_1d|_1wk|_1mo/.test(name)) entries.push([name, fh]);
      }
      console.log(`[WaveFS] warmIDBFromFS: ${entries.length} files, lastWarm=${lastWarm ? new Date(lastWarm).toLocaleTimeString() : 'never'}`);

      for (let i = 0; i < entries.length; i++) {
        const [name, fh] = entries[i];
        try {
          const file = await fh.getFile();
          if (onProgress) onProgress(i + 1, entries.length);
          // Skip files that haven't changed since last warm — already in IDB
          if (lastWarm > 0 && file.lastModified <= lastWarm) continue;
          const text = await file.text();
          const data = JSON.parse(text);
          // wave_fetch.py writes {data:[...]} with no ts — use file.lastModified
          if (data && !data.ts) data.ts = file.lastModified;
          await _idbWrite(name.replace('.json', ''), data);
          written++;
        } catch {}
      }

      // Save warm time so the next warm only processes files added/updated after this point
      try { localStorage.setItem('wave_idb_warm_ts', Date.now().toString()); } catch {}
      console.log(`[WaveFS] IDB warm done: ${written} written, ${entries.length - written} skipped (unchanged)`);
      return entries.length; // total indexed count for UI display
    } catch(e) { console.warn('[WaveFS] warmIDBFromFS error:', e.message); }
    return 0;
  }

  // Count IDB entries
  async function countYFIDB() {
    try {
      const db = await _openYFIDB();
      const tx = db.transaction(IDB_YF_STORE, 'readonly');
      const count = await new Promise((res, rej) => {
        const req = tx.objectStore(IDB_YF_STORE).count();
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
      db.close();
      return count;
    } catch { return 0; }
  }

  const isConnected = () => !!_dataHandle;
  const isSupported = () => !!window.showDirectoryPicker;

  return { connect, autoReconnect, resumeFS, read, write, readHist, writeHist, listHist,
           readYF, writeYF, readYFIDB, flushYFIDB, warmIDBFromFS, countYFIDB,
           save, loadAll, exportBundle, isConnected, isSupported,
           _idbWritePublic: _idbWrite,
           DATA_FILES };
})();

  // ── Storage usage ──
  const computeStorageInfo = () => {

      }
      const total = yfBytes+logBytes+otherBytes;

      setStorageInfo({yfMB:(yfBytes/1048576).toFixed(1), logMB:(logBytes/1048576).toFixed(1),
        otherMB:(otherBytes/1048576).toFixed(1), totalMB:(total/1048576).toFixed(1),

  // ── Daily log merge: component-level so accessible from JSX ──
  const mergeDailyLogs = (imported) => {

      Object.entries(imported).forEach(([date, imp]) => {
        if (!next[date]) {
          next[date] = imp;
          added++;
        } else {
          const existing = next[date];
          let changed = false;
          if (!existing.pre && imp.pre) { next[date].pre = imp.pre; changed=true; }
          if (imp.post) {
            if (!existing.post || imp.post.scans.length > existing.post.scans.length) {
              next[date].post = imp.post; changed=true;
            }
          }
          if (imp.outcomes?.length) {
            if (!existing.outcomes || imp.outcomes.length > existing.outcomes.length) {
              next[date].outcomes = imp.outcomes;
              next[date].outcomeSource = imp.outcomeSource;
              changed=true;
            }
          }
          if (changed) updated++;
        }

  const addAlert = (sym,yahoo,price,above) => setAlerts(p=>[...p.filter(a=>!(a.symbol===sym&&a.above===above)),{symbol:sym,yahoo,price:parseFloat(price),above}]);
  const removeAlert = (sym,price) => setAlerts(p=>p.filter(a=>!(a.symbol===sym&&a.price===price)));

  // ══ BACKFILL ENGINE ══════════════════════════════════════
  // Fetches 1y history for F&O+Indices, replays Wyckoff day-by-day (no lookahead)
  // Stores results into daily log as 'backfill' source
  // ── FETCH HISTORY — download 2Y OHLCV for all F&O + Indices, store locally ──
  const HIST_KEY = sym => 'wave_hist_' + sym;
  const HIST_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days
  // Compact candle storage: [date10, open, high, low, close, volume] — ~60% smaller than full objects
  const packCandles   = cs => cs.map(c => [c.date.slice(0,10), +c.open.toFixed(2), +c.high.toFixed(2), +c.low.toFixed(2), +c.close.toFixed(2), c.volume|0]);
  const unpackCandles = ps => ps.map(p => ({date:p[0], open:p[1], high:p[2], low:p[3], close:p[4], volume:p[5]}));

  const fetchHistory = async () => {
    fetchCancelRef.current = false;

    Object.keys(_sectorScanCache).forEach(k => delete _sectorScanCache[k]);

    setFetchProgress({step:'Starting…', pct:0, done:0, total:0, cached:0, fresh:0, failed:0});
    // Clear yf_ scan cache to free space for wave_hist_ (they compete for 5MB)
    try {
      Object.keys(localStorage).filter(k=>k.startsWith('yf_')).forEach(k=>localStorage.removeItem(k));
    } catch {}
    const tf = {period:'2y', interval:'1d'};
    // Keep only last 18 months (~375 trading days) — enough for full Wyckoff A/B/C/D/E phases
    const MAX_BARS = 375;
    const universe = [...ALL_STOCKS.filter(s => s.fno || s.cap === 'index')];
    const total = universe.length;
    let cached=0, fresh=0, failed=0;

    for (let i=0; i<total; i++) {

        setFetching(false); return;
      }
      const stock = universe[i];

      // Check existing stored history — priority: WaveFS wave_hist/ → localStorage → live fetch
      // Format on disk: {ts, c: [[date10,o,h,l,c,v], ...]}  (packed — matches wave_fetch.py --hist)
      let alreadyFresh = false;
      // 1. WaveFS wave_hist/ (written by wave_fetch.py --hist — fastest, zero network)
      if (!alreadyFresh && fsConnected) {
        try {
          const r = await WaveFS.readHist(stock.symbol);
          if (r?.ts && Date.now() - r.ts < HIST_TTL && r.c?.length >= 60) alreadyFresh = true;
        } catch {}
      }

      if (!alreadyFresh) {

          if (stored) {

        } catch {}
      }

      setFetchProgress({step:(alreadyFresh?'✓ ':'')+stock.symbol+' ('+fresh+' new · '+failed+' failed)',
        pct:Math.round(i/total*100), done:i, total, cached, fresh, failed});

      if (!alreadyFresh) {
        try {
          const candles = await fetchOHLCV(stock.yahoo, tf.period, tf.interval, true);
          if (candles && candles.length >= 60) {
            const trimmed = candles.slice(-MAX_BARS);
            const packed = JSON.stringify({ts:Date.now(), c:packCandles(trimmed)});
            // Save to FS if connected (primary), localStorage as backup
            if (fsConnected) {
              WaveFS.writeHist(stock.symbol, {ts:Date.now(), c:packCandles(trimmed)}).catch(()=>{});
            }
            try {
              localStorage.setItem(HIST_KEY(stock.symbol), packed);
            } catch(e) {
              // Quota hit — evict oldest wave_hist_ entries
              try {
                const histKeys = Object.keys(localStorage).filter(k=>k.startsWith('wave_hist_'));
                const sorted = histKeys.map(k=>{
                  try { return {k, ts:JSON.parse(localStorage.getItem(k)).ts}; } catch { return {k,ts:0}; }
                }).sort((a,b)=>a.ts-b.ts);
                // Evict oldest 40% to make meaningful room
                sorted.slice(0, Math.max(20, Math.floor(sorted.length*0.4))).forEach(({k})=>localStorage.removeItem(k));
                localStorage.setItem(HIST_KEY(stock.symbol), packed);
              } catch {}
            }
            fresh++;
          } else failed++;
        } catch { failed++; }
        await new Promise(r=>setTimeout(r,80));
      } else cached++;
    }

    setFetchProgress({step:`Done — ${fresh} fetched · ${cached} cached · ${failed} failed`,
      pct:100, done:total, total, cached, fresh, failed});
    // continue to Step 1b below…

    // ── Step 1b: Fetch sector index HTF candles (daily/weekly/monthly) ──
    // Stored as SECTOR_{SECTOR}_{interval} in wave_hist for instant replay access
    setFetchProgress({step:'Fetching sector index HTF candles…', pct:0, done:0, total:0, cached:0, fresh:0, failed:0});
    const htfIntervals = [
      {interval:'1wk', period:'5y'},   // for 1D scan HTF
      {interval:'1mo', period:'10y'},  // for 1W scan HTF
    ];
    const sectorEntries = Object.entries(SECTOR_INDEX_MAP);
    let sIdx = 0;
    const sTotal = sectorEntries.length * htfIntervals.length;
    for (const [sector, yahoo] of sectorEntries) {
      for (const htf of htfIntervals) {
        if (fetchCancelRef.current) break;
        sIdx++;
        const sKey = sectorHistKey(sector, htf.interval);
        setFetchProgress({step:`Sector HTF ${sector} ${htf.interval}`, pct:Math.round(sIdx/sTotal*100), done:sIdx, total:sTotal, cached:0, fresh:0, failed:0});
        // Check 7-day cache — priority: WaveFS wave_hist/ → localStorage
        let alreadyCached = false;
        // 1. WaveFS wave_hist/ first (written by wave_fetch.py --hist)
        if (!alreadyCached && fsConnected) {
          try { const r = await WaveFS.readHist(sKey); if (r?.ts && Date.now()-r.ts < HIST_TTL && r.c?.length >= 12) alreadyCached = true; } catch {}
        }
        // 2. localStorage fallback
        if (!alreadyCached) {
          try {
            const st = localStorage.getItem('wave_hist_' + sKey);
            if (st) { const p = JSON.parse(st); if (p?.ts && Date.now()-p.ts < HIST_TTL && p.c?.length >= 12) alreadyCached = true; }
          } catch {}
        }
        if (!alreadyCached) {
          try {
            const data = await fetchOHLCV(yahoo, htf.period, htf.interval, true);
            if (data?.length >= 12) {
              const packed = {ts:Date.now(), c:packCandles(data.slice(-500))};
              if (fsConnected) WaveFS.writeHist(sKey, packed).catch(()=>{});
              try { localStorage.setItem('wave_hist_' + sKey, JSON.stringify(packed)); } catch {}
            }
          } catch {}
          await new Promise(r=>setTimeout(r,60));
        }
      }
    }
    setFetchProgress({step:`Sector HTF done — ${sectorEntries.length} sectors × 3 intervals`, pct:100, done:sTotal, total:sTotal, cached:0, fresh:0, failed:0});
    setFetching(false);
  }; // end fetchHistory

  // ── RUN REPLAY — walk-forward analysis using stored wave_hist_ data ──
  const runReplay = async () => {
    replayCancelRef.current = false;
    setReplaying(true);
    setReplayProgress({step:'Loading history…', pct:0, done:0, total:0, days:0});
    try {
      const BACKFILL_DAYS = 60;
      const universe = [...ALL_STOCKS.filter(s => s.fno || s.cap === 'index')];
      const candleDate = c => (c.date||'').slice(0,10);

      // ── Load from localStorage ──
      const histMap = {};
      let loaded=0, missing=0;
      // Load from FS if connected (primary), fall back to localStorage
      for (const stock of universe) {
        try {
          let parsed = null;
          if (fsConnected) {
            parsed = await WaveFS.readHist(stock.symbol);
          }
          if (!parsed) {
            const stored = localStorage.getItem(HIST_KEY(stock.symbol));
            if (stored) parsed = JSON.parse(stored);
          }
          if (parsed) {
            const candles = parsed.c ? unpackCandles(parsed.c) : null;
            if (candles?.length >= 60) { histMap[stock.symbol] = candles; loaded++; }
            else missing++;
          } else missing++;
        } catch { missing++; }
      }
      setReplayProgress({step:`Loaded ${loaded} stocks (${missing} missing — run Fetch first)`, pct:2, done:0, total:0, days:0});
      if (missing > universe.length * 0.7) {
        alert(`Only ${loaded}/${universe.length} stocks have history (need at least ${Math.ceil(universe.length*0.3)}).\nPlease run ⬇ Fetch 2Y History first.`);
        setReplaying(false); return;
      }
      await new Promise(r=>setTimeout(r,100));

      // ── Build calendar from Nifty ──
      const niftyAll = histMap['NIFTY'];
      if (!niftyAll || niftyAll.length < BACKFILL_DAYS+1) {
        alert('Nifty history missing. Please run Fetch History first.');
        setReplaying(false); return;
      }
      const allDates = niftyAll.map(candleDate);
      const tradingDates = allDates.slice(-(BACKFILL_DAYS+2));

      // ── Load sector HTF candles from wave_hist (fetched in Step 1) ──
      setReplayProgress({step:'Loading sector HTF candles from history…', pct:3, done:0, total:0, days:0});
      const weeklyIndexMap = {};   // sector → weekly candles (for 1D scan HTF)
      const sectorCandlesMap = {}; // sector → daily candles (for sectorRs vs Nifty)
      const htfDailyMap   = {};    // sector → daily candles  (1H→daily HTF)
      const htfMonthlyMap = {};    // sector → monthly candles (1W→monthly HTF)

      for (const [sector] of Object.entries(SECTOR_INDEX_MAP)) {
        if(replayCancelRef.current) break;
        // Load daily sector (for sectorRs and 1H HTF)
        const dKey = sectorHistKey(sector, '1d');
        let dData = null;
        try { const r = await WaveFS.readHist(dKey); if (r?.c) dData = unpackCandles(r.c); } catch {}
        if (!dData) {
          try { const r = localStorage.getItem('wave_hist_' + dKey); if(r) { const p=JSON.parse(r); dData=unpackCandles(p.c); } } catch {}
        }
        if (dData?.length >= 20) { sectorCandlesMap[sector] = dData; htfDailyMap[sector] = dData; }

        // Load weekly sector (for 1D scan HTF)
        const wKey = sectorHistKey(sector, '1wk');
        let wData = null;
        try { const r = await WaveFS.readHist(wKey); if (r?.c) wData = unpackCandles(r.c); } catch {}
        if (!wData) {
          try { const r = localStorage.getItem('wave_hist_' + wKey); if(r) { const p=JSON.parse(r); wData=unpackCandles(p.c); } } catch {}
        }
        if (wData?.length >= 22) weeklyIndexMap[sector] = wData;

        // Load monthly sector (for 1W scan HTF)
        const mKey = sectorHistKey(sector, '1mo');
        let mData = null;
        try { const r = await WaveFS.readHist(mKey); if (r?.c) mData = unpackCandles(r.c); } catch {}
        if (!mData) {
          try { const r = localStorage.getItem('wave_hist_' + mKey); if(r) { const p=JSON.parse(r); mData=unpackCandles(p.c); } } catch {}
        }
        if (mData?.length >= 12) htfMonthlyMap[sector] = mData;
      }
      const hasMTF = Object.keys(weeklyIndexMap).length > 0;

      // ── Walk-forward replay (identical logic to original backfill) ──
      const newLog = {};
      for (let di=0; di < tradingDates.length-1; di++) {
        if (replayCancelRef.current) {
          setReplayProgress(p=>({...p, step:`Cancelled after ${di} days`, pct:0}));
          setReplaying(false); return;
        }
        const dateKey = tradingDates[di];
        const nextDate = tradingDates[di+1];
        setReplayProgress({step:`Replaying ${dateKey}`, pct:5+Math.round(di/(tradingDates.length-1)*90), done:di, total:tradingDates.length-1, days:di});

        let niftyIdx = niftyAll.findIndex(c => candleDate(c) === dateKey);
        if (niftyIdx < 0) niftyIdx = niftyAll.reduce((best,c,i) => candleDate(c) <= dateKey ? i : best, -1);
        if (niftyIdx < 30) continue;
        const niftySlice = niftyAll.slice(0, niftyIdx+1);

        const dayScansBuy = [], dayScansSell = [];

        for (const stock of universe) {
          const allCandles = histMap[stock.symbol];
          if (!allCandles || allCandles.length < 30) continue;
          let idx = allCandles.findIndex(c => candleDate(c) === dateKey);
          if (idx < 0) idx = allCandles.reduce((best,c,i) => candleDate(c) <= dateKey ? i : best, -1);
          if (idx < 30) continue;
          const candles = allCandles.slice(0, idx+1);
          const n = candles.length;
          try {
            const sC=candles[n-1].close, sB=candles[Math.max(0,n-20)].close;
            const nC=niftySlice[niftySlice.length-1].close, nB=niftySlice[Math.max(0,niftySlice.length-20)].close;
            const rs = parseFloat(((sC-sB)/sB*100-(nC-nB)/nB*100).toFixed(1));
            let rsi14=null;
            if(n>=15){
              const period=14, cls=candles.map(c=>c.close);
              let avgG=0,avgL=0;
              for(let i=n-period;i<n;i++){const d=cls[i]-cls[i-1];if(d>0)avgG+=d;else avgL+=Math.abs(d);}
              avgG/=period;avgL/=period;
              for(let i=n-period+1;i<n;i++){const d=cls[i]-cls[i-1];avgG=(avgG*(period-1)+(d>0?d:0))/period;avgL=(avgL*(period-1)+(d<0?Math.abs(d):0))/period;}
              rsi14=avgL===0?100:parseFloat((100-100/(1+avgG/avgL)).toFixed(1));
            }
            const avgVol20=candles.slice(n-21,n-1).reduce((s,c)=>s+c.volume,0)/20;
            const volRatioLast=avgVol20>0?parseFloat((candles[n-1].volume/avgVol20).toFixed(1)):1;
            const last5Spreads=candles.slice(n-5).map(c=>(c.high-c.low)/c.close*100);
            const avgSpread5=last5Spreads.reduce((a,b)=>a+b,0)/5;
            const allSpreads=candles.slice(Math.max(0,n-30),n-1).map(c=>(c.high-c.low)/c.close*100);
            const avgSpread30=allSpreads.reduce((a,b)=>a+b,0)/allSpreads.length;
            const spreadContraction=avgSpread30>0?avgSpread5/avgSpread30:1;
            const acc=detectAccumulation(candles), dist=detectDistribution(candles);
            if(acc){
              const rangeBars=acc.jacIdx>0?acc.jacIdx-acc.scIdx:acc.springIdx>0?acc.springIdx-acc.scIdx:acc.arIdx-acc.scIdx;
              // v1.4 Gap 3 (acc replay): LPS retest vol quality
              let _lpsRVQ=0;
              if(acc.jacIdx>0&&acc.jacIdx<candles.length-3){const pj=candles.slice(acc.jacIdx);const apv=pj.reduce((s,c)=>s+c.volume,0)/pj.length;const lb=pj.find(c=>c.low<=acc.arPrice*1.03&&c.low>=acc.arPrice*0.97);if(lb)_lpsRVQ=lb.volume<apv*0.65?2:lb.volume<apv*0.85?1:0;}
              acc.confidence=scoreConfidence(acc.confidence,'acc',{
                volRatioSC:(acc.scIdx>0&&candles[acc.scIdx])?candles[acc.scIdx].volume/acc.avgVol:1,
                rangeBars,rangeSize:acc.rangeSize,lastClose:acc.lastClose,
                rs,rsi14,volRatioLast,rr:acc.rrNum,phase:acc.phase,
                spreadContraction,hasSpring:acc.springIdx>0,hasJAC:acc.jacIdx>0,
                creekRetestQuality:acc.creekRetestQuality||0,
                springVolQuality:acc.springVolQuality||0,
                lpsRetestVolQuality:_lpsRVQ,
                hasUTAD:false,hasSOW:false,hasLPSY:false,
                sectorRsBonus: (() => {
                  const sc = sectorCandlesMap?.[stock.sector]; // sector daily candles at slice time
                  const nc = niftySlice;
                  if (!sc || sc.length < 20 || !nc || nc.length < 20) return 0;
                  const sRet = (sc[sc.length-1].close - sc[sc.length-20].close) / sc[sc.length-20].close * 100;
                  const nRet = (nc[nc.length-1].close - nc[nc.length-20].close) / nc[nc.length-20].close * 100;
                  const sr = sRet - nRet;
                  return sr >= 5 ? 4 : sr >= 2 ? 2 : sr <= -5 ? -4 : sr <= -2 ? -2 : 0;
                })(),
              });
              // Weekly trend bonus for accumulation in replay
              const _wBuy = weeklyIndexMap[stock.sector]||weeklyIndexMap['INDEX'];
              const _wtBuy = _wBuy ? isWeeklyUptrend(_wBuy) : null;
              if (_wtBuy !== null) acc.confidence = Math.min(95, Math.max(10, acc.confidence + (_wtBuy ? +8 : -5)));
            }
            if(dist){
              const rangeBarsD=dist.sokIdx>0?dist.sokIdx-dist.bcIdx:dist.utadIdx>0?dist.utadIdx-dist.bcIdx:dist.arIdx-dist.bcIdx;
              // v1.4 Gap 3 (dist replay): LPSY retest vol quality
              let _lpsyRVQ=0;
              if(dist.sokIdx>0&&dist.sokIdx<candles.length-3){const ps=candles.slice(dist.sokIdx);const apv=ps.reduce((s,c)=>s+c.volume,0)/ps.length;const lb=ps.find(c=>c.high>=dist.icePrice*0.97&&c.high<=dist.icePrice*1.03);if(lb)_lpsyRVQ=lb.volume<apv*0.65?2:lb.volume<apv*0.85?1:0;}
              dist.confidence=scoreConfidence(dist.confidence,'dist',{
                volRatioSC:(dist.bcIdx>0&&candles[dist.bcIdx])?candles[dist.bcIdx].volume/dist.avgVol:1,
                rangeBars:rangeBarsD,rangeSize:dist.rangeSize,lastClose:dist.lastClose,
                rs,rsi14,volRatioLast,rr:dist.rrNum,phase:dist.phase,
                spreadContraction,hasSpring:false,hasJAC:false,
                hasUTAD:dist.utadIdx>0,hasSOW:dist.sokIdx>0,hasLPSY:dist.lpsy1>0,
                stUtadVolQuality:dist.stUtadVolQuality||0,
                stUtVolQuality:dist.stUtVolQuality||0,
                lpsRetestVolQuality:_lpsyRVQ,
                sectorRsBonus: (() => {
                  const sc = sectorCandlesMap?.[stock.sector];
                  const nc = niftySlice;

              const causedT = acc.rangeSize>0 ? acc.arPrice+acc.rangeSize*accMult : acc.target1;
              const bT = Math.round(causedT>bE ? causedT : acc.target1);
              const rr = acc.rangeSize>0?((bT-bE)/(bE-bSt)).toFixed(1):'\u2014';
              dayScansBuy.push({
                symbol:stock.symbol, name:stock.name, sector:stock.sector, type:'BUY',
                phase:acc.phase, confidence:acc.confidence,
                entry:bE, stop:bSt, target:bT,
                rangeBars:accRB, outcomeWindow:accOW,
                rs, rsi14, lastClose, rr, pctChg, cap:stock.cap, volSignal:null,
              });
            }
            if (showSell) {
              const sE = dist.phase==='C'&&dist.bcTopPrice>0 ? Math.round(dist.bcTopPrice*0.997)
                       : dist.phase==='E' ? Math.round(lastClose*0.998)
                       : Math.round(dist.icePrice*1.005);
              const sSt = Math.round(wyckoffStop(candles,sE,"SELL",dist));
              // v1.5: cause-scaled target
              const distRB = dist.sokIdx>0?dist.sokIdx-dist.bcIdx:dist.utadIdx>0?dist.utadIdx-dist.bcIdx:dist.arIdx>0?dist.arIdx-dist.bcIdx:20;
              const {outcomeWindow:distOW, targetMult:distMult} = causeEffect(dist.phase, distRB);
              const causedTS = dist.rangeSize>0 ? dist.icePrice-dist.rangeSize*distMult : dist.target1;
              const sT = Math.round(causedTS<sE ? causedTS : dist.target1);
              const rr = dist.rangeSize>0?((sE-sT)/(sSt-sE)).toFixed(1):'\u2014';
              dayScansSell.push({
                symbol:stock.symbol, name:stock.name, sector:stock.sector, type:'SELL',
                phase:dist.phase, confidence:dist.confidence,
                entry:sE, stop:sSt, target:sT,
                rangeBars:distRB, outcomeWindow:distOW,
                rs, rsi14, lastClose, rr, pctChg, cap:stock.cap, volSignal:null,
              });
            }
          } catch {}
        }

        if (dayScansBuy.length + dayScansSell.length === 0) continue;

        // Next day OHLC - use High/Low for realistic checks
        const nextDayMap = {};
        for (const stock of universe) {
          const allCandles = histMap[stock.symbol];
          if (!allCandles) continue;
          const nextIdx = allCandles.findIndex(c => candleDate(c) === nextDate);
          if (nextIdx >= 0) nextDayMap[stock.symbol] = {high:allCandles[nextIdx].high,low:allCandles[nextIdx].low,close:allCandles[nextIdx].close};
        }

        // Compute outcomes using next day High/Low
        const allSignals = [...dayScansBuy, ...dayScansSell];
        const outcomes = [];
        allSignals.forEach(pre => {
          const nd = nextDayMap[pre.symbol];
          if (!nd) return;
          const {high:dayHigh, low:dayLow, close:eodPrice} = nd;
          const entryHit = pre.type==='BUY' ? dayLow<=pre.entry*1.015 : dayHigh>=pre.entry*0.985;
          const targetHit = entryHit && (pre.type==='BUY' ? dayHigh>=pre.target : dayLow<=pre.target);
          const stopHit   = entryHit && (pre.type==='BUY' ? dayLow<=pre.stop   : dayHigh>=pre.stop);
          const directionHit = entryHit && (targetHit || (!stopHit && (pre.type==='BUY' ? eodPrice>pre.entry : eodPrice<pre.entry)));
          const bestPrice = pre.type==='BUY' ? dayHigh : dayLow;
          const magnitude = pre.type==='BUY'
            ? parseFloat(((bestPrice-pre.entry)/pre.entry*100).toFixed(2))
            : parseFloat(((pre.entry-bestPrice)/pre.entry*100).toFixed(2));
          const dayMove   = parseFloat(((eodPrice-pre.lastClose)/pre.lastClose*100).toFixed(2));
          outcomes.push({
            symbol:pre.symbol, name:pre.name, sector:pre.sector, cap:pre.cap,
            type:pre.type, phase:pre.phase, phaseType:pre.phase==='E'?'confirmatory':'predictive',
            preEntry:pre.entry, preStop:pre.stop, preTarget:pre.target,
            preClose:pre.lastClose, preConf:pre.confidence,
            eodPrice, dayHigh, dayLow, directionHit, magnitude, entryHit, stopHit, targetHit, dayMove,
            rs:pre.rs, rsi14:pre.rsi14, volSignal:null,
          });
        });

        newLog[dateKey] = {
          post: { time:'EOD', tf:'Daily', universe:'F&O+IDX', scans: allSignals, source:'backfill' },
          outcomes: outcomes.sort((a,b)=>a.directionHit===b.directionHit?b.magnitude-a.magnitude:a.directionHit?-1:1),
          outcomeSource: nextDate,
          source: 'backfill',
        };

        await new Promise(r=>setTimeout(r,0)); // yield to UI
      }

      // ── Step 4: Merge into daily log (live data takes priority) ──
      setBfProgress({step:'Saving to daily log…', pct:97, done:0, total:0, days:Object.keys(newLog).length});
      setDailyLog(prev => {
        const next = {...prev};
        let added=0, skipped=0, filled=0;
        Object.entries(newLog).forEach(([date, entry]) => {
          if (!next[date]) {
            next[date] = entry; added++;
          } else if (next[date].source === 'backfill') {
            const existing = new Set((next[date].post?.scans||[]).map(s=>s.symbol));
            const newScans = (entry.post?.scans||[]).filter(s=>!existing.has(s.symbol));
            if (newScans.length > 0) { next[date].post={...next[date].post,scans:[...(next[date].post.scans||[]),...newScans]}; next[date].outcomes=entry.outcomes; filled++; }
            else skipped++;
          } else skipped++;
        });
        saveDailyLog(next);
        return next;
      });

    } catch(err) {
      setBfProgress(p=>({...p, step:'Error: '+err.message, pct:0}));
    }
    setBackfilling(false);
  };
  // ══ END BACKFILL ENGINE ════════════════════════════════════

  // ── Analysis: aggregate all outcomes from daily log ──
  const computeAnalysis = (log) => {
    const allOutcomes = [];
    Object.values(log).forEach(day => {
      if (day.outcomes?.length) allOutcomes.push(...day.outcomes);
    });
    if (!allOutcomes.length) return null;

    // Split fresh (in-zone) vs stale signals
    const fresh = allOutcomes.filter(o => !o.isStale);
    const totalStaleCount = allOutcomes.filter(o => o.isStale).length
      + Object.values(log).reduce((s,d)=>s+(d.staleCount||0),0);
    // Use fresh signals for stats — stale tracked but excluded from P&L
    const working = fresh.length >= 5 ? fresh : allOutcomes;

    const entryReached = working.filter(o => o.entryHit);
    const entryMissed  = working.filter(o => !o.entryHit);
    const entryHitRate = working.length ? Math.round(entryReached.length/working.length*100) : 0;
    // Always use only entered signals for hit rate — missed signals are irrelevant to P&L
    const tradeable = entryReached;
    const total = tradeable.length;
    if (!total) return null; // no entered signals at all
    const hits        = tradeable.filter(o=>o.directionHit).length;
    const targetHits  = tradeable.filter(o=>o.targetHit).length;
    const stopHits    = tradeable.filter(o=>o.stopHit).length;
    // Half-target: price reached at least 50% of the way to target (partial exit / trailing stop)
    const halfTargetHits = tradeable.filter(o=>{
      if(!o.entryHit) return false;
      const rr = (o.rMultiple !== null && o.rMultiple !== undefined) ? o.rMultiple : null;
      if(rr !== null) return rr >= 0.5; // at least +0.5R
      // fallback: magnitude ≥ 50% of (target-entry)/entry
      if(!o.preTarget || !o.preEntry) return o.magnitude > 0;
      const fullMove = Math.abs((o.preTarget - o.preEntry) / o.preEntry * 100);
      return o.magnitude >= fullMove * 0.5;
    }).length;
    // 1R+ move: moved at least +1R in right direction (strong signal quality measure)
    const oneRHits = tradeable.filter(o=>o.rMultiple !== null && o.rMultiple !== undefined && o.rMultiple >= 1.0).length;

    // ── R:R normalized PF (only signals where entry was hit have rMultiple) ──
    const hasRR = tradeable.some(o => o.rMultiple !== null && o.rMultiple !== undefined);
    const rTradeable = hasRR ? tradeable.filter(o => o.rMultiple !== null && o.rMultiple !== undefined) : tradeable;
    // Use rMultiple sign as ground truth — positive = profitable exit, negative = loss
    // This handles: stopHit (-1R), targetHit (+RRR), open-winning (+xR), open-losing (-xR)
    const wins   = rTradeable.filter(o => hasRR ? o.rMultiple > 0 : o.magnitude > 0);
    const losses = rTradeable.filter(o => hasRR ? o.rMultiple < 0 : o.magnitude < 0);
    const avgWinR  = wins.length   ? wins.reduce((s,o)=>s+(hasRR?o.rMultiple:o.magnitude),0)/wins.length   : 0;
    const avgLossR = losses.length ? losses.reduce((s,o)=>s+Math.abs(hasRR?o.rMultiple:o.magnitude),0)/losses.length : 0;
    const grossWin  = wins.reduce((s,o)=>s+(hasRR?o.rMultiple:o.magnitude),0);
    const grossLoss = losses.reduce((s,o)=>s+Math.abs(hasRR?o.rMultiple:o.magnitude),0);
    const pf = grossLoss>0 ? (grossWin/grossLoss).toFixed(2) : '∞';
    // Expectancy per trade in R (only over entered signals)
    const rTotal = rTradeable.length;
    const rHits  = wins.length;
    const expectancy = rTotal>0 ? parseFloat(((grossWin - grossLoss)/rTotal).toFixed(2)) : 0;

    // Factor breakdown helper — use R multiples where available
    const bucket = () => ({t:0,h:0,wSum:0,lSum:0});
    const add = (b,o) => {
      const val = (hasRR && o.rMultiple !== null && o.rMultiple !== undefined) ? o.rMultiple : o.magnitude;
      b.t++;
      if(val > 0){ b.h++; b.wSum+=val; }
      else if(val < 0){ b.lSum+=Math.abs(val); }
      // val === 0: breakeven, count in total but neither win nor loss
    };
    const stat = b => ({ hits:b.h, total:b.t,
      hitRate: b.t>0?Math.round(b.h/b.t*100):0,
      pf: b.lSum>0?(b.wSum/b.lSum).toFixed(1):'∞' });

    const ph={C:bucket(),D:bucket(),E:bucket()};
    const tp={BUY:bucket(),SELL:bucket()};
    const rs={pos5:bucket(),pos0:bucket(),neg:bucket()};
    const rsi={os:bucket(),mid:bucket(),ob:bucket()};
    const cf={hi:bucket(),mid:bucket(),lo:bucket()};
    const mtf={up:bucket(),down:bucket(),unknown:bucket()};
    const sec={};

    working.forEach(o=>{
      if(!o.entryHit) return; // skip missed/stale for all breakdown stats
      if(ph[o.phase]) add(ph[o.phase],o);
      if(tp[o.type])  add(tp[o.type],o);
    });
    tradeable.forEach(o=>{
      if(o.rs!=null){ if(o.rs>=5)add(rs.pos5,o); else if(o.rs>=0)add(rs.pos0,o); else add(rs.neg,o); }
      if(o.rsi14!=null){ if(o.rsi14<=35)add(rsi.os,o); else if(o.rsi14<=60)add(rsi.mid,o); else add(rsi.ob,o); }
      if(o.preConf>=80)add(cf.hi,o); else if(o.preConf>=65)add(cf.mid,o); else add(cf.lo,o);
      if(o.weeklyTrend===true)add(mtf.up,o); else if(o.weeklyTrend===false)add(mtf.down,o); else add(mtf.unknown,o);
      const s=o.sector||'Other';
      if(!sec[s]) sec[s]=bucket();
      add(sec[s],o);
    });

    return {
      total, hitRate:Math.round(hits/total*100),
      targetHitRate: total>0?Math.round(targetHits/total*100):0,
      halfTargetHitRate: total>0?Math.round(halfTargetHits/total*100):0,
      oneRHitRate: total>0?Math.round(oneRHits/total*100):0,
      stopHitRate:   total>0?Math.round(stopHits/total*100):0,
      avgWin:avgWinR.toFixed(2), avgLoss:avgLossR.toFixed(2), pf,
      expectancy, hasRR, staleCount:totalStaleCount,
      winRate:Math.round(wins.length/rTotal*100),
      days: Object.values(log).filter(d=>d.outcomes?.length).length,
      entryHitRate, entryReached:entryReached.length, entryMissed:entryMissed.length,
      signalsTotal:working.length,
      ph:  {C:stat(ph.C),   D:stat(ph.D),   E:stat(ph.E)},
      tp:  {BUY:stat(tp.BUY), SELL:stat(tp.SELL)},
      rs:  {pos5:stat(rs.pos5), pos0:stat(rs.pos0), neg:stat(rs.neg)},
      rsi: {os:stat(rsi.os), mid:stat(rsi.mid), ob:stat(rsi.ob)},
      cf:  {hi:stat(cf.hi), mid:stat(cf.mid), lo:stat(cf.lo)},
      mtf: {up:stat(mtf.up), down:stat(mtf.down), unknown:stat(mtf.unknown)},
      sec: Object.entries(sec).map(([k,v])=>({name:k,...stat(v)})).sort((a,b)=>b.total-a.total),
    };
  };
  // Memoised analysis — available at component scope for dynamic Quick presets
  const analysis = React.useMemo(() => computeAnalysis(dailyLog), [dailyLog]);

  const runScan = async (stockOverride) => {
    runScanRef.current = runScan; // keep ref fresh
    cancelRef.current = false;
    // Guard: reject event objects (e.g. from onClick={runScan} mistakes)
    const validOverride = stockOverride && typeof stockOverride === 'object' && stockOverride.symbol ? stockOverride : null;
    // If called with a stock override (from quick-analyse bar), treat as single mode immediately
    const effectiveStock = validOverride || pickedStock;
    const effectiveSingle = !!validOverride || !!pickedStock;
    if (validOverride) {
      setPickedStock(validOverride);
      setFilterSetups(new Set()); setFilterSectors(new Set()); setFilterCaps(new Set()); setConfThresh(0); setFilterZone(false); setFilterRsiMin(0);
    }
    setScanning(true); setProgress(0); setScannedCount(0); setCurrentStock(''); setFetchStats({cached:0,live:0,failed:0});
    setFilterSectors(new Set()); setFilterCaps(new Set()); setFilterZone(false); (()=>{setCtrlOpen(false);try{localStorage.setItem('wave_ctrl_open','0');}catch{}})();
    try { localStorage.removeItem('wave_buys'); localStorage.removeItem('wave_sells'); localStorage.removeItem('wave_done'); } catch {}
    const now = () => new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});

    // ── Daily log helpers ──
    const todayKey = () => new Date().toISOString().slice(0,10); // "2026-02-27"

    const isPreMarket  = () => {
      const now=new Date();
      const mins=now.getHours()*60+now.getMinutes(); // local device time
      return mins < 9*60+15; // before 9:15 AM
    };
    const isPostMarket = () => {
      const now=new Date();
      const mins=now.getHours()*60+now.getMinutes();
      return mins >= 15*60+30; // at or after 3:30 PM
    };

    const stripScanForLog = (opps) => opps.map(o=>({
      symbol:o.symbol, name:o.name, sector:o.sector, type:o.type,
      phase:o.phase, confidence:o.confidence,
      entry:o.entry, stop:o.stop, target:o.target,
      rs:o.rs, rsi14:o.rsi14, lastClose:o.lastClose,
      volSignal:o.volSignal?.label||null,
    }));

    const computeOutcomes = (preScans, postScans) => {
      const outcomes = [];
      // Build a price map from post scan — symbol → lastClose (EOD price)
      const eodMap = {};
      postScans.forEach(p => { eodMap[p.symbol] = p.lastClose; });

      preScans.forEach(pre => {
        // Use post EOD price if available, else skip
        const eodPrice = eodMap[pre.symbol];
        if (!eodPrice) return;

        // Direction: did EOD close move in predicted direction AND entry was reached?
        const directionHit = entryHit && (targetHit || (!stopHit && (pre.type==='BUY' ? eodPrice > pre.entry : eodPrice < pre.entry)));

        // Magnitude: % move from entry in predicted direction
        const magnitude = pre.type==='BUY'
          ? parseFloat(((eodPrice - pre.entry) / pre.entry * 100).toFixed(2))
          : parseFloat(((pre.entry - eodPrice) / pre.entry * 100).toFixed(2));

        // Entry hit: EOD came within 1.5% of entry price
        const entryHit = Math.abs(eodPrice - pre.entry) / pre.entry <= 0.015;

        // Stop hit: EOD breached the stop level
        const stopHit = pre.type==='BUY' ? eodPrice < pre.stop : eodPrice > pre.stop;

        // Target hit: EOD reached or exceeded target
        const targetHit = pre.type==='BUY' ? eodPrice >= pre.target : eodPrice <= pre.target;

        // Move from pre-market close to EOD close (regardless of direction)
        const dayMove = parseFloat(((eodPrice - pre.lastClose) / pre.lastClose * 100).toFixed(2));

        outcomes.push({
          symbol:pre.symbol, name:pre.name, sector:pre.sector, cap:pre.cap,
          type:pre.type, phase:pre.phase, phaseType:pre.phase==='E'?'confirmatory':'predictive',
          preEntry:pre.entry, preStop:pre.stop, preTarget:pre.target,
          preClose:pre.lastClose, preConf:pre.confidence,
          eodPrice, directionHit, magnitude, entryHit, stopHit, targetHit, dayMove,
          rs:pre.rs, rsi14:pre.rsi14, volSignal:pre.volSignal,
        });
      });

      // Sort: hits first, then by magnitude descending
      return outcomes.sort((a,b) => {
        if(a.directionHit !== b.directionHit) return a.directionHit ? -1 : 1;
        return b.magnitude - a.magnitude;
      });
    };

    const saveDailyScan = (buys, sells, scanType) => {
      // scanType: 'pre' or 'post'
      const key = todayKey();
      const scans = stripScanForLog([...buys, ...sells]);
      if (!scans.length) { console.log('Daily log: no results to save'); return; }

      setDailyLog(prev => {
        const next = {...prev};
        // Prune logs older than 30 days
        const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
        Object.keys(next).forEach(k => { if(new Date(k) < cutoff) delete next[k]; });

        if (!next[key]) next[key] = {};
        next[key][scanType] = { time: now(), tf: tf.label, universe: universeSet.size?[...universeSet].join('+'):'F&O', scans };

        // Auto-compute outcomes when saving a post-market scan:
        // Always use PREVIOUS day's post as the baseline (= yesterday's closing prices = today's "pre")
        // Fallback: same-day pre if available and no prev-day post exists
        if (scanType === 'post') {
          const allDates = Object.keys(next).sort();
          const todayIdx = allDates.indexOf(key);

            if (next[allDates[i]]?.post) {
              prevPost = next[allDates[i]].post;
              prevKey = allDates[i];

    };
    // ── Pre-warm IDB from local yf_cache files — run in background, never block scan ──

    }

        if (!_sectorScanCache[scanKey]) {
          const d = await fetchOHLCV(yahoo, tf.period, tf.interval);

        }
      } catch {}

        if (!_sectorHtfCache[htfKey]) {
