          // This is critical for weekly scan: monthly HTF (1mo/10y) lives here even when
          // yf_cache only has 1d and 1wk files (i.e. user never ran --tf 1wk)
          if (!d && fsConnected) {
            try {
              const r = await WaveFS.readHist(sectorHistKey(sector, htf0.interval));
              if (r?.c?.length >= 12) d = unpackCandles(r.c);
            } catch {}
          }
          if (!d) {
            try {
              const st = localStorage.getItem('wave_hist_' + sectorHistKey(sector, htf0.interval));
              if (st) { const p = JSON.parse(st); if (p?.c?.length >= 12) d = unpackCandles(p.c); }
            } catch {}
          }
          // Fall back to fetchOHLCV (IDB → yf_cache → live Yahoo)
          if (!d) {
            try { d = await fetchOHLCV(yahoo, htf0.period, htf0.interval); } catch {}
          }
          if (d?.length >= 12) _sectorHtfCache[htfKey] = d;
        }
      } catch {}
    }

    if (!niftyRef.current && (tfId==='1d'||tfId==='1wk')) {
      try { niftyRef.current = await fetchOHLCV('^NSEI', tf.period, tf.interval); } catch {}
    }
    const niftyC = niftyRef.current;

    // In single mode, also clear leftover filters inside runScan (state may not have propagated yet from onSelect)
    const isSingle = effectiveSingle;
    if (isSingle) {
      setFilterSetups(new Set()); setFilterSectors(new Set()); setFilterCaps(new Set()); setConfThresh(0); setFilterZone(false); setFilterRsiMin(0);
    }

    // ── Load sector index data — 4-tier cache: memory → sessionStorage(4h) → wave_hist → live ──
    const htf = HTF_MAP[tfId] || HTF_MAP['1d'];
    const scanInterval = tf.interval;
    const htfInterval  = htf.interval;

    // In single-stock mode: only load the one sector the stock belongs to
    const sectorsToLoad = isSingle && effectiveStock?.sector
      ? Object.keys(SECTOR_INDEX_MAP).filter(s => s === effectiveStock.sector)
      : Object.keys(SECTOR_INDEX_MAP);

    const sectors = sectorsToLoad;
    const needsScanLoad = sectors.some(s => !_sectorScanCache[s + '_' + scanInterval]);
    const needsHtfLoad  = sectors.some(s => !_sectorHtfCache[s + '_' + htfInterval]);

    // Helper: try sessionStorage sector cache (4hr TTL) — survives page reloads
    const SECTOR_SS_TTL = 4 * 60 * 60 * 1000; // 4 hours
    const readSectorSS = (sector, interval) => {
      try {
        const raw = sessionStorage.getItem('wave_sec_' + sector + '_' + interval);
        if (!raw) return null;
        const { ts, data } = JSON.parse(raw);
        if (Date.now() - ts < SECTOR_SS_TTL) return data;
      } catch {}
      return null;
    };
    const writeSectorSS = (sector, interval, data) => {
      try {
        sessionStorage.setItem('wave_sec_' + sector + '_' + interval,
          JSON.stringify({ ts: Date.now(), data }));
      } catch {}
    };

    if (needsScanLoad || needsHtfLoad) {
      for (const sector of sectors) {
        const yahoo = SECTOR_INDEX_MAP[sector];
        if (!yahoo) continue;
        if (cancelRef.current) break;

        const scanMemKey = sector + '_' + scanInterval;
        if (!_sectorScanCache[scanMemKey]) {
          let scanData = null;
          let scanSource = '';
          // Tier 1: sessionStorage (4h TTL — survives page reload)
          scanData = readSectorSS(sector, scanInterval);
          if (scanData) { scanSource = 'cache'; }
          // Tier 2: wave_hist localStorage (populated by Fetch History / Backfill)
          if (!scanData) {
            try {
              const r = localStorage.getItem('wave_hist_' + sectorHistKey(sector, scanInterval));
              if (r) { const p = JSON.parse(r); if (p?.c) { scanData = unpackCandles(p.c); scanSource = 'hist'; } }
            } catch {}
          }
          // Tier 3: WaveFS wave_hist (App_Wave/data/wave_hist/)
          if (!scanData && fsConnected) {
            try { const r = await WaveFS.readHist(sectorHistKey(sector, scanInterval)); if (r?.c) { scanData = unpackCandles(r.c); scanSource = 'hist'; } } catch {}
          }
          // Tier 3.5: WaveFS yf_cache (written by wave_fetch.py — primary pre-fetch source)
          if (!scanData && fsConnected) {
            try {
              const yfKey = yahoo + '|' + tf.period + '|' + scanInterval;
              const cached = await WaveFS.readYF(yfKey);
              if (cached && Date.now() - cached.ts < 48*60*60*1000 && cached.data?.length >= 20) {
                scanData = cached.data; scanSource = 'yf-cache-fs';
                _fetchMem[yfKey] = cached.data; // promote to memory
              }
            } catch {}
          }
          // Tier 4: yf_ fetch cache (populated whenever this ticker was fetched before)
          if (!scanData) {
            try {
              const yfKey = 'yf_' + yahoo + '|' + tf.period + '|' + scanInterval;
              const raw = sessionStorage.getItem(yfKey) || localStorage.getItem(yfKey);
              if (raw) { const { ts, data } = JSON.parse(raw); if (Date.now() - ts < 48*60*60*1000 && data?.length >= 20) { scanData = data; scanSource = 'yf-cache'; } }
            } catch {}
          }
          // Tier 5: Live fetch (last resort — shown in progress)
          if (!scanData) {
            setCurrentStock(`Fetching sector ${sector} (${scanInterval})…`);
            try { const d = await fetchOHLCV(yahoo, tf.period, scanInterval); if (d?.length >= 20) { scanData = d; scanSource = 'live'; } } catch {}
          }
          if (scanData?.length >= 20) {
            _sectorScanCache[scanMemKey] = scanData;
            writeSectorSS(sector, scanInterval, scanData);
          }
        }

        const htfMemKey = sector + '_' + htfInterval;
        if (!_sectorHtfCache[htfMemKey]) {
          let htfData = null;
          // Tier 1: sessionStorage (4h TTL)
          htfData = readSectorSS(sector, htfInterval);
          // Tier 2: wave_hist localStorage
          if (!htfData) {
            try {
              const r = localStorage.getItem('wave_hist_' + sectorHistKey(sector, htfInterval));
              if (r) { const p = JSON.parse(r); if (p?.c) htfData = unpackCandles(p.c); }
            } catch {}
          }
          // Tier 3: WaveFS wave_hist
          if (!htfData && fsConnected) {
            try { const r = await WaveFS.readHist(sectorHistKey(sector, htfInterval)); if (r?.c) htfData = unpackCandles(r.c); } catch {}
          }
          // Tier 3.5: WaveFS yf_cache (written by wave_fetch.py)
          if (!htfData && fsConnected) {
            try {
              const yfKey = yahoo + '|' + htf.period + '|' + htfInterval;
              const cached = await WaveFS.readYF(yfKey);
              if (cached && Date.now() - cached.ts < 48*60*60*1000 && cached.data?.length >= 12) {
                htfData = cached.data;
                _fetchMem[yfKey] = cached.data;
              }
            } catch {}
          }
          // Tier 4: yf_ fetch cache
          if (!htfData) {
            try {
              const yfKey = 'yf_' + yahoo + '|' + htf.period + '|' + htfInterval;
              const raw = sessionStorage.getItem(yfKey) || localStorage.getItem(yfKey);
              if (raw) { const { ts, data } = JSON.parse(raw); if (Date.now() - ts < 48*60*60*1000 && data?.length >= 12) htfData = data; }
            } catch {}
          }
          // Tier 5: Live fetch (last resort — shown in progress)
          if (!htfData) {
            setCurrentStock(`Fetching sector ${sector} HTF (${htfInterval})…`);
            try { const d = await fetchOHLCV(yahoo, htf.period, htfInterval); if (d?.length >= 12) htfData = d; } catch {}
          }
          if (htfData?.length >= 12) {
            _sectorHtfCache[htfMemKey] = htfData;
            writeSectorSS(sector, htfInterval, htfData);
          }
        }
      }
    }

    const sectorCandlesMap = {};
    const weeklyIndexMap   = {};
    for (const sector of sectors) {
      const sc = _sectorScanCache[sector + '_' + scanInterval];
      if (sc) sectorCandlesMap[sector] = sc;
      const hc = _sectorHtfCache[sector + '_' + htfInterval];
      if (hc) weeklyIndexMap[sector] = hc;
    }

    // Nifty regime — v1.3 uses detectNiftyRegime() shared with replay engine
    const niftyWyckoff = detectNiftyRegime(niftyC);
    setNiftyRegime(niftyWyckoff);

    if (isSingle && effectiveStock) {
      setSingleBuys([]); setSingleSells([]); setSingleDone(false); setSingleTime(null);
      setTotalExpected(1); setCurrentStock(effectiveStock.symbol); setProgress(50);
      const res = await scanStock(effectiveStock, tf, niftyC, forceFresh, sectorCandlesMap, weeklyIndexMap, niftyWyckoff, true);
      let buys=[], sells=[];
      if (res) res.forEach(r=>r.type==="BUY"?buys.push(r):sells.push(r));
      setSingleBuys(buys); setSingleSells(sells); setSingleDone(true); setSingleTime(now());
      setProgress(100); setScannedCount(1); setScanning(false); (()=>{setCtrlOpen(false);try{localStorage.setItem('wave_ctrl_open','0');}catch{}})();
      return;
    }

    setSectorBuys([]); setSectorSells([]); setSectorDone(false); setSectorTime(null);
    const list = buildScanList(universeSet, sectorSet);
    setTotalExpected(list.length);
    let buys=[], sells=[];
    for (let i=0; i<list.length; i++) {
      if (cancelRef.current) {
        setSectorBuys([...buys]); setSectorSells([...sells]);
        setSectorDone(true); setSectorTime(now());
        if (buys.length||sells.length) addHistory(buys,sells,list.length,now());
        setScanning(false); (()=>{setCtrlOpen(false);try{localStorage.setItem('wave_ctrl_open','0');}catch{}})();
        return;
      }
      setCurrentStock(list[i].symbol); setScannedCount(i+1);
      setProgress(Math.round(((i+1)/list.length)*100));
      const cacheKey = list[i].yahoo+'|'+tf.period+'|'+tf.interval;
      // Fast cache check: memory or sessionStorage = definitely cached
      const inMem  = !!_fetchMem[cacheKey];
      const inSess = !inMem && !!sessionStorage.getItem('yf_'+cacheKey);
      const inLS   = !inMem && !inSess && !!localStorage.getItem('yf_'+cacheKey);
      // WaveFS is checked inside scanStock — if folder connected, treat as cached for delay purposes
      const likelyCached = !forceFresh && (inMem || inSess || inLS || !!_waveFSRef);
      const res = await scanStock(list[i], tf, niftyC, forceFresh, sectorCandlesMap, weeklyIndexMap, niftyWyckoff);
      const gotData = !!res;
      if (gotData) setFetchStats(p=>({...p, [likelyCached?'cached':'live']: p[likelyCached?'cached':'live']+1}));
      else setFetchStats(p=>({...p, failed: p.failed+1}));
      if (res) { res.forEach(r=>r.type==="BUY"?buys.push(r):sells.push(r)); setSectorBuys([...buys]); setSectorSells([...sells]); }
      // Only throttle for live Yahoo — if WaveFS/cache connected assume local read
      if (forceFresh || (!likelyCached)) {
        await new Promise(r=>setTimeout(r,350)); // rate-limit live Yahoo
      } else {
        await new Promise(r=>setTimeout(r,2)); // near-zero yield for UI tick
      }
    }
    setSectorDone(true); setSectorTime(now()); addHistory(buys,sells,list.length,now()); setScanning(false); (()=>{setCtrlOpen(false);try{localStorage.setItem('wave_ctrl_open','0');}catch{}})();
    WaveFS.countYFIDB().then(n => { if (n > 0) setIdbCount(n); }).catch(()=>{});
    // Save to daily log — pre-market or post-market
    const slot = isPreMarket()?'pre':isPostMarket()?'post':null;
    if (slot) saveDailyScan(buys, sells, slot);
    else console.log('Daily log: scan outside pre/post window, not saved');
  };

  // Entry zone proximity helper — 2% threshold, matches replay zone filter
  const getZoneInfo = (o, isBuy) => {
    const dist = o.entry > 0 ? Math.abs((o.lastClose - o.entry) / o.entry * 100) : 999;
    const side = isBuy ? o.lastClose <= o.entry * 1.02 : o.lastClose >= o.entry * 0.98;
    return { dist, inZone: dist <= 2 && side };
  };

  const makeSortFn = (isBuy, key) => (a, b) => {
    // ── Indices always pinned to top ──
    const aIdx = a.cap === 'index', bIdx = b.cap === 'index';
    if(aIdx !== bIdx) return aIdx ? -1 : 1;
    // ── Then: in-zone before out-of-zone ──
    const az = getZoneInfo(a, isBuy), bz = getZoneInfo(b, isBuy);
    if(az.inZone !== bz.inZone) return az.inZone ? -1 : 1;
    // ── Then: user sort preference ──
    if(key==="conf") return b.confidence-a.confidence;
    if(key==="rr")   return (parseFloat(b.rr)||0)-(parseFloat(a.rr)||0);
    if(key==="chg")  return Math.abs(b.pctChg)-Math.abs(a.pctChg);
    if(key==="zone") return az.dist - bz.dist;
    return a.symbol.localeCompare(b.symbol);
  };
  // Apply post-scan filters
  const applyFilters = (arr, isBuy) => {
    let out = [...arr];
    // filteredOut cards (single-mode analysis) bypass all filters — always shown
    const pinned = out.filter(o => o.filteredOut);
    out = out.filter(o => !o.filteredOut);
    if (filterSectors.size > 0)  out = out.filter(o => filterSectors.has(o.sector));
    if (filterCaps.size > 0)     out = out.filter(o => filterCaps.has(o.cap||'unknown'));
    if (filterSetups.size > 0)   out = out.filter(o => filterSetups.has(o.stageKey));
    out = out.filter(o => o.confidence >= confThresh);
    if (filterRsiMin > 0) out = out.filter(o => o.rsi14 !== null && o.rsi14 >= filterRsiMin);
    // Always remove stale signals — price extended beyond entry, signal is invalid
    out = out.filter(o => {
      const isBuyLocal = o.type === 'BUY';
      return isBuyLocal
        ? o.lastClose <= o.entry * 1.02    // BUY: CMP must be at or below entry
        : o.lastClose >= o.entry * 0.98;   // SHORT: CMP must be at or above entry
    });
    if (filterZone) out = out.filter(o => getZoneInfo(o, isBuy).inZone);
    return [...pinned, ...out]; // pinned analysis-only cards always first
  };
  const rawBuy  = applyFilters([...buyOpps], true);
  const rawSell = applyFilters([...sellOpps], false);
  const bothSyms = new Set(rawBuy.filter(o=>rawSell.some(s=>s.symbol===o.symbol)).map(o=>o.symbol));
  const sb = rawBuy.filter(o=>!bothSyms.has(o.symbol)||(rawSell.find(s=>s.symbol===o.symbol)?.confidence||0)<=o.confidence).sort(makeSortFn(true,sortBy));
  const ss = rawSell.filter(o=>!bothSyms.has(o.symbol)||(rawBuy.find(b=>b.symbol===o.symbol)?.confidence||0)<o.confidence).sort(makeSortFn(false,sortBy));

  // Available sectors and caps from ALL results (for filter chips)
  const availSectors = [...new Set([...buyOpps,...sellOpps].map(o=>o.sector))].filter(Boolean).sort();
  const availCaps    = [...new Set([...buyOpps,...sellOpps].map(o=>o.cap||'unknown'))].filter(c=>c!=='unknown');
  const capOrder     = ['index','large','mid','small'];
  availCaps.sort((a,b)=>capOrder.indexOf(a)-capOrder.indexOf(b));
  const hasFilters = filterSectors.size>0 || filterCaps.size>0 || filterSetups.size>0 || confThresh>0 || filterZone || filterRsiMin>0;
  const sectorMap = {};
  [...buyOpps,...sellOpps].forEach(o=>{
    if(!sectorMap[o.sector]) sectorMap[o.sector]={buy:0,sell:0};
    if(o.type==="BUY") sectorMap[o.sector].buy++; else sectorMap[o.sector].sell++;
  });
  const heatSectors = Object.entries(sectorMap).sort((a,b)=>(b[1].buy+b[1].sell)-(a[1].buy+a[1].sell));
  const totalSignals = sb.length + ss.length;
  const univLabel = universeSet.size===0?'All':[...universeSet].map(u=>UNIVERSE_FILTERS.find(f=>f.id===u)?.label||u).join('+');
  const secLabel  = sectorSet.size===0?'All Sectors':[...sectorSet].join(', ');

  return (
    <div className="app">

      {firedAlerts.map((a,i)=>(
        <div key={i} className="alert-banner">
          <span>🔔 <strong>{a.symbol}</strong> hit ₹{a.price.toLocaleString('en-IN')}{a.cur?` — now ₹${a.cur.toLocaleString('en-IN')}`:''}</span>
          <button className="alert-close" onClick={()=>setFiredAlerts(p=>p.filter((_,j)=>j!==i))}>✕</button>
        </div>
      ))}

      {showInstallBanner&&(
        <div className="install-banner">
          <div className="install-banner-icon">📲</div>
          <div className="install-banner-body">
            <div className="install-banner-title">Install WAVE — Hide the URL bar</div>
            {isAndroid&&(
              <div className="install-banner-steps">
                <b>1.</b> Tap <b>⋮</b> (3-dot menu) in Chrome<br/>
                <b>2.</b> Tap <b>"Add to Home Screen"</b> → <b>Install</b><br/>
                <b>3.</b> Open WAVE from your home screen 🚀
              </div>
            )}
            {isIOS&&(
              <div className="install-banner-steps">
                <b>1.</b> Tap the <b>Share</b> button <b>□↑</b> in Safari<br/>
                <b>2.</b> Tap <b>"Add to Home Screen"</b><br/>
                <b>3.</b> Open WAVE from your home screen 🚀
              </div>
            )}
            <button className="install-btn" onClick={dismissInstall}>Got it, don't show again</button>
          </div>
          <button className="install-banner-close" onClick={dismissInstall}>✕</button>
        </div>
      )}

      <div className="hdr">
        <div className="hdr-logo">
          <svg width="24" height="20" viewBox="0 0 24 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            {/* Ascending W — each peak is higher than the last */}
            <polyline
              points="1,14 5,18 8,10 11,15 15,6 19,11 23,2"
              stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" fill="none"
            />
            {/* Small rising dot at top-right tip */}
            <circle cx="23" cy="2" r="1.5" fill="#4ade80"/>
          </svg>
        </div>
        <div style={{flex:1,overflow:'hidden'}}>
          <div className="hdr-title" style={{letterSpacing:'1.5px',fontWeight:900}}>WAVE{!isMobile&&<span style={{fontSize:'9px',fontWeight:400,letterSpacing:'0.3px',color:'var(--muted)',marginLeft:'6px'}}>Wyckoff Analysis & Visual Engine</span>}{isMobile&&CLOUD_URL&&<span title="Cloud connected" style={{marginLeft:'6px',fontSize:'10px',opacity:0.7}}>☁️</span>}</div>
          <span className="hdr-sub" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'block'}}>
            {pickedStock ? pickedStock.symbol+' · '+tf.label
              : tf.label+' · '+univLabel+' · '+secLabel
                +(done&&totalSignals>0 ? ' · ▲'+sb.length+' ▼'+ss.length : '')}
          </span>
        </div>
        <div style={{display:'flex',gap:'5px',alignItems:'center',flexShrink:0}}>
          <button className="icon-btn" onClick={()=>!scanning&&(()=>{const v=!ctrlOpen;setCtrlOpen(v);try{localStorage.setItem('wave_ctrl_open',v?'1':'0');}catch{}})()}
            title={ctrlOpen?'Hide scan settings':'Show scan settings'}
            style={{fontWeight:700, color:ctrlOpen?'var(--green)':'var(--muted)', fontSize:'16px'}}>⊞</button>
          <button className="icon-btn" onClick={()=>{const v=!showAnalysis;setShowAnalysis(v);try{sessionStorage.setItem('wave_show_an',v?'1':'0');}catch{}computeStorageInfo();}} title="Analysis" style={{display:isMobile?'none':'flex'}}>📊</button>
          <button className="icon-btn" onClick={()=>{const v=!showDailyLog;setShowDailyLog(v);try{sessionStorage.setItem('wave_show_log',v?'1':'0');}catch{}}} title="Daily Log" style={{fontSize:'14px',position:'relative',display:isMobile?'none':'flex'}}>
            📋{Object.keys(dailyLog).length>0&&<span style={{position:'absolute',top:'2px',right:'2px',width:'6px',height:'6px',borderRadius:'50%',background:'var(--amber)',display:'block'}}/>}
          </button>
          <button className="icon-btn" onClick={()=>setShowWL(p=>!p)} title="Watchlist">{watchlist.length>0?'★'+watchlist.length:'☆'}</button>
          {WaveFS.isSupported()&&!isMobile&&(
            <button className="icon-btn"
              onClick={fsConnected?null:fsStatus==='needs-resume'?resumeFS:connectFS}
              title={fsConnected?'App_Wave folder connected':fsStatus==='needs-resume'?'Tap to resume local folder access':'Connect App_Wave folder for persistent storage'}
              style={{opacity:fsStatus==='connecting'||fsStatus==='loading'?0.6:1, cursor:fsConnected?'default':'pointer'}}>
              {fsStatus==='connecting'?'⟳':fsStatus==='loading'?'⟳':fsConnected?'🗂️':fsStatus==='needs-resume'?'▶':'📂'}
            </button>
          )}
          {CLOUD_URL&&!isMobile&&(
            <span title={'Cloud: '+CLOUD_URL}
              style={{fontSize:'14px',lineHeight:1,opacity:0.85,cursor:'default'}}
              className="icon-btn">☁️</span>
          )}
          <button className="reset-btn" onClick={resetAll} title="Reset">↺</button>
          {isMobile&&idbCount>0&&<button onClick={flushCache} title="Flush cache" style={{
            width:'34px',height:'34px',borderRadius:'8px',border:'1px solid var(--red-bd)',
            background:'rgba(239,68,68,0.08)',color:'var(--red)',fontSize:'14px',
            cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0
          }}>🗑</button>}
        </div>
      </div>


      {/* ── Stock Search — always visible, Google-style ── */}
      <div style={{
        padding:'10px 14px',
        borderBottom:'1px solid var(--border)',
        background: pickedStock ? 'var(--blue-bg)' : 'var(--bg2)',
      }}>
        {!pickedStock && (
          <StockSearch
            selected={null}
            onSelect={s=>{
              setPickedStock(s);
              setFilterSetups(new Set()); setFilterSectors(new Set()); setFilterCaps(new Set()); setConfThresh(0); setFilterZone(false); setFilterRsiMin(0);
              setSingleDone(false); setSingleBuys([]); setSingleSells([]);
              runScanRef.current && runScanRef.current(s);
            }}
            onClear={()=>{}}
          />
        )}
        {pickedStock && (
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{flex:1,display:'flex',alignItems:'center',gap:'8px',
              background:'var(--card)',border:'1.5px solid var(--blue-bd)',
              borderRadius:'10px',padding:'10px 14px',minWidth:0,overflow:'hidden'}}>
              <span style={{fontFamily:'IBM Plex Mono',fontSize:'15px',fontWeight:700,
                color:'var(--blue)',flexShrink:0,letterSpacing:'0.5px'}}>
                {pickedStock.symbol}
              </span>
              <span style={{fontSize:'14px',color:'var(--text2)',
                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>
                {pickedStock.name}
              </span>
              <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--muted)',
                flexShrink:0,whiteSpace:'nowrap'}}>
                {pickedStock.sector}
              </span>
            </div>
            <button
              className="single-scan-btn"
              title="Re-run analysis"
              style={{flexShrink:0,padding:'10px 13px',fontSize:'15px',lineHeight:1}}
              onClick={()=>{ setFilterSetups(new Set()); setFilterSectors(new Set()); setFilterCaps(new Set()); setConfThresh(0); setFilterZone(false); setFilterRsiMin(0); runScan(); }}>
              ⚡
            </button>
            <button
              title="Clear stock"
              onClick={()=>{ setPickedStock(null); setSingleDone(false); setSingleBuys([]); setSingleSells([]); }}
              style={{flexShrink:0,background:'none',border:'1.5px solid var(--border)',
                borderRadius:'10px',fontSize:'18px',color:'var(--muted)',cursor:'pointer',
                lineHeight:1,padding:'8px 11px'}}>
              ×
            </button>
          </div>
        )}
      </div>

      {/* ── Cloud Data bar — shown when CLOUD_URL is set ── */}
      {CLOUD_URL&&!isMobile&&(
        <div style={{
          fontSize:'10px', fontFamily:'IBM Plex Mono',
          borderBottom:'1px solid var(--blue-bd)',
          background:'rgba(26,80,160,0.05)',
          display:'flex',alignItems:'center',gap:'8px',padding:'5px 14px',
        }}>
          <span style={{fontSize:'13px',flexShrink:0}}>☁️</span>
          <span style={{color:'var(--blue)',fontWeight:700,flexShrink:0}}>Cloud connected</span>
          {!isMobile&&<span style={{color:'var(--muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,fontSize:'9px'}}>
            {CLOUD_URL.replace('https://','').replace(/\/$/,'')} · yf_cache + wave_hist via Render
          </span>}
          {!isMobile&&<button onClick={async()=>{
            try{
              const r=await fetch(CLOUD_URL.replace(/\/$/,'')+'/api/health',{signal:AbortSignal.timeout(4000)});
              const j=await r.json();
              alert('✅ Cloud OK\nyf_cache: '+j.yf_cache_files+' files\nwave_hist: '+j.wave_hist_files+' files');
            }catch(e){alert('❌ Cloud unreachable\n'+e.message);}
          }} style={{fontFamily:'IBM Plex Mono',fontSize:'9px',fontWeight:700,
            padding:'2px 7px',borderRadius:'5px',cursor:'pointer',flexShrink:0,
            border:'1px solid var(--blue-bd)',background:'rgba(26,80,160,0.08)',color:'var(--blue)'}}>
            ping
          </button>}
        </div>
      )}

      {/* ── Local Data — collapsible — hidden on mobile when cloud active ── */}
      {WaveFS.isSupported()&&!(isMobile&&CLOUD_URL)&&(()=>{
        const [ldOpen, setLdOpen] = React.useState(false);
        return (
          <div style={{
            fontSize:'10px', fontFamily:'IBM Plex Mono',
            borderBottom:'1px solid '+(fsConnected?'var(--green-bd)':'var(--amber-bd)'),
            background:fsConnected?'var(--green-bg)':'rgba(251,191,36,0.05)',
          }}>
            {/* Single header row: icon + status + badge + buttons + chevron */}
            <div style={{display:'flex',alignItems:'center',gap:'8px',padding:'6px 14px',flexWrap:'wrap'}}>
              <span style={{fontSize:'13px',flexShrink:0}}>{fsConnected?'🗂️':fsStatus==='connecting'?'⟳':'📂'}</span>
              {/* Status text */}
              {fsConnected
                ? <span style={{color:'var(--green)',fontWeight:700,flexShrink:0}}>Local data connected</span>
                : fsStatus==='connecting'
                  ? <span style={{color:'var(--muted)',flexShrink:0}}>Reconnecting…</span>
                  : fsStatus==='needs-resume'
                    ? <span style={{color:'var(--blue)',fontWeight:700,flexShrink:0}}>Tap Resume</span>
                    : <span style={{color:'var(--amber)',fontWeight:700,flexShrink:0}}>Not connected</span>
              }
              {idbCount>0&&<span style={{
                color:'var(--blue)',background:'rgba(59,130,246,0.08)',
                border:'1px solid rgba(59,130,246,0.25)',
                borderRadius:'4px',padding:'1px 5px',fontSize:'9px',fontWeight:700,flexShrink:0
              }}>⚡ {idbCount} indexed</span>}
              {/* Action buttons inline */}
              {fsConnected&&(
                <button onClick={async()=>{
                  setFsStatus('loading');
                  const n = await WaveFS.warmIDBFromFS();
                  setIdbCount(n);
                  Object.keys(_fetchMem).forEach(k=>delete _fetchMem[k]);
                  try{Object.keys(sessionStorage).filter(k=>k.startsWith('yf_')||k.startsWith('wave_sec_')).forEach(k=>sessionStorage.removeItem(k));}catch{}
                  setFsStatus('ready');
                }} style={{fontFamily:'IBM Plex Mono',fontSize:'9px',fontWeight:700,
                  padding:'2px 7px',borderRadius:'5px',cursor:'pointer',flexShrink:0,
                  border:'1px solid var(--blue-bd)',background:'rgba(26,80,160,0.08)',color:'var(--blue)'}}>↺ Sync</button>
              )}

        {showAnalysis&&(()=>{

            <div className="an-bar-row">

            <div className="panel">
              <div className="panel-hdr">

              </div>
              {!an ? (

              ) : (<>
                {/* ── Overall Stats ── */}
                <div className="an-section">
                  <div className="an-title">
                    Overall · {an.days} days · {an.total} entered signals · dynamic window (12–28d)
                  </div>
                  <div className="an-stat-grid">
                    <div className="an-stat">
                      <div className="an-stat-val" style={{color:an.hitRate>=65?'var(--green)':an.hitRate>=50?'var(--amber)':'var(--red)'}}>{an.hitRate}%</div>
                      <div className="an-stat-lbl">Direction Hit</div>
                      <div className="an-stat-sub">entered & moved right way within window</div>
                    </div>
                    <div className="an-stat">
                      <div className="an-stat-val" style={{color:parseFloat(an.pf)>=1.5?'var(--green)':parseFloat(an.pf)>=1?'var(--amber)':'var(--red)'}}>{an.pf}</div>
                      <div className="an-stat-lbl">Profit Factor</div>
                      <div className="an-stat-sub">{an.hasRR?'R normalized':'% based'}</div>
                    </div>
                    <div className="an-stat">
                      <div className="an-stat-val" style={{color:an.expectancy>0?'var(--green)':an.expectancy===0?'var(--muted)':'var(--red)'}}>{an.expectancy>0?'+':''}{an.expectancy}{an.hasRR?'R':'%'}</div>
                      <div className="an-stat-lbl">Expectancy</div>
                      <div className="an-stat-sub">per trade · {an.hasRR?`+${an.avgWin}R / -${an.avgLoss}R`:'+'+an.avgWin+'% / -'+an.avgLoss+'%'}</div>
                    </div>
                  </div>
                  {/* Target breakdown row */}
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'6px',marginTop:'8px'}}>
                    <div className="an-stat" style={{background:'var(--green-bg)',border:'1px solid var(--green-bd)'}}>
                      <div className="an-stat-val" style={{color:an.oneRHitRate>=40?'var(--green)':'var(--amber)',fontSize:'18px'}}>{an.oneRHitRate}%</div>
                      <div className="an-stat-lbl">≥ 1R move</div>
                      <div className="an-stat-sub">best exit quality</div>
                    </div>
                    <div className="an-stat" style={{background:'var(--amber-bg)',border:'1px solid var(--amber-bd)'}}>
                      <div className="an-stat-val" style={{color:'var(--amber)',fontSize:'18px'}}>{an.halfTargetHitRate}%</div>
                      <div className="an-stat-lbl">½ target hit</div>
                      <div className="an-stat-sub">partial exit viable</div>
                    </div>
                    <div className="an-stat" style={{background:'var(--red-bg)',border:'1px solid var(--red-bd)'}}>
                      <div className="an-stat-val" style={{color:'var(--red)',fontSize:'18px'}}>{an.stopHitRate}%</div>
                      <div className="an-stat-lbl">Stop hit</div>
                      <div className="an-stat-sub">{an.targetHitRate}% full target</div>
                    </div>
                  </div>
                  <div className="an-stat-grid" style={{marginTop:'8px'}}>
                    <div className="an-stat">
                      <div className="an-stat-val" style={{color:an.tp.BUY.hitRate>=65?'var(--green)':'var(--amber)'}}>{an.tp.BUY.hitRate}%</div>
                      <div className="an-stat-lbl">BUY direction</div>
                      <div className="an-stat-sub">{an.tp.BUY.total}x · PF {an.tp.BUY.pf}</div>
                    </div>
                    <div className="an-stat">
                      <div className="an-stat-val" style={{color:an.tp.SELL.hitRate>=65?'var(--green)':'var(--amber)'}}>{an.tp.SELL.hitRate}%</div>
                      <div className="an-stat-lbl">SHORT direction</div>
                      <div className="an-stat-sub">{an.tp.SELL.total}x · PF {an.tp.SELL.pf}</div>
                    </div>
                    <div className="an-stat">
                      <div className="an-stat-val" style={{color:an.entryHitRate>=40?'var(--green)':'var(--amber)'}}>{an.entryHitRate}%</div>
                      <div className="an-stat-lbl">Entry reached</div>
                      <div className="an-stat-sub">{an.entryReached}/{an.signalsTotal} in-zone</div>
                    </div>
                  </div>
                </div>

                {/* ── Phase breakdown ── */}
                <div className="an-section">
                  <div className="an-title">Phase Breakdown</div>
                  <BarRow label="Phase C" s={an.ph.C}/>
                  <BarRow label="Phase D" s={an.ph.D}/>
                  <BarRow label="Phase E" s={an.ph.E}/>
                </div>

                {/* ── RS breakdown ── */}
                <div className="an-section">
                  <div className="an-title">Relative Strength vs Nifty</div>
                  <BarRow label="RS ≥ +5%" s={an.rs.pos5}/>
                  <BarRow label="RS 0–5%" s={an.rs.pos0}/>
                  <BarRow label="RS < 0%" s={an.rs.neg}/>
                </div>

                {/* ── RSI breakdown ── */}
                <div className="an-section">
                  <div className="an-title">RSI(14) Context</div>
                  <BarRow label="RSI ≤ 35" s={an.rsi.os}/>
                  <BarRow label="RSI 36–60" s={an.rsi.mid}/>
                  <BarRow label="RSI > 60" s={an.rsi.ob}/>
                </div>

                {/* ── Confidence bands ── */}
                <div className="an-section">
                  <div className="an-title">Confidence Band</div>
                  <BarRow label="Conf ≥ 80%" s={an.cf.hi}/>
                  <BarRow label="Conf 65–79%" s={an.cf.mid}/>
                  <BarRow label="Conf < 65%" s={an.cf.lo}/>
                </div>

                {/* ── MTF Weekly Trend breakdown ── */}
                {(an.mtf.up.total>0||an.mtf.down.total>0)&&(
                <div className="an-section">
                  <div className="an-title">Weekly Sector Trend (MTF Filter)</div>
                  <BarRow label="📈 Wkly uptrend" s={an.mtf.up}/>
                  <BarRow label="📉 Wkly downtrend" s={an.mtf.down}/>
                  {an.mtf.unknown.total>0&&<BarRow label="— Unknown" s={an.mtf.unknown}/>}
                </div>
                )}

                {/* ── Sector breakdown ── */}
                <div className="an-section">
                  <div className="an-title">Sector Performance</div>
                  {an.sec.filter(s=>s.total>=5).map(s=>(
                    <BarRow key={s.name} label={s.name} s={s}/>
                  ))}
                </div>

                {/* ── Storage indicator ── */}
                {storageInfo&&(
                  <div className="an-section" style={{borderBottom:'none'}}>
                    <div className="an-title">Storage Usage</div>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
                      <span style={{fontFamily:'IBM Plex Mono',fontSize:'10px',color:'var(--text)',fontWeight:700}}>{storageInfo.totalMB} MB / {storageInfo.limitMB} MB</span>
                      <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:storageInfo.pct>85?'var(--red)':storageInfo.pct>60?'var(--amber)':'var(--muted)'}}>{storageInfo.pct}%</span>
                    </div>
                    <div className="stor-bar">
                      <div className="stor-fill" style={{width:storageInfo.pct+'%',background:storageInfo.pct>85?'var(--red)':storageInfo.pct>60?'var(--amber)':'var(--green)'}}/>
                    </div>
                    <div style={{display:'flex',gap:'12px',marginTop:'6px'}}>
                      {[['Yahoo cache',storageInfo.yfMB,'var(--blue)'],['Daily log',storageInfo.logMB,'var(--green)'],['Other',storageInfo.otherMB,'var(--muted)']].map(([l,v,c])=>(
                        <div key={l} style={{fontFamily:'IBM Plex Mono',fontSize:'8px',color:'var(--faint)'}}>
                          <span style={{color:c}}>■</span> {l}: {v}MB
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>)}
            </div>
          );
        })()}

        {showDailyLog&&(
          <div className="panel">
            <div className="panel-hdr">
              <span className="panel-title">📋 Daily Log</span>
              {fsConnected&&<span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--green)',marginLeft:'6px',background:'var(--green-l)',padding:'1px 5px',borderRadius:'4px'}}>🗂️ App_Wave</span>}
              {!fsConnected&&WaveFS.isSupported()&&<span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--muted)',marginLeft:'6px',cursor:'pointer'}} onClick={connectFS}>📂 connect folder</span>}
              <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                {Object.keys(dailyLog).length>0&&(<>
                  <button className="clr-link" style={{color:'var(--blue)'}} onClick={()=>{
                    // Bundle daily log + IC weights + metadata into one export file
                    let icWeights = null;
                    try { const w=localStorage.getItem('wave_ic_weights'); if(w) icWeights=JSON.parse(w); } catch {}
                    const bundle = {
                      _wave_export: true,
                      _version: 1,
                      _exported: new Date().toISOString(),
                      _device: navigator.platform||'unknown',
                      wave_daily_log: dailyLog,
                      wave_ic_weights: icWeights,
                    };
                    const blob = new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'wave_export_'+new Date().toISOString().slice(0,10)+'.json';
                    a.click();

                  <button className="clr-link" style={{color:'var(--red)'}} onClick={()=>{
                    if(!window.confirm('Clear daily log entries only?\n\nStep 1 history (2Y candles) is preserved — no re-fetch needed.')) return;
                    setDailyLog({});
                    try{localStorage.removeItem('wave_daily_log');}catch{}
                    if(fsConnected) WaveFS.write('daily_log', null).catch(()=>{});
                  }}>Clear log</button>
                </>)}
                <button className="clr-link" style={{color:'var(--green)'}} onClick={()=>importRef.current?.click()}>📥 Import</button>
                <button className="clr-link" style={{color:'var(--amber)'}} onClick={()=>setShowBackfill(p=>!p)}>⏪ Backfill</button>

                  <span style={{fontFamily:'IBM Plex Mono',fontSize:'10px',color:'var(--amber)'}}>▶ {replayProgress.pct}%…</span>

                  <button className="clr-link" style={{color:'var(--green)',fontWeight:700}} onClick={()=>{
                    let n=0;try{n=Object.keys(localStorage).filter(k=>k.startsWith('wave_hist_')).length;}catch{}
                    if(n===0){alert('No history cached.\nPlease run ⬇ Fetch 2Y History first (in Backfill panel).');return;}
                    runReplay();
                  }}>▶ Re-run Analysis</button>
                )}
                <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={e=>{
                  const file=e.target.files?.[0]; if(!file) return;
                  const reader=new FileReader();
                  reader.onload=ev=>{
                    try {
                      const parsed=JSON.parse(ev.target.result);
                      if(typeof parsed!=='object'||Array.isArray(parsed)) throw new Error('Invalid format');

                      if (parsed._wave_export) {
                        // ── New bundle format ──
                        // 1. Merge daily log
                        if (parsed.wave_daily_log) mergeDailyLogs(parsed.wave_daily_log);

                        // 2. Merge IC weights — use newer timestamp wins
                        if (parsed.wave_ic_weights) {
                          try {
                            const localRaw = localStorage.getItem('wave_ic_weights');
                            const localW = localRaw ? JSON.parse(localRaw) : null;
                            const importedW = parsed.wave_ic_weights;
                            const localTs  = localW?._updatedAt  || 0;
                            const importTs = importedW?._updatedAt || 0;
                            if (importTs >= localTs) {
                              localStorage.setItem('wave_ic_weights', JSON.stringify(importedW));
                              if (fsConnected) WaveFS.write(WaveFS.DATA_FILES.ic_weights, importedW).catch(()=>{});
                              console.log('[WAVE] IC weights imported from', parsed._exported, '(newer than local)');
                            } else {
                              console.log('[WAVE] Local IC weights kept (newer than import)');
                            }
                          } catch {}
                        }
                        const from = parsed._exported ? ' (exported '+parsed._exported.slice(0,10)+')' : '';
                        setImportMsg('✓ Bundle imported'+from);
                        setTimeout(()=>setImportMsg(null),5000);
                      } else {
                        // ── Legacy format: bare daily log object ──
                        mergeDailyLogs(parsed);
                      }
                    } catch(err) {
                      setImportMsg('✗ Import failed: '+err.message);
                      setTimeout(()=>setImportMsg(null),4000);
                    }
                    e.target.value='';
                  };
                  reader.readAsText(file);
                }}/>
                <button className="clr-link" onClick={()=>{setShowDailyLog(false);try{sessionStorage.setItem('wave_show_log','0');}catch{}}}>Hide</button>
              </div>
            </div>
            {importMsg&&(
              <div style={{padding:'8px 14px',fontFamily:'IBM Plex Mono',fontSize:'10px',
                color:importMsg.startsWith('✓')?'var(--green)':'var(--red)',
                background:importMsg.startsWith('✓')?'var(--green-bg)':'var(--red-bg)',
                borderBottom:'1px solid var(--border)'}}>
                {importMsg}
              </div>
            )}
            {showBackfill&&(
              <div style={{padding:'12px 14px',borderBottom:'1px solid var(--border)',background:'var(--bg)'}}>
                <div style={{fontFamily:'IBM Plex Mono',fontSize:'10px',color:'var(--amber)',fontWeight:700,marginBottom:'4px'}}>
                  ⏪ BACKFILL ENGINE
                </div>
                <div style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--muted)',marginBottom:'12px',lineHeight:1.6}}>
                  Step 1: Fetch 2Y history once, reuse forever (7-day cache).<br/>
                  Step 2: Replay Wyckoff logic instantly from stored data.<br/>
                  Re-run Step 2 anytime after logic changes — no re-fetching needed.
                </div>

                {/* ── STEP 1: FETCH HISTORY ── */}
                <div style={{marginBottom:'10px'}}>
                  <div style={{fontFamily:'IBM Plex Mono',fontSize:'9px',fontWeight:700,color:'var(--muted)',marginBottom:'6px',letterSpacing:'0.5px'}}>
                    STEP 1 · FETCH 2Y HISTORY
                    {(()=>{
                      // During fetch: show live count from progress; otherwise read localStorage
                      if(fetching) return fetchProgress.fresh>0?<span style={{color:'var(--amber)',marginLeft:'8px'}}>↓ {fetchProgress.fresh} saved…</span>:null;
                      let cnt=0;
                      try{cnt=Object.keys(localStorage).filter(k=>k.startsWith('wave_hist_')).length;}catch{}
                      return cnt>0?<span style={{color:'var(--green)',marginLeft:'8px'}}>✓ {cnt} stocks stored</span>:null;
                    })()}
                  </div>
                  {fetching?(
                    <div>
                      <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}}>
                        <div className="bspin b" style={{width:'10px',height:'10px',borderWidth:'2px',flexShrink:0}}/>
                        <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--muted)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{fetchProgress.step}</span>
                        <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--amber)',flexShrink:0}}>{fetchProgress.pct}%</span>
                      </div>
                      <div className="prog-bar"><div className="prog-fill" style={{width:fetchProgress.pct+'%',background:'var(--blue)'}}/></div>
                      <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px',alignItems:'center'}}>
                        <span style={{fontFamily:'IBM Plex Mono',fontSize:'8px',color:'var(--faint)'}}>
                          {fetchProgress.fresh} new · {fetchProgress.cached} cached · {fetchProgress.failed} failed
                        </span>
                        <button onClick={()=>fetchCancelRef.current=true}
                          style={{fontFamily:'IBM Plex Mono',fontSize:'8px',padding:'1px 8px',borderRadius:'4px',
                            border:'1px solid var(--red-bd)',background:'var(--red-bg)',color:'var(--red)',cursor:'pointer'}}>
                          ✕ Cancel
                        </button>
                      </div>
                    </div>
                  ):fetchProgress.pct===100?(
                    <div style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--green)'}}>✓ {fetchProgress.step}</div>
                  ):(
                    <div style={{display:'flex',gap:'6px'}}>
                      <button onClick={fetchHistory} disabled={replaying}
                        style={{fontFamily:'IBM Plex Mono',fontSize:'10px',fontWeight:700,flex:1,
                          padding:'6px 14px',borderRadius:'6px',border:'none',
                          background:'var(--blue)',color:'#fff',cursor:replaying?'not-allowed':'pointer',opacity:replaying?0.5:1}}>
                        ⬇ {(()=>{let c=0;try{c=Object.keys(localStorage).filter(k=>k.startsWith('wave_hist_')).length;}catch{}return c>0?'Refresh History':'Fetch 2Y History';})()}
                      </button>
                      {(()=>{let c=0;try{c=Object.keys(localStorage).filter(k=>k.startsWith('wave_hist_')).length;}catch{}return c>0;})()&&(
                        <button onClick={()=>{
                          if(!window.confirm('Clear stored history?\n\nThis removes all 2Y candle data. You will need to re-run Fetch History before using Replay.\n\nDaily log entries are NOT affected.')) return;
                          try{Object.keys(localStorage).filter(k=>k.startsWith('wave_hist_')).forEach(k=>localStorage.removeItem(k));}catch{}
                          // Clear from App_Wave if connected
                          if(fsConnected) WaveFS.listHist().then(keys=>{keys.forEach(k=>WaveFS.writeHist(k,null).catch(()=>{}));}).catch(()=>{});
                        }}
                        disabled={replaying||fetching}
                        style={{fontFamily:'IBM Plex Mono',fontSize:'9px',fontWeight:700,flexShrink:0,
                          padding:'6px 10px',borderRadius:'6px',
                          border:'1px solid var(--red-bd)',background:'var(--red-bg)',
                          color:'var(--red)',cursor:'pointer'}}>
                          🗑 Clear
                        </button>
                      )}
                    </div>
                  )}
                </div>

                {/* ── STEP 2: RUN REPLAY ── */}
                <div>
                  <div style={{fontFamily:'IBM Plex Mono',fontSize:'9px',fontWeight:700,color:'var(--muted)',marginBottom:'6px',letterSpacing:'0.5px'}}>
                    STEP 2 · RUN REPLAY (60 DAYS)
                  </div>
                  {replaying?(
                    <div>
                      <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}}>
                        <div className="bspin b" style={{width:'10px',height:'10px',borderWidth:'2px',flexShrink:0}}/>
                        <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--muted)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{replayProgress.step}</span>
                        <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--amber)',flexShrink:0}}>{replayProgress.pct}%</span>
                      </div>
                      <div className="prog-bar"><div className="prog-fill" style={{width:replayProgress.pct+'%',background:'var(--amber)'}}/></div>
                      <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px',alignItems:'center'}}>
                        {replayProgress.days>0&&<span style={{fontFamily:'IBM Plex Mono',fontSize:'8px',color:'var(--faint)'}}>{replayProgress.days} days replayed</span>}
                        <button onClick={()=>replayCancelRef.current=true}
                          style={{fontFamily:'IBM Plex Mono',fontSize:'8px',padding:'1px 8px',borderRadius:'4px',
                            border:'1px solid var(--red-bd)',background:'var(--red-bg)',color:'var(--red)',cursor:'pointer',marginLeft:'auto'}}>
                          ✕ Cancel
                        </button>
                      </div>
                    </div>
                  ):replayProgress.pct===100?(
                    <div style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--green)',marginBottom:'6px'}}>✓ {replayProgress.step}</div>
                  ):null}
                  {!replaying&&(
                    <div style={{display:'flex',gap:'6px',marginTop: replayProgress.pct===100?'6px':'0'}}>
                      <button onClick={runReplay} disabled={fetching}
                        style={{fontFamily:'IBM Plex Mono',fontSize:'10px',fontWeight:700,flex:1,
                          padding:'6px 14px',borderRadius:'6px',border:'none',
                          background:'var(--amber)',color:'#fff',cursor:fetching?'not-allowed':'pointer',opacity:fetching?0.5:1}}>
                        ▶ {Object.keys(dailyLog).some(k=>dailyLog[k].source==='backfill')?'Re-run Replay':'Run Replay'}
                      </button>
                      {Object.keys(dailyLog).length>0&&(
                        <button onClick={()=>{
                          if(!window.confirm('Clear daily log only?\n\nStep 1 history is preserved — no re-fetch needed.')) return;
                          setDailyLog({});
                          try{localStorage.removeItem('wave_daily_log');}catch{}
                          if(fsConnected) WaveFS.write('daily_log', null).catch(()=>{});
                        }}
                        style={{fontFamily:'IBM Plex Mono',fontSize:'9px',fontWeight:700,flexShrink:0,
                          padding:'6px 10px',borderRadius:'6px',
                          border:'1px solid var(--red-bd)',background:'var(--red-bg)',
                          color:'var(--red)',cursor:'pointer'}}>
                          🗑 Clear log
                        </button>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}
            {Object.keys(dailyLog).length===0
              ? <div className="panel-empty">No daily scans saved yet.<br/>Scan before 9:15 AM (pre-market) or after 3:30 PM (post-market) to log.</div>
              : Object.keys(dailyLog).sort((a,b)=>b.localeCompare(a)).map(dateKey => {
                  const day = dailyLog[dateKey];
                  const expanded = expandedDays[dateKey];
                  const hasPre  = !!day.pre;
                  const hasPost = !!day.post;
                  const rawOutcomes = day.outcomes||[];
                  // Sort: entered trades first (by rMultiple desc), then missed, then stale
                  const enteredSorted = rawOutcomes.filter(o=>o.entryHit).sort((a,b)=>(b.rMultiple??b.magnitude)-(a.rMultiple??a.magnitude));
                  const missedSorted  = rawOutcomes.filter(o=>!o.entryHit&&!o.isStale);
                  const staleSorted   = rawOutcomes.filter(o=>o.isStale);
                  const outcomes = [...enteredSorted, ...missedSorted, ...staleSorted];
                  const entered  = enteredSorted;
                  const missed   = missedSorted;
                  const stale    = staleSorted;
                  const hits     = entered.filter(o=>o.directionHit).length;
                  const hitRate  = entered.length ? Math.round(hits/entered.length*100) : null;
                  return (
                    <div key={dateKey} className="dl-day">
                      <div className="dl-day-hdr" onClick={()=>setExpandedDays(p=>({...p,[dateKey]:!p[dateKey]}))}>
                        <span className="dl-date">{new Date(dateKey.length===10?dateKey+'T12:00:00':dateKey).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</span>
                        {hasPre  && <span className="dl-badge dl-badge-pre">PRE {day.pre.scans.length}</span>}
                        {hasPost && <span className="dl-badge dl-badge-post">POST {day.post.scans.length}</span>}
                        {hitRate!==null && (
                          <span className="dl-badge dl-badge-acc" style={{marginLeft:'auto',background:hitRate>=60?'var(--green-bg)':hitRate>=40?'var(--amber-bg)':'var(--red-bg)',color:hitRate>=60?'var(--green)':hitRate>=40?'var(--amber)':'var(--red)',borderColor:hitRate>=60?'var(--green-bd)':hitRate>=40?'var(--amber-bd)':'var(--red-bd)'}}>
                            {hitRate}% hit ({hits}/{entered.length})
                            {(missed.length>0||stale.length>0)&&<span style={{opacity:0.6,marginLeft:'4px'}}>· {missed.length+stale.length} missed</span>}
                          </span>
                        )}
                        {hitRate===null && <span style={{marginLeft:'auto',fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--faint)'}}>
                          {(()=>{
                            if(!hasPre&&!hasPost) return 'empty';
                            if(!hasPost) return 'awaiting post';
                            if(!hasPre&&!day.outcomeSource) return 'no pre scan';
                            return 'no match';
                          })()}
                        </span>}
                        <span style={{color:'var(--muted)',fontSize:'10px',marginLeft:'4px'}}>{expanded?'▲':'▼'}</span>
                        <button onClick={e=>{
                          e.stopPropagation();
                          if(!window.confirm('Delete log for '+dateKey+'?')) return;
                          setDailyLog(prev=>{
                            const next={...prev};
                            delete next[dateKey];
                            saveDailyLog(next);
                            return next;
                          });
                        }} style={{background:'none',border:'none',color:'var(--faint)',fontSize:'13px',cursor:'pointer',padding:'0 2px',lineHeight:1}} title="Delete">🗑</button>
                      </div>

                      {expanded&&(
                        <>
                          {/* Outcomes section */}
                          {outcomes.length>0&&(
                            <>
                              <div style={{padding:'4px 12px',background:'var(--bg)',borderTop:'1px solid var(--border)',fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--muted)',fontWeight:700,letterSpacing:'.5px'}}>
                                OUTCOMES · {day.pre?.tf||day.post?.tf} · {day.pre?.universe||day.post?.universe}
                                {day.outcomeSource&&<span style={{color:'var(--blue)',fontWeight:400,marginLeft:'6px'}}>{day.outcomeSource==='same-day-pre'?'vs same-day pre':day.outcomeSource==='10d-window'?'10-day window':'vs '+day.outcomeSource+' post'}</span>}
                                <span style={{marginLeft:'auto',fontFamily:'IBM Plex Mono',fontSize:'8px',color:'var(--faint)',fontWeight:400}}>
                                  {entered.length} entered · {missed.length} missed · {stale.length} stale
                                </span>
                              </div>
                              {outcomes.map((o,i)=>{
                                const resultColor = !o.entryHit?'var(--faint)':o.stopHit?'var(--red)':o.targetHit?'var(--green)':o.directionHit?'var(--green)':'var(--red)';
                                const rLabel = o.rMultiple!==undefined
                                  ? (o.rMultiple>=0?'+':'')+o.rMultiple+'R'
                                  : (o.magnitude>=0?'+':'')+o.magnitude+'%';
                                // For missed: show how far price was from entry (direction-aware)
                                // BUY missed: price above entry = "+X% above entry" (too extended to buy)
                                // SHORT missed: price below entry = "-X% below entry" (too extended to short)
                                const pctFromEntry = o.preEntry>0
                                  ? o.type==='BUY'
                                    ? ((o.eodPrice-o.preEntry)/o.preEntry*100)   // + means above entry
                                    : ((o.preEntry-o.eodPrice)/o.preEntry*100)   // + means below entry (moved away for short)
                                  : null;
                                const missedDist = pctFromEntry!==null
                                  ? o.type==='BUY'
                                    ? (pctFromEntry>0?`+${pctFromEntry.toFixed(1)}% above entry`:`${pctFromEntry.toFixed(1)}% below entry`)
                                    : (pctFromEntry>0?`${pctFromEntry.toFixed(1)}% below entry`:`+${Math.abs(pctFromEntry).toFixed(1)}% above entry`)
                                  : '';
                                const resultLabel = !o.entryHit
                                  ? (o.isStale?'STALE':'MISSED')
                                  : o.targetHit?'TARGET ✓'
                                  : o.stopHit?'STOP ✗'
                                  : rLabel+' '+(o.directionHit?'✓':'✗');
                                const daysLabel = o.daysHeld>1?` · ${o.daysHeld}d`:'';
                                // Separator before missed block
                                const prevEntered = i>0 && outcomes[i-1].entryHit;
                                const showMissedSep = !o.entryHit && (i===0 || prevEntered);
                                return (
                                  <React.Fragment key={i}>
                                    {showMissedSep&&entered.length>0&&(
                                      <div style={{padding:'3px 12px',background:'var(--bg2)',borderTop:'1px solid var(--border)',fontFamily:'IBM Plex Mono',fontSize:'8px',color:'var(--faint)',letterSpacing:'.3px'}}>
                                        ── {missed.length>0?`${missed.length} MISSED`:''}
                                           {missed.length>0&&stale.length>0?' · ':''}
                                           {stale.length>0?`${stale.length} STALE`:''} · entry never reached ──
                                      </div>
                                    )}
                                    <div className="dl-scan-row" style={{
                                      background: o.stopHit?'rgba(180,30,30,.04)':o.targetHit?'rgba(26,122,66,.04)':!o.entryHit?'transparent':'transparent',
                                      opacity: !o.entryHit ? 0.45 : 1,
                                    }}>
                                      <div style={{display:'flex',flexDirection:'column',gap:'1px',flex:1,minWidth:0}}>
                                        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                                          <span className="dl-scan-sym" style={{color:o.type==='BUY'?'var(--green)':'var(--red)'}}>{o.type==='BUY'?'▲':'▼'} {o.symbol}</span>
                                          <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',padding:'1px 5px',borderRadius:'8px',background:'var(--bg2)',color:'var(--muted)'}}>Ph {o.phase}</span>
                                          <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--faint)'}}>{o.preConf}%</span>
                                        </div>
                                        <div style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--faint)'}}>
                                          Entry ₹{o.preEntry.toLocaleString('en-IN')} · {o.entryHit?(o.daysHeld>1?`${o.daysHeld}d`:'Day 1'):missedDist}{o.isStale?' · stale':''} · Day {o.dayMove>=0?'+':''}{o.dayMove}%
                                          {o.outcomeWindow&&<span style={{marginLeft:'4px',color:'var(--faint)',opacity:.7}}>· ⏱{o.outcomeWindow}d/{o.rangeBars||'?'}r</span>}
                                        </div>
                                      </div>
                                      <span className="dl-outcome" style={{color:resultColor}}>{resultLabel}</span>
                                    </div>
                                  </React.Fragment>
                                );
                              })}
                              {/* Factor breakdown */}
                              {(()=>{
                                const ph  = {C:{t:0,h:0,tgt:0},D:{t:0,h:0,tgt:0},E:{t:0,h:0,tgt:0}};
                                const rsPos={t:0,h:0}, rsNeg={t:0,h:0};
                                const rsiOS={t:0,h:0}, rsiOB={t:0,h:0};
                                const confHi={t:0,h:0}, confLo={t:0,h:0};
                                const buyS={t:0,h:0}, sellS={t:0,h:0};
                                outcomes.forEach(o=>{
                                  if(!o.entryHit) return; // only count entered trades
                                  if(ph[o.phase]){ph[o.phase].t++;if(o.directionHit)ph[o.phase].h++;if(o.targetHit)ph[o.phase].tgt++;}
                                  if(o.rs!=null){
                                    if(o.rs>0){rsPos.t++;if(o.directionHit)rsPos.h++;}
                                    else{rsNeg.t++;if(o.directionHit)rsNeg.h++;}
                                  }
                                  if(o.rsi14!=null){
                                    if(o.rsi14<40){rsiOS.t++;if(o.directionHit)rsiOS.h++;}
                                    else if(o.rsi14>60){rsiOB.t++;if(o.directionHit)rsiOB.h++;}
                                  }
                                  if(o.preConf>=75){confHi.t++;if(o.directionHit)confHi.h++;}
                                  else{confLo.t++;if(o.directionHit)confLo.h++;}
                                  if(o.type==='BUY'){buyS.t++;if(o.directionHit)buyS.h++;}
                                  else{sellS.t++;if(o.directionHit)sellS.h++;}
                                });
                                const pct=(s)=>s.t>0?Math.round(s.h/s.t*100)+'%':'—';
                                const col=(s)=>s.t>0?(s.h/s.t>=0.65?'var(--green)':s.h/s.t>=0.45?'var(--amber)':'var(--red)'):'var(--faint)';
                                const stats=[
                                  ...['C','D','E'].filter(p=>ph[p].t>0).map(p=>({label:'Ph '+p,val:pct(ph[p]),col:col(ph[p]),sub:ph[p].tgt>0?ph[p].tgt+' tgt':null})),
                                  ...(rsPos.t>0?[{label:'RS+',val:pct(rsPos),col:col(rsPos),sub:null}]:[]),
                                  ...(rsNeg.t>0?[{label:'RS−',val:pct(rsNeg),col:col(rsNeg),sub:null}]:[]),
                                  ...(rsiOS.t>0?[{label:'RSI<40',val:pct(rsiOS),col:col(rsiOS),sub:null}]:[]),
                                  ...(rsiOB.t>0?[{label:'RSI>60',val:pct(rsiOB),col:col(rsiOB),sub:null}]:[]),
                                  ...(confHi.t>0?[{label:'Conf≥75',val:pct(confHi),col:col(confHi),sub:null}]:[]),
                                  ...(buyS.t>0?[{label:'BUY',val:pct(buyS),col:col(buyS),sub:null}]:[]),
                                  ...(sellS.t>0?[{label:'SHORT',val:pct(sellS),col:col(sellS),sub:null}]:[]),
                                ];
                                return (
                                  <div className="dl-accuracy" style={{flexWrap:'wrap',gap:'10px 16px'}}>
                                    {stats.map((s,i)=>(
                                      <div key={i} style={{textAlign:'center'}}>
                                        <div className="dl-acc-stat">{s.label}</div>
                                        <div className="dl-acc-val" style={{color:s.col}}>{s.val}</div>
                                        {s.sub&&<div style={{fontFamily:'IBM Plex Mono',fontSize:'8px',color:'var(--faint)'}}>{s.sub}</div>}
                                      </div>
                                    ))}
                                  </div>
                                );
                              })()}
                            </>
                          )}

                          {/* Pre-market scans */}
                          {hasPre&&outcomes.length===0&&(
                            <>
                              <div style={{padding:'4px 12px',background:'var(--bg)',borderTop:'1px solid var(--border)',fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--blue)',fontWeight:700,letterSpacing:'.5px'}}>
                                PRE-MARKET · {day.pre.time} · {day.pre.tf} · {day.pre.universe}
                              </div>
                              {day.pre.scans.map((s,i)=>(
                                <div key={i} className="dl-scan-row">
                                  <span className="dl-scan-sym" style={{color:s.type==='BUY'?'var(--green)':'var(--red)'}}>{s.type==='BUY'?'▲':'▼'} {s.symbol}</span>
                                  <span className="dl-scan-meta">Ph {s.phase} · {s.confidence}% · ₹{s.entry.toLocaleString('en-IN')}</span>
                                  {s.rs!=null&&<span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:s.rs>=0?'var(--green)':'var(--red)',whiteSpace:'nowrap'}}>RS {s.rs>=0?'+':''}{s.rs}%</span>}
                                </div>
                              ))}
                            </>
                          )}

                          {/* Post-market note if no pre */}
                          {!hasPre&&hasPost&&outcomes.length===0&&(
                            <>
                              <div style={{padding:'4px 12px',background:'var(--bg)',borderTop:'1px solid var(--border)',fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--green)',fontWeight:700,letterSpacing:'.5px'}}>
                                POST-MARKET · {day.post.time} · {day.post.tf} · {day.post.universe}
                              </div>
                              {day.post.scans.map((s,i)=>(
                                <div key={i} className="dl-scan-row">
                                  <span className="dl-scan-sym" style={{color:s.type==='BUY'?'var(--green)':'var(--red)'}}>{s.type==='BUY'?'▲':'▼'} {s.symbol}</span>
                                  <span className="dl-scan-meta">Ph {s.phase} · {s.confidence}% · ₹{s.entry.toLocaleString('en-IN')}</span>
                                  {s.rs!=null&&<span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:s.rs>=0?'var(--green)':'var(--red)',whiteSpace:'nowrap'}}>RS {s.rs>=0?'+':''}{s.rs}%</span>}
                                </div>
                              ))}
                              <div style={{padding:'6px 12px',fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--faint)',borderTop:'1px solid var(--border)'}}>
                                Tomorrow's post-market scan will compare against these signals.
                              </div>
                            </>
                          )}
                        </>
                      )}
                    </div>
                  );
                })
            }
          </div>
        )}

        {showWL&&(
          <div className="panel">
            <div className="panel-hdr">
              <span className="panel-title">★ Watchlist</span>
              <button className="clr-link" onClick={()=>setShowWL(false)}>Hide</button>
            </div>
            {watchlist.length===0
              ? <div className="panel-empty">Tap ☆ on any signal card to save a stock.</div>
              : watchlist.map((w,i)=>(
                  <div key={i} className="wl-item">
                    <span className="wl-sym">{w.symbol}</span>
                    <span className="wl-name">{w.name}</span>
                    <button className="wl-go" onClick={()=>{ setPickedStock(w); setSingleDone(false); setSingleBuys([]); setSingleSells([]); setShowWL(false); runScanRef.current && runScanRef.current(w); }}>Analyse →</button>
                    <button className="wl-rm" onClick={()=>setWatchlist(p=>p.filter(x=>x.symbol!==w.symbol))}>✕</button>
                  </div>
                ))
            }
          </div>
        )}

        {!done&&!scanning&&(
          <div className="empty-wrap">
            <div className="empty-icon">⚡</div>
            <div className="empty-title">WAVE</div>
            <div className="empty-body">{pickedStock?'Stock loaded — chart shown above.':'Choose filters (or leave empty for All), then tap Scan.'}</div>
          </div>
        )}

                                <div className="ol-v">
                                  {o.rsi14!=null
                                    ?<span className={'rsi-badge '+(o.rsi14>=70?'rsi-ob':o.rsi14<=30?'rsi-os':'rsi-mid')}>{o.rsi14}{o.rsi14>=70?' OB':o.rsi14<=30?' OS':''}</span>
                                    :<span style={{color:'var(--faint)'}}>—</span>}
                                </div>
                              </div>
                            </div>
                          </div>
                          <div className="opp-conf" style={{cursor:'pointer'}} onClick={()=>setSelectedOpp(o)}>
                            <div className="opp-cbar"><div className={'opp-cfill '+(isBuy?'b':'s')} style={{width:o.confidence+'%'}}/></div>
                            <span className={'opp-cpct '+(isBuy?'b':'s')}>{o.confidence}% conf</span>
                          </div>
                          <div style={{borderTop:'1px solid var(--border)',paddingTop:'7px',marginTop:'6px'}}>
                            {thisAlert?(
                              <div className="alert-active">
                                <span>🔔 Alert: ₹{thisAlert.price.toLocaleString('en-IN')} ({thisAlert.above?'above':'below'})</span>
                                <button className="alert-rm" onClick={()=>removeAlert(o.symbol,thisAlert.price)}>✕</button>
                              </div>
                            ):(
                              <div className="alert-row">
                                <input className="alert-inp" type="number" placeholder="Alert price" value={aVal}
                                  onChange={e=>setAlertInput(o.symbol,e.target.value)}
                                  onClick={e=>e.stopPropagation()} />
                                <button className="alert-set" onClick={e=>{e.stopPropagation();if(aVal){addAlert(o.symbol,o.yahoo,aVal,parseFloat(aVal)>=o.lastClose);setAlertInput(o.symbol,'');}}}>🔔 Set</button>
                              </div>
                            )}
                          </div>
                        </>
                      )}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
          </>}
          <div className="disclaimer">
            <strong>⚠ Disclaimer:</strong> WAVE v1.5 · Wyckoff Analysis &amp; Visual Engine · Yahoo Finance data. v1.5: Cause &amp; Effect engine — phase+range-aware outcome windows (12–28d) + cause-scaled targets. v1.4: Spring vol quality, ST-after-UTAD, LPS/LPSY retest vol scoring. Educational only — not financial advice.
          </div>
        </>)}
      </div>

      {selectedOpp&&<DetailSheet opp={selectedOpp} tf={tf} onClose={()=>setSelectedOpp(null)}/>}
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));


</script>
</body>
</html>
