    let stC=0;for(let i=scIdx+3;i<arIdx+20&&i<lows.length;i++) if(lows[i]<scPrice*1.025) stC++;
    if(stC>=2){phase="B";stageNum=5;stageName="Secondary Tests";confidence=58;phClass="sp-b";}
    else{phase="A";stageNum=3;stageName="Automatic Rally / Secondary Test";confidence=45;phClass="sp-a";}
  }
  const stHist=[];
  if(scIdx>0) stHist.push({idx:scIdx,label:"SC",color:"#c0202e"});
  if(arIdx>0) stHist.push({idx:arIdx,label:"AR",color:"#b06010"});
  if(springIdx>0) stHist.push({idx:springIdx,label:"Sp",color:"#1a7a42"});
  if(jacIdx>0) stHist.push({idx:jacIdx,label:"JAC",color:"#1a50a0"});
  const isLPS=phase==="D"&&stageNum===11;
  const rrNum=rangeSize>0?((target1-arPrice*1.002)/(arPrice*1.002-arPrice*.982)).toFixed(1):"—";
  const entries=buildAccEntries(phase,stageNum,scPrice,arPrice,springLow,lastClose,rangeSize,jacIdx>0);

  // ── Structural quality gate ──
  // Requires: prior trend ≥ 20% (daily) / 30% (weekly) into SC + range ≥ 20 bars (daily) / 15 (weekly)
  const _structMinDrop = _isWeekly ? 0.30 : 0.20;
  const _minRangeBars  = _isWeekly ? 15 : 20;
  const _windowHigh    = highs.length > 0 ? Math.max(...highs.slice(0, scIdx > 0 ? scIdx : Math.floor(n*0.5))) : 0;
  const _priorTrendOk  = _windowHigh > 0 && scPrice > 0 && (_windowHigh - scPrice) / _windowHigh >= _structMinDrop;
  const _rangeBarsOk   = arIdx > 0 && scIdx >= 0 && (arIdx - scIdx) >= 2 && (n - scIdx) >= _minRangeBars;
  const wyckoffFit     = _priorTrendOk && _rangeBarsOk;

  // ── Named setup key for granular filtering ──
  // Maps stageNum to a short token used by the setup filter chips
  const stageKey = jacIdx>0 && phase==='E' ? 'markup'
    : isLPS                                 ? 'lps'
    : phase==='D' && stageNum===9           ? 'jac'
    : phase==='C'                           ? 'spring'
    : 'other';

  return {mode:"acc",phase,phClass,stageNum,stageName,confidence,
    wyckoffFit, stageKey,
    creekRetestQuality, springVolQuality,
    scIdx,scPrice,arIdx,arPrice,springIdx,springLow,jacIdx,
    rangeSize,target1,target2,lastClose,volRatio,avgVol,
    stageHistory:stHist,isLPS,rrNum,entries};
}

function buildAccEntries(phase,sn,sc,ar,sl,lc,rs,jac){
  const f=v=>Math.round(v).toLocaleString('en-IN');
  const e=[];
  if(phase==="C"&&sn===7) e.push({type:"Spring Entry (Best R:R)",entry:f(sl*1.003),stop:f(sl*.992),target:f(ar*1.01),rr:"1:4-1:6",desc:"Enter on Spring reversal — close back above SC after false breakdown.",status:"ACTIVE",mode:"acc"});
  if((phase==="D"||jac)&&sn>=9) e.push({type:"LPS After JAC",entry:f(ar*1.002),stop:f(ar*.982),target:f(ar+rs),rr:"1:2.5-1:4",desc:"Buy pullback to Creek on low volume. Creek now acts as support.",status:sn===11?"ACTIVE":"WATCH",mode:"acc"});
  if(phase==="E"||sn>=13) e.push({type:"Breakout Retest",entry:f(ar+rs*.9),stop:f(ar+rs*.7),target:f(ar+rs*1.5),rr:"1:2-1:3",desc:"Buy retest of breakout level on contracting volume.",status:"WATCH",mode:"acc"});
  if(phase==="B") e.push({type:"Range Low (Aggressive)",entry:f(sc*1.005),stop:f(sl*.99),target:f(ar*.995),rr:"1:2-1:3",desc:"Accumulate near SC during Phase B.",status:"WATCH",mode:"acc"});
  if(!e.length) e.push({type:"No Active Setup",entry:"—",stop:"—",target:"—",rr:"—",desc:"Pattern developing. Wait for SC, tests, and Spring.",status:"WAIT",mode:"acc"});
  return e;
}

/* ── DISTRIBUTION DETECTION ── */
function detectDistribution(candles) {
  if (!candles||candles.length<30) return null;
  const n=candles.length;
  const closes=candles.map(c=>c.close), highs=candles.map(c=>c.high),
        lows=candles.map(c=>c.low), vols=candles.map(c=>c.volume);
  const avgVol=vols.reduce((a,b)=>a+b,0)/n;
  let bcIdx=-1,arIdx=-1,utIdx=-1,utadIdx=-1,sokIdx=-1,lpsy1=-1,bcPrice=0,icePrice=0;

  // ── Infer timeframe ──
  const _inferIsWeeklyD = () => {
    if(n < 2) return false;
    const d0 = new Date(candles[n-1].date), d1 = new Date(candles[n-2].date);
    return Math.abs(d0 - d1) / 86400000 >= 5;
  };
  const _isWeeklyD   = _inferIsWeeklyD();
  const _bcMinRise   = _isWeeklyD ? 0.25 : 0.15;
  const _bcLookback  = _isWeeklyD ? 60   : 90;

  // ── Prior uptrend requirement ──
  const _validateBC = (idx) => {
    if(idx < 5) return false;
    const lookback = Math.max(0, idx - _bcLookback);
    const priorLow = Math.min(...lows.slice(lookback, idx));
    return (highs[idx] - priorLow) / priorLow >= _bcMinRise;
  };

  // ── Find most recent valid BC — scan backwards from n*0.75 ──
  const _bcSearchEnd   = Math.floor(n * 0.75);
  const _bcSearchStart = 3;
  let bcFound = false;
  for(let i = _bcSearchEnd; i >= _bcSearchStart; i--) {
    if(_validateBC(i)) {
      // Find the highest bar in a ±5 bar window around this point
      let peakIdx = i;
      for(let j = Math.max(_bcSearchStart, i-5); j <= Math.min(_bcSearchEnd, i+5); j++) {
        if(highs[j] > highs[peakIdx] && _validateBC(j)) peakIdx = j;
      }
      bcIdx = peakIdx; bcPrice = highs[bcIdx]; bcFound = true; break;
    }
  }
  // Fallback: highest high in window
  if(!bcFound) {
    let maxH = 0;
    for(let i = _bcSearchStart; i <= _bcSearchEnd; i++) {
      if(highs[i] > maxH) { maxH = highs[i]; bcIdx = i; }
    }
    bcPrice = highs[bcIdx];
  }
  // ── Timeframe-aware search windows for distribution ──
  // AR (auto reaction down) should be first significant drop within 3-4 weeks of BC on weekly
  const _arWindowD = _isWeeklyD ? 12 : 25;
  const _utWindowD = _isWeeklyD ? 50 : 40;
  const _utadWinD  = _isWeeklyD ? 65 : 55;

  let minAR=Infinity;
  for(let i=bcIdx+1;i<Math.min(bcIdx+_arWindowD,n-1);i++) if(lows[i]<minAR){minAR=lows[i];arIdx=i;}
  icePrice=minAR;
  for(let i=arIdx+2;i<Math.min(arIdx+_utWindowD,n-10);i++) if(highs[i]>bcPrice*.998&&closes[i]<bcPrice){utIdx=i;break;}
  for(let i=(utIdx>0?utIdx+3:arIdx+15);i<Math.min(n-8,arIdx+_utadWinD);i++) if(highs[i]>bcPrice&&closes[i]<bcPrice*1.002){utadIdx=i;break;}

  // ── v1.4 Gap 2: UTAD Secondary Test detection ──
  // After UTAD, a lower-high rally that fails to reach bcPrice = ST of UTAD.
  // This is the HIGHEST confidence short entry: lower high confirmed, distribution complete.
  // stUtad: index of secondary test after UTAD, stUtadVolQuality: 2=textbook low-vol, 1=ok, 0=weak
  let stUtadIdx = -1, stUtadVolQuality = 0;
  if(utadIdx > 0 && utadIdx < n - 5) {
    // Look for a rally after UTAD that makes a lower high (below bcPrice) and reverses
    for(let i = utadIdx + 2; i < Math.min(utadIdx + 30, n - 3); i++) {
      if(highs[i] > icePrice * 1.02 && highs[i] < bcPrice * 0.998 && closes[i] < highs[i] * 0.995) {
        stUtadIdx = i;
        // Volume at ST should be lower than UTAD volume = no buying interest
        const utadVol = vols[utadIdx];
        const stVol   = vols[i];
        stUtadVolQuality = stVol < utadVol * 0.65 ? 2 : stVol < utadVol ? 1 : 0;
        break;
      }
    }
  }
  // Also detect UT Secondary Test (lower-high test of UT, when no UTAD)
  let stUtIdx = -1, stUtVolQuality = 0;
  if(utIdx > 0 && utadIdx < 0 && utIdx < n - 5) {
    for(let i = utIdx + 2; i < Math.min(utIdx + 25, n - 3); i++) {
      if(highs[i] > icePrice * 1.01 && highs[i] < bcPrice * 0.998 && closes[i] < highs[i] * 0.996) {
        stUtIdx = i;
        const utVol  = vols[utIdx];
        const stVol  = vols[i];
        stUtVolQuality = stVol < utVol * 0.65 ? 2 : stVol < utVol ? 1 : 0;
        break;
      }
    }
  }
  for(let i=(utadIdx>0?utadIdx+2:arIdx+20);i<n-5;i++) if(closes[i]<icePrice*1.002&&vols[i]>avgVol*1.1){sokIdx=i;break;}
  if(sokIdx>0) for(let i=sokIdx+2;i<n-3;i++) if(closes[i]>icePrice*.995&&closes[i]<icePrice*1.02){lpsy1=i;break;}
  const lastClose=closes[n-1], volRatio=vols.slice(-5).reduce((a,b)=>a+b,0)/(5*avgVol);
  const rangeSize=bcPrice-icePrice, target1=icePrice-rangeSize*.75, target2=icePrice-rangeSize*1.25;
  let hvUp=0;for(let i=bcIdx;i<Math.min(arIdx+10,n);i++) if(candles[i].close>candles[i].open) hvUp++;
  let phase="A",stageNum=1,stageName="Preliminary Supply / Buying Climax",confidence=42,phClass="sp-ra";
  if(sokIdx>0){
    if(lastClose<icePrice){
      if(lpsy1>0&&n-1>lpsy1){phase="E";stageNum=15;stageName="Markdown Phase — Active";confidence=78;phClass="sp-re";}
      else{phase="D";stageNum=13;stageName="Sign of Weakness / Ice Broken";confidence=72;phClass="sp-rd";}
    }else{phase="D";stageNum=12;stageName="Sign of Weakness — Testing Ice";confidence=68;phClass="sp-rd";}
  } else if(utIdx>0||utadIdx>0){
    const ut=utadIdx>0?utadIdx:utIdx;
    // v1.4: ST after UTAD is higher confidence than bare UTAD
    if(stUtadIdx>0){
      phase="C";stageNum=11;stageName="ST After UTAD — Distribution Confirmed";confidence=76;phClass="sp-rc";
    } else if(stUtIdx>0){
      phase="C";stageNum=10;stageName="ST After UT — Lower High Confirmed";confidence=71;phClass="sp-rc";
    } else if(n-1-ut<15){
      phase="C";stageNum=9;stageName="Upthrust After Distribution (UTAD)";confidence=70;phClass="sp-rc";
    } else {
      phase="C";stageNum=10;stageName="Phase C — Distribution Near Complete";confidence=65;phClass="sp-rc";
    }
  } else if(arIdx>0){
    let stC=0;for(let i=arIdx+2;i<Math.min(arIdx+40,n);i++) if(highs[i]>bcPrice*.985) stC++;
    if(stC>=2){phase="B";stageNum=6;stageName="Phase B — Supply Absorption";confidence=58;phClass="sp-rb";}
    else{phase="A";stageNum=4;stageName="Automatic Reaction / Secondary Test";confidence=46;phClass="sp-ra";}
  }
  const stHist=[];
  if(bcIdx>0)     stHist.push({idx:bcIdx,    label:"BC",   color:"#c0202e"});
  if(arIdx>0)     stHist.push({idx:arIdx,    label:"AR",   color:"#1a50a0"});
  if(utIdx>0)     stHist.push({idx:utIdx,    label:"UT",   color:"#c04050"});
  if(utadIdx>0)   stHist.push({idx:utadIdx,  label:"UTAD", color:"#c0202e"});
  if(stUtadIdx>0) stHist.push({idx:stUtadIdx,label:"ST",   color:"#8b0040"});
  else if(stUtIdx>0) stHist.push({idx:stUtIdx,label:"ST",  color:"#8b0040"});
  if(sokIdx>0)    stHist.push({idx:sokIdx,   label:"SOW",  color:"#8b0018"});
  if(lpsy1>0)     stHist.push({idx:lpsy1,    label:"LPSY", color:"#6030a0"});
  const isLPSY=(phase==="D"&&(stageNum===12||stageNum===13))||(sokIdx>0&&lpsy1>0);
  const rrNum=rangeSize>0?((icePrice*1.005-target1)/(icePrice*1.022-icePrice*1.005)).toFixed(1):"—";
  const entries=buildDistEntries(phase,stageNum,bcPrice,icePrice,lastClose,rangeSize,sokIdx>0,utadIdx>0);

  // ── Structural quality gate ──
  // Requires: prior rally ≥ 20% (daily) / 30% (weekly) into BC + range ≥ 20 bars (daily) / 15 (weekly)
  const _structMinRise = _isWeeklyD ? 0.30 : 0.20;
  const _minRangeBarsD = _isWeeklyD ? 15 : 20;
  const _windowLow     = lows.length > 0 ? Math.min(...lows.slice(0, bcIdx > 0 ? bcIdx : Math.floor(n*0.5))) : Infinity;
  const _priorTrendOkD = _windowLow < Infinity && bcPrice > 0 && (bcPrice - _windowLow) / _windowLow >= _structMinRise;
  const _rangeBarsOkD  = arIdx > 0 && bcIdx >= 0 && (arIdx - bcIdx) >= 2 && (n - bcIdx) >= _minRangeBarsD;
  const wyckoffFit     = _priorTrendOkD && _rangeBarsOkD;

  // ── Named setup key for granular filtering ──
  const stageKey = phase==='E'                              ? 'markdown'
    : isLPSY                                               ? 'lpsy'
    : phase==='D' && (stageNum===12||stageNum===13)        ? 'sow'
    : phase==='C'                                          ? 'utad'
    : 'other';

  return {mode:"dist",phase,phClass,stageNum,stageName,confidence,
    wyckoffFit, stageKey,
    bcIdx,bcTopPrice:bcPrice,arIdx,icePrice,utIdx,utadIdx,
    stUtadIdx,stUtadVolQuality,stUtIdx,stUtVolQuality,
    sokIdx,lpsy1,
    rangeSize,target1,target2,lastClose,volRatio,avgVol,highVolUp:hvUp>3,
    stageHistory:stHist,isLPSY,rrNum,entries};
}

/* ── DYNAMIC CONFIDENCE SCORER ──
   Called ONCE per stock in scanStock, after RS and RSI are available.
   Additive only — bonuses raise the base phase score, nothing suppresses results.
   Final score clamped to 95% max.
*/
function scoreConfidence(baseConf, mode, params) {
  let bonus = 0;
  const {
    volRatioSC = 1,   // volume at SC/BC vs average
    rangeBars  = 0,   // bars spanning the trading range
    rangeSize  = 0,   // price range (AR-SC or BC-Ice)
    lastClose  = 0,
    rs         = null,  // RS vs Nifty (available at scan time)
    rsi14      = null,  // RSI(14)
    volRatioLast = 1,   // latest bar volume vs 20-bar avg
    rr         = null,  // R:R ratio
    hasSpring  = false,
    hasJAC     = false,
    creekRetestQuality = 0,
    springVolQuality   = 0, // v1.4 Gap 1: 2=textbook low-vol, 1=ok, 0=weak
    hasUTAD    = false,
    hasSOW     = false,
    hasLPSY    = false,
    stUtadVolQuality = 0, // v1.4 Gap 2: ST-after-UTAD volume quality
    stUtVolQuality   = 0, // v1.4 Gap 2: ST-after-UT volume quality
    lpsRetestVolQuality = 0, // v1.4 Gap 3: LPS/LPSY retest volume quality
    sectorRsBonus = 0,
    spreadContraction = 1,
  } = params || {};

  // ── Climax volume quality ──
  if      (volRatioSC >= 3.0) bonus += 6;
  else if (volRatioSC >= 2.0) bonus += 4;
  else if (volRatioSC >= 1.5) bonus += 2;

  // ── Range duration (cause = effect) ──
  if      (rangeBars >= 60) bonus += 5;
  else if (rangeBars >= 30) bonus += 3;
  else if (rangeBars >= 15) bonus += 1;

  // ── RS confirmation ──
  if (rs !== null) {
    if (mode === 'acc') {
      if      (rs >= 5) bonus += 5;
      else if (rs >= 0) bonus += 2;
    } else {
      if      (rs <= -5) bonus += 5;
      else if (rs <=  0) bonus += 2;
    }
  }

  // ── RSI context ──
  if (rsi14 !== null) {
    if (mode === 'acc') {
      if      (rsi14 <= 30) bonus += 5;
      else if (rsi14 <= 45) bonus += 2;
    } else {
      if      (rsi14 >= 70) bonus += 5;
      else if (rsi14 >= 55) bonus += 2;
    }
  }

  // ── Key Wyckoff event confirmations ──
  if (mode === 'acc') {
    if (hasSpring) bonus += 3;
    if (hasJAC)    bonus += 4;
    if (creekRetestQuality === 2) bonus += 5;
    else if (creekRetestQuality === 1) bonus += 2;

    // v1.4 Gap 1: Spring volume quality bonus
    // Textbook low-vol Spring = strong absorption evidence → significant bonus
    if      (springVolQuality === 2) bonus += 6; // textbook: Spring vol < 70% of SC vol
    else if (springVolQuality === 1) bonus += 2; // acceptable: Spring vol < SC vol
    // springVolQuality === 0 means no bonus (high-vol Spring = weak signal)

    // v1.4 Gap 3: LPS retest on low volume (for accumulation)
    // Low-vol Creek retest after JAC = supply dried up, markup imminent
    if      (lpsRetestVolQuality === 2) bonus += 6; // textbook low-vol LPS
    else if (lpsRetestVolQuality === 1) bonus += 3;

  } else {
    if (hasUTAD)   bonus += 4;
    if (hasSOW)    bonus += 3;
    if (hasLPSY)   bonus += 3;

    // v1.4 Gap 2: ST-after-UTAD volume quality
    // Low-vol secondary test after UTAD = no buyers at all → highest dist confidence
    if      (stUtadVolQuality === 2) bonus += 7; // textbook: ST vol << UTAD vol
    else if (stUtadVolQuality === 1) bonus += 3;
    // ST-after-UT (when no UTAD detected)
    if      (stUtVolQuality === 2)   bonus += 5;
    else if (stUtVolQuality === 1)   bonus += 2;

    // v1.4 Gap 3: LPSY retest on low volume
    // Weak low-vol rally back to Ice = demand exhausted → confirm short
    if      (lpsRetestVolQuality === 2) bonus += 6;
    else if (lpsRetestVolQuality === 1) bonus += 3;
  }

  // ── Current bar volume spike ──
  if      (volRatioLast >= 2.5) bonus += 3;
  else if (volRatioLast >= 1.8) bonus += 2;

  // ── R:R quality ──
  const rrNum = parseFloat(rr);
  if (!isNaN(rrNum)) {
    if      (rrNum >= 3.0) bonus += 3;
    else if (rrNum >= 2.0) bonus += 1;
  }

  // ── Range size as % of price (potential move) ──
  if (lastClose > 0 && rangeSize > 0) {
    const pct = rangeSize / lastClose * 100;
    if      (pct >= 15) bonus += 3;
    else if (pct >=  8) bonus += 1;
  }

  // ── Spread contraction (absorption signature) ──
  if (spreadContraction <= 0.65) bonus += 4;
  else if (spreadContraction <= 0.80) bonus += 2;

  // ── Sector RS bonus ──
  bonus += sectorRsBonus;

  return Math.min(95, Math.round(baseConf + bonus));
}

function buildDistEntries(phase,sn,bc,ice,lc,rs,sow,utad){
  const f=v=>Math.round(v).toLocaleString('en-IN');
  const e=[];
  if((phase==="C"&&utad)||sn===9) e.push({type:"UTAD Short (Best R:R)",short:f(bc*.998),stop:f(bc*1.012),cover:f(ice*1.002),rr:"1:4-1:7",desc:"Short UTAD bull trap — exceeds BC high then reverses on low volume.",status:"ACTIVE",mode:"dist"});
  if(phase==="D"||sow) e.push({type:"LPSY Short",short:f(ice*1.005),stop:f(ice*1.022),cover:f(ice-rs*.75),rr:"1:2.5-1:4",desc:"Short LPSY — weak rally fails at Ice. Low vol on rally, high vol on decline.",status:(sn===12||sn===13)?"ACTIVE":"WATCH",mode:"dist"});
  if(phase==="E"||sn>=13) e.push({type:"Markdown Continuation",short:f(ice-rs*.1),stop:f(ice*1.005),cover:f(ice-rs*1.25),rr:"1:2-1:3",desc:"Short weak bounces during markdown. Trail stop to lower highs.",status:sn===15?"ACTIVE":"WATCH",mode:"dist"});
  if(phase==="B") e.push({type:"Range High Short",short:f(bc*.998),stop:f(bc*1.015),cover:f(ice*1.01),rr:"1:2-1:3",desc:"Sell near BC top during Phase B. Patience required.",status:"WATCH",mode:"dist"});
  if(!e.length) e.push({type:"No Active Short Signal",short:"—",stop:"—",cover:"—",rr:"—",desc:"Pattern developing. Monitor for BC, AR, and Upthrust.",status:"WAIT",mode:"dist"});
  return e;
}

/* ── SCAN STOCK ── */
async function scanStock(stock, tf, niftyCandles, forceFresh, sectorCandlesMap, weeklyIndexMap, niftyWyckoff, isSingleMode=false) {
  try {
    const candles = await fetchOHLCV(stock.yahoo, tf.period, tf.interval, forceFresh);
    if (!candles||candles.length<30) return null;
    // % change: latest close vs previous candle close (1 bar change in the selected TF)
    const n = candles.length;
    const lastClose = candles[n-1].close;
    const prevClose = candles[n-2].close;
    const pctChg = ((lastClose - prevClose) / prevClose * 100);
    const avgVol20 = candles.slice(n-21,n-1).reduce((s,c)=>s+c.volume,0)/20;
    const volRatioLast = avgVol20>0 ? parseFloat((candles[n-1].volume/avgVol20).toFixed(1)) : 1;
    const volSpike = volRatioLast >= 1.8;
    // Volume spread analysis: bar close position within range (0=bottom, 1=top)
    const lastBar = candles[n-1];
    const barRange = lastBar.high - lastBar.low;
    const closePos = barRange > 0 ? (lastBar.close - lastBar.low) / barRange : 0.5;
    // Context-aware volume signal
    function volSignal(phase, type) {
      if (volRatioLast < 0.5) return {label:'⬇ Vol dry-up', color:'var(--muted)', positive: type==='acc'}; // very low vol
      if (type === 'acc') {
        if (phase === 'C') {
          // Spring: want high vol on dip then shrinking = absorption. Close near top = bullish reversal
          if (volRatioLast >= 1.8 && closePos >= 0.6) return {label:'✅ Vol confirms Spring', color:'var(--green)', positive:true};
          if (volRatioLast < 0.8) return {label:'✅ Vol dry-up (LPS quality)', color:'var(--green)', positive:true};
        }
        if (phase === 'D') {
          // LPS/JAC: want rising on breakout, low on pullback
          if (volRatioLast >= 1.8 && closePos >= 0.5) return {label:'✅ Vol confirms breakout', color:'var(--green)', positive:true};
          if (volRatioLast < 0.8) return {label:'✅ Low vol pullback (LPS)', color:'var(--green)', positive:true};
        }
        if (phase === 'E') {
          if (volRatioLast >= 1.5 && closePos >= 0.5) return {label:'✅ Vol supports markup', color:'var(--green)', positive:true};
        }
        if (volRatioLast >= 2.5 && closePos < 0.4) return {label:'⚠ High vol down-close', color:'var(--amber)', positive:false};
      } else {
        if (phase === 'C') {
          // UTAD: high vol + close near bottom = failed breakout
          if (volRatioLast >= 1.8 && closePos <= 0.4) return {label:'✅ Vol confirms UTAD', color:'var(--red)', positive:true};
        }
        if (phase === 'D') {
          if (volRatioLast >= 1.8 && closePos <= 0.5) return {label:'✅ Vol confirms SOW', color:'var(--red)', positive:true};
          if (volRatioLast < 0.8) return {label:'✅ Low vol LPSY bounce', color:'var(--red)', positive:true};
        }
        if (phase === 'E') {
          if (volRatioLast >= 1.5 && closePos <= 0.5) return {label:'✅ Vol supports markdown', color:'var(--red)', positive:true};
        }
        if (volRatioLast >= 2.5 && closePos > 0.6) return {label:'⚠ High vol up-close', color:'var(--amber)', positive:false};
      }
      if (volRatioLast >= 1.8) return {label:`⚡ Vol ${volRatioLast}x spike`, color:'var(--amber)', positive:null};
      return null; // nothing notable
    }
    let rs = null;
    if (niftyCandles && niftyCandles.length >= 5) {
      const sC=candles[n-1].close, sB=candles[Math.max(0,n-20)].close;
      const nC=niftyCandles[niftyCandles.length-1].close, nB=niftyCandles[Math.max(0,niftyCandles.length-20)].close;
      rs = parseFloat(((sC-sB)/sB*100-(nC-nB)/nB*100).toFixed(1));
    }
    // ── Volume spread: avg bar range in last 5 bars vs range avg ──
    const last5Spreads = candles.slice(n-5).map(c=>(c.high-c.low)/c.close*100);
    const avgSpread5 = last5Spreads.reduce((a,b)=>a+b,0)/5;
    const allSpreads = candles.slice(Math.max(0,n-30),n-1).map(c=>(c.high-c.low)/c.close*100);
    const avgSpread30 = allSpreads.reduce((a,b)=>a+b,0)/allSpreads.length;
    const spreadContraction = avgSpread30 > 0 ? avgSpread5/avgSpread30 : 1; // <0.7 = tight = absorption
    // ── Fix 1: Sector RS vs Nifty (sector index 20-bar return vs Nifty 20-bar return) ──
    let sectorRs = null;
    const sectorCandles = sectorCandlesMap && stock.sector ? sectorCandlesMap[stock.sector] : null;
    if (sectorCandles && sectorCandles.length >= 20 && niftyCandles && niftyCandles.length >= 20) {
      const sN = sectorCandles.length, nN = niftyCandles.length;
      const sRet = (sectorCandles[sN-1].close - sectorCandles[sN-20].close) / sectorCandles[sN-20].close * 100;
      const nRet = (niftyCandles[nN-1].close - niftyCandles[nN-20].close) / niftyCandles[nN-20].close * 100;
      sectorRs = parseFloat((sRet - nRet).toFixed(1));
    }
    const sectorRsBonus = (stock.sectorRs != null && Math.abs(stock.sectorRs) >= 3)
      ? (stock.sectorRs > 0 ? 3 : -0)
      : sectorRs !== null
        ? sectorRs >= 5 ? 4 : sectorRs >= 2 ? 2 : sectorRs <= -5 ? -4 : sectorRs <= -2 ? -2 : 0
        : 0;

    // ── Fix 2: Weekly sector trend → confidence bonus/penalty ──
    const sectorWeekly = weeklyIndexMap && stock.sector ? weeklyIndexMap[stock.sector] || null : null;
    const weeklyTrend = sectorWeekly ? isWeeklyUptrend(sectorWeekly) : null;
    // +8 when trend aligns with signal direction, -5 when against
    // Applied after initial scoreConfidence() call below

    // ── Fix 3: Nifty Wyckoff regime penalty ──
    // If Nifty itself is in Phase D/E distribution → penalize BUYs
    // If Nifty itself is in Phase D/E accumulation → penalize SHORTs
    const niftyPhase = niftyWyckoff || null; // 'acc-DE', 'dist-DE', or null
    // RSI(14) Wilder smoothing
    let rsi14 = null;
    if (n >= 15) {
      const period=14, cls=candles.map(c=>c.close);
      let avgG=0,avgL=0;
      for(let i=n-period;i<n;i++){const d=cls[i]-cls[i-1];if(d>0)avgG+=d;else avgL+=Math.abs(d);}
      avgG/=period;avgL/=period;
      for(let i=n-period+1;i<n;i++){const d=cls[i]-cls[i-1];avgG=(avgG*(period-1)+(d>0?d:0))/period;avgL=(avgL*(period-1)+(d<0?Math.abs(d):0))/period;}
      rsi14=avgL===0?100:parseFloat((100-100/(1+avgG/avgL)).toFixed(1));
    }
    const acc = detectAccumulation(candles);
    const dist = detectDistribution(candles);
    // Re-score with rs and rsi14 now available
    if (acc) {
      const rangeBars2 = acc.jacIdx>0 ? acc.jacIdx-acc.scIdx : acc.springIdx>0 ? acc.springIdx-acc.scIdx : acc.arIdx-acc.scIdx;

      // v1.4 Gap 3 (acc): LPS retest volume quality
      // After JAC, the pullback to Creek (LPS) should be on low volume = supply dried up
      let lpsRetestVolQuality = 0;
      if (acc.jacIdx > 0 && acc.jacIdx < candles.length - 3) {
        const postJac = candles.slice(acc.jacIdx);
        const avgPostVol = postJac.reduce((s,c)=>s+c.volume,0)/postJac.length;
        const lpsBar = postJac.find(c => c.low <= acc.arPrice*1.03 && c.low >= acc.arPrice*0.97);
        if (lpsBar) {
          lpsRetestVolQuality = lpsBar.volume < avgPostVol*0.65 ? 2 : lpsBar.volume < avgPostVol*0.85 ? 1 : 0;
        }
      }

      acc.confidence = scoreConfidence(acc.confidence, 'acc', {
        volRatioSC: (acc.scIdx>0 && candles[acc.scIdx]) ? candles[acc.scIdx].volume/acc.avgVol : 1,
        rangeBars: rangeBars2, rangeSize: acc.rangeSize, lastClose: acc.lastClose,
        rs, rsi14, volRatioLast, rr: acc.rrNum, phase: acc.phase,
        spreadContraction,
        hasSpring: acc.springIdx>0, hasJAC: acc.jacIdx>0,
        creekRetestQuality: acc.creekRetestQuality||0,
        springVolQuality: acc.springVolQuality||0,   // v1.4 Gap 1
        lpsRetestVolQuality,                          // v1.4 Gap 3
        hasUTAD: false, hasSOW: false, hasLPSY: false,
        sectorRsBonus,
      });
    }
    if (dist) {
      const rangeBarsD2 = dist.sokIdx>0 ? dist.sokIdx-dist.bcIdx : dist.utadIdx>0 ? dist.utadIdx-dist.bcIdx : dist.arIdx-dist.bcIdx;

      // v1.4 Gap 3 (dist): LPSY retest volume quality
      // After SOW, the weak rally back to Ice (LPSY) should be on low volume = demand exhausted
      let lpsyRetestVolQuality = 0;
      if (dist.sokIdx > 0 && dist.sokIdx < candles.length - 3) {
        const postSow = candles.slice(dist.sokIdx);
        const avgPostVol = postSow.reduce((s,c)=>s+c.volume,0)/postSow.length;
        const lpsyBar = postSow.find(c => c.high >= dist.icePrice*0.97 && c.high <= dist.icePrice*1.03);
        if (lpsyBar) {
          lpsyRetestVolQuality = lpsyBar.volume < avgPostVol*0.65 ? 2 : lpsyBar.volume < avgPostVol*0.85 ? 1 : 0;
        }
      }

      dist.confidence = scoreConfidence(dist.confidence, 'dist', {
        volRatioSC: (dist.bcIdx>0 && candles[dist.bcIdx]) ? candles[dist.bcIdx].volume/dist.avgVol : 1,
        rangeBars: rangeBarsD2, rangeSize: dist.rangeSize, lastClose: dist.lastClose,
        rs, rsi14, volRatioLast, rr: dist.rrNum, phase: dist.phase,
        spreadContraction,
        hasSpring: false, hasJAC: false,
        hasUTAD: dist.utadIdx>0, hasSOW: dist.sokIdx>0, hasLPSY: dist.lpsy1>0,
        stUtadVolQuality: dist.stUtadVolQuality||0,  // v1.4 Gap 2
        stUtVolQuality:   dist.stUtVolQuality||0,    // v1.4 Gap 2
        lpsRetestVolQuality: lpsyRetestVolQuality,   // v1.4 Gap 3
        sectorRsBonus,
      });
    }

    // ── Fix 2: Apply weekly sector trend — hard block counter-trend, bonus for aligned ──
    // BUY blocked entirely if sector weekly is in downtrend
    // SHORT blocked entirely if sector weekly is in uptrend
    if (acc && weeklyTrend !== null) {
      if (weeklyTrend === false) {
        // Weekly downtrend — BUY is counter-trend, block it
        acc.confidence = 0; // will fail the >= 55 check
      } else {
        acc.confidence = Math.min(95, acc.confidence + 8); // aligned bonus
      }
      acc.weeklyTrend = weeklyTrend;
    }
    if (dist && weeklyTrend !== null) {
      if (weeklyTrend === true) {
        // Weekly uptrend — SHORT is counter-trend, block it
        dist.confidence = 0; // will fail the >= 55 check
      } else {
        dist.confidence = Math.min(95, dist.confidence + 8); // aligned bonus
      }
      dist.weeklyTrend = weeklyTrend;
    }

    // ── Fix 3: Nifty Wyckoff regime penalty ──
    // Nifty in distribution Phase D/E → BUY signals penalized -10 (high risk)
    // Nifty in accumulation Phase D/E → SHORT signals penalized -10
    if (niftyPhase) {
      if (acc && niftyPhase === 'dist-DE') {
        acc.confidence = Math.max(10, acc.confidence - 10);
        acc.regimePenalty = '⚠ Nifty distributing';
      }
      if (dist && niftyPhase === 'acc-DE') {
        dist.confidence = Math.max(10, dist.confidence - 10);
        dist.regimePenalty = '⚠ Nifty accumulating';
      }
    }
    // ── v1.1: Apply Smart Signal Quality Filters ──
    // Phase A/B/C still blocked; additionally apply asymmetric floors, RSI OB block,
    // Ph D BUY guard, INDEX suppression, and market regime gate.
    let accFilterTag = null, distFilterTag = null;
    let accAdjConf = acc ? acc.confidence : 0;
    let distAdjConf = dist ? dist.confidence : 0;

    const accOkPhase  = acc  && acc.phase  !== 'A' && acc.phase  !== 'B';
    const distOkPhase = dist && dist.phase !== 'A' && dist.phase !== 'B';

    // ── Wyckoff structural fit gate ──
    // If structure doesn't meet basic criteria (prior trend + range duration),
    // tag with 'No Pattern' and exclude from scan unless single-stock mode.
    const accFit  = !acc  || acc.wyckoffFit  !== false;
    const distFit = !dist || dist.wyckoffFit !== false;

    let buyOk = false, sellOk = false;
    if (accOkPhase && accFit) {
      // Phase C: lower confidence floor (50 vs regime floor) — Spring/ST is watch-level entry
      const phCFloor = acc.phase === 'C' ? 50 : null;
      const bf = applySmartFilters('BUY', acc.phase, acc.confidence, rsi14, stock.sector, acc.weeklyTrend ?? weeklyTrend, niftyPhase, rs, phCFloor);
      if (bf.pass) { buyOk = true; accAdjConf = bf.adjConf; acc.confidence = bf.adjConf; accFilterTag = bf.tag; }
    }
    if (distOkPhase && distFit) {
      const phCFloor = dist.phase === 'C' ? 50 : null;
      const sf = applySmartFilters('SELL', dist.phase, dist.confidence, rsi14, stock.sector, dist.weeklyTrend ?? weeklyTrend, niftyPhase, rs, phCFloor);
      if (sf.pass) { sellOk = true; distAdjConf = sf.adjConf; dist.confidence = sf.adjConf; distFilterTag = sf.tag; }
    }
    if (!buyOk && !sellOk) {
      // In single-stock analysis mode: always return the Wyckoff state so the user
      // can view the chart even if the signal doesn't pass scanner filters.
      // The card will show a "FILTERED" badge explaining why it was blocked.
      if (isSingleMode && (acc || dist)) {
        const r = acc || dist;
        const isBuy = !!acc;
        const entry = isBuy
          ? (acc.phase==='E' ? Math.round(acc.lastClose*1.002) : Math.round(acc.arPrice*1.002))
          : (dist.phase==='E' ? Math.round(dist.lastClose*0.998) : Math.round(dist.icePrice*1.005));
        const stop  = Math.round(wyckoffStop(candles, entry, isBuy?"BUY":"SELL", isBuy?acc:dist));
        const rngBrs= isBuy
          ? (acc.jacIdx>0?acc.jacIdx-acc.scIdx:acc.springIdx>0?acc.springIdx-acc.scIdx:acc.arIdx>0?acc.arIdx-acc.scIdx:20)
          : (dist.sokIdx>0?dist.sokIdx-dist.bcIdx:dist.utadIdx>0?dist.utadIdx-dist.bcIdx:dist.arIdx>0?dist.arIdx-dist.bcIdx:20);
        const {outcomeWindow:ow, targetMult:tm} = causeEffect(r.phase, rngBrs);
        const atrV  = calcATR(candles)||(entry*0.02);
        const target= isBuy
          ? Math.round(acc.rangeSize>0 ? acc.arPrice+acc.rangeSize*tm : entry+atrV*4)
          : Math.round(dist.rangeSize>0 ? dist.icePrice-dist.rangeSize*tm : entry-atrV*4);
        // Build a reason string from what blocked it
        const blockedBy = [];
        if (acc  && acc.phase  && ['A','B','C'].includes(acc.phase))  blockedBy.push(`Acc Ph ${acc.phase} (early)`);
        if (dist && dist.phase && ['A','B','C'].includes(dist.phase)) blockedBy.push(`Dist Ph ${dist.phase} (early)`);
        if (acc  && acc.confidence  < 55) blockedBy.push(`Acc conf ${acc.confidence}% < floor`);
        if (dist && dist.confidence < 55) blockedBy.push(`Dist conf ${dist.confidence}% < floor`);
        const filterReason = blockedBy.length ? blockedBy.join(' · ') : 'Smart filter blocked';
        return [{
          symbol:stock.symbol, name:stock.name, sector:stock.sector, yahoo:stock.yahoo,
          type: isBuy?"BUY":"SELL",
          stage: r.stageName, phase: r.phase, stageNum: r.stageNum,
          entry, stop, target,
          rangeBars:rngBrs, outcomeWindow:ow,
          confidence: r.confidence, lastClose: r.lastClose,
          rr:'—', pctChg, volSpike, volRatioLast, rs, rsi14,
          sectorRs, weeklyTrend, regimePenalty: r.regimePenalty||null,
          filterTag: '🚫 ' + filterReason,
          filteredOut: true,   // flag — card shows FILTERED badge, not a live signal
          volSignal: volSignal(r.phase, isBuy?'acc':'dist'), cap:stock.cap,
          accResult: acc, distResult: dist, candles,
        }];
      }
      return null;
    }

    // ── Conflict resolution: if same stock qualifies for both BUY and SELL, pick one ──
    let showBuy = buyOk, showSell = sellOk;
    if (buyOk && sellOk) {
      // Phase priority: D > C > E (D is active zone, most actionable)
      const phaseRank = p => p==='D'?3:p==='C'?2:p==='E'?1:0;
      const buyRank  = phaseRank(acc.phase);
      const sellRank = phaseRank(dist.phase);
      if (buyRank !== sellRank) {
        // Higher phase rank wins
        showBuy  = buyRank >= sellRank;
        showSell = sellRank > buyRank;
      } else {
        // Same phase — use RS to decide: positive RS favours BUY, negative favours SELL
        if (rs !== null && Math.abs(rs) >= 3) {
          showBuy  = rs > 0;
          showSell = rs < 0;
        } else {
          // Fallback: higher confidence wins
          showBuy  = acc.confidence >= dist.confidence;
          showSell = dist.confidence > acc.confidence;
        }
      }
    }

    const results = [];
    if (showBuy) {
      const r = acc;
      const buyEntry = r.phase==='E'
          ? Math.round(r.lastClose * 1.002)
          : Math.round(r.arPrice * 1.002);
      const buyStop = Math.round(wyckoffStop(candles, buyEntry, "BUY", acc));
      const atrVal = calcATR(candles) || (buyEntry * 0.02);
      // v1.5: cause-scaled target — range duration drives target multiplier
      const accRangeBars = r.jacIdx>0 ? r.jacIdx-r.scIdx : r.springIdx>0 ? r.springIdx-r.scIdx : r.arIdx>0 ? r.arIdx-r.scIdx : 20;
      const { outcomeWindow: accWindow, targetMult: accMult } = causeEffect(r.phase, accRangeBars);
      const causedTarget = r.rangeSize > 0 ? r.arPrice + r.rangeSize * accMult : 0;
      const atrTarget = buyEntry + atrVal * Math.min(Math.max(r.rangeSize / atrVal, 2), 6);
      const buyTarget = r.phase==='E'
        ? Math.round(atrTarget)
        : Math.round(causedTarget > buyEntry ? causedTarget : buyEntry + atrVal * 4);
      const rrRaw = buyTarget > buyEntry && buyEntry > buyStop
        ? ((buyTarget - buyEntry) / (buyEntry - buyStop)).toFixed(1)
        : '—';
      const rr = parseFloat(rrRaw) >= 1.0 ? rrRaw : '—';
      // Hard block: R:R < 1.0 is mathematically a losing trade — never surface it
      if (rr === '—' || parseFloat(rr) < 1.0) { /* skip */ } else {
      const vsBuy = volSignal(acc.phase, 'acc');
      results.push({symbol:stock.symbol,name:stock.name,sector:stock.sector,yahoo:stock.yahoo,
        type:"BUY",stage:acc.stageName,phase:acc.phase,stageNum:acc.stageNum,stageKey:acc.stageKey,
        wyckoffFit:acc.wyckoffFit,
        entry:buyEntry,stop:buyStop,target:buyTarget,
        rangeBars:accRangeBars, outcomeWindow:accWindow,
        confidence:r.confidence,lastClose:r.lastClose,rr,pctChg,volSpike,volRatioLast,rs,rsi14,
        sectorRs, weeklyTrend: acc.weeklyTrend??weeklyTrend,
        regimePenalty: acc.regimePenalty||null,
        filterTag: accFilterTag,
        volSignal:vsBuy,cap:stock.cap,
        accResult:acc,distResult:null,candles});
      } // end R:R >= 1.0 guard
    }
    if (showSell) {
      const r = dist;
      const sellEntry = r.phase==='E'
          ? Math.round(r.lastClose * 0.998)
          : Math.round(r.icePrice * 1.005);
      const sellStop = Math.round(wyckoffStop(candles, sellEntry, "SELL", dist));
      const atrValS = calcATR(candles) || (sellEntry * 0.02);
      // v1.5: cause-scaled target for distribution
      const distRangeBars = r.sokIdx>0 ? r.sokIdx-r.bcIdx : r.utadIdx>0 ? r.utadIdx-r.bcIdx : r.arIdx>0 ? r.arIdx-r.bcIdx : 20;
      const { outcomeWindow: distWindow, targetMult: distMult } = causeEffect(r.phase, distRangeBars);
      const causedTargetS = r.rangeSize > 0 ? r.icePrice - r.rangeSize * distMult : 0;
      const atrTargetS = sellEntry - atrValS * Math.min(Math.max(r.rangeSize / atrValS, 2), 6);
      const sellTarget = r.phase==='E'
        ? Math.round(atrTargetS)
        : Math.round(causedTargetS < sellEntry ? causedTargetS : sellEntry - atrValS * 4);
      const rrRawS = sellEntry > sellTarget && sellStop > sellEntry
        ? ((sellEntry - sellTarget) / (sellStop - sellEntry)).toFixed(1)
        : '—';
      const rr = parseFloat(rrRawS) >= 1.0 ? rrRawS : '—';
      // Hard block: R:R < 1.0 is mathematically a losing trade — never surface it
      if (rr === '—' || parseFloat(rr) < 1.0) { /* skip */ } else {
      const vsSell = volSignal(dist.phase, 'dist');
      results.push({symbol:stock.symbol,name:stock.name,sector:stock.sector,yahoo:stock.yahoo,
        type:"SELL",stage:dist.stageName,phase:dist.phase,stageNum:dist.stageNum,stageKey:dist.stageKey,
        wyckoffFit:dist.wyckoffFit,
        entry:sellEntry,stop:sellStop,target:sellTarget,
        rangeBars:distRangeBars, outcomeWindow:distWindow,
        confidence:r.confidence,lastClose:r.lastClose,rr,pctChg,volSpike,volRatioLast,rs,rsi14,
        sectorRs, weeklyTrend: dist.weeklyTrend??weeklyTrend,
        regimePenalty: dist.regimePenalty||null,
        filterTag: distFilterTag,
        volSignal:vsSell,cap:stock.cap,
        accResult:acc,distResult:dist,candles});
      } // end R:R >= 1.0 guard
    }
    return results.length ? results : null;
  } catch(e) { return null; }
}

/* ── CHART DRAW ── */
function drawChart(canvas, data, result, range, mode, zs) {
  if (!canvas||!data||!data.length) return;
  const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.scale(dpr,dpr);
  const z = zs?.zoom||1, offFrac = zs?.offsetFrac||0;
  const total = Math.min(data.length, range);
  const vis = Math.max(20, Math.round(total/z));
  const maxOff = total - vis;
  const startOff = Math.round(offFrac * maxOff);
  const candles = data.slice(data.length-total+startOff, data.length-total+startOff+vis);
  const nC = candles.length; if (!nC) return;
  const offset = data.length - total + startOff;
  const ml=62,mr=6,mt=10,mb=34;
  const cW=W-ml-mr, cH=(H-mt-mb)*.72, vH=(H-mt-mb)*.2, vTop=mt+cH+10;
  const pMax=Math.max(...candles.map(c=>c.high))*1.012;
  const pMin=Math.min(...candles.map(c=>c.low))*.988;
  const pRng=pMax-pMin;
  const maxVol=Math.max(...candles.map(c=>c.volume));
  const py=p=>mt+cH-((p-pMin)/pRng)*cH;
  const cx=i=>ml+(i+.5)*(cW/nC);
  const cw=Math.max(1.5,(cW/nC)*.72);
  // background
  ctx.fillStyle='#f7faf8'; ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='rgba(180,210,190,.6)'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const p=pMin+(pRng/5)*i,y=py(p);
    ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(W-mr,y);ctx.stroke();
    ctx.fillStyle='#6b8a72';ctx.font='9px IBM Plex Mono';ctx.textAlign='right';
    ctx.fillText(Math.round(p).toLocaleString('en-IN'),ml-3,y+3);
  }
  // key level lines
  const drawLv=(p,col,lbl)=>{
    if(!p||p<pMin||p>pMax) return;
    const y=py(p);
    ctx.save();ctx.strokeStyle=col;ctx.setLineDash([5,4]);ctx.lineWidth=1.2;ctx.globalAlpha=.75;
    ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(W-mr,y);ctx.stroke();
    ctx.globalAlpha=1;ctx.setLineDash([]);ctx.fillStyle=col;
    ctx.font='bold 8px IBM Plex Mono';ctx.textAlign='left';ctx.fillText(lbl,ml+3,y-3);ctx.restore();
  };
  if(mode==="acc"&&result){
    drawLv(result.scPrice,'#c0202e','SC');
    drawLv(result.arPrice,'#b06010','Creek');
    drawLv(result.springLow,'#1a7a42','Spring');
    drawLv(result.target1,'#1a50a0','T1');
  }
  if(mode==="dist"&&result){
    drawLv(result.bcTopPrice,'#c0202e','BC');
    drawLv(result.icePrice,'#1a50a0','Ice');
    drawLv(result.target1,'#8b0018','T1');
  }
  // volume
  for(let i=0;i<nC;i++){
    const c=candles[i],x=cx(i),vh=(c.volume/maxVol)*vH;
    ctx.fillStyle=c.close>=c.open?'rgba(26,122,66,.15)':'rgba(192,32,46,.15)';
    ctx.fillRect(x-cw/2,vTop+vH-vh,cw,vh);
  }
  // candles
  for(let i=0;i<nC;i++){
    const c=candles[i],x=cx(i),bull=c.close>=c.open;
    const col=bull?'#1a7a42':'#c0202e';
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,py(c.high));ctx.lineTo(x,py(c.low));ctx.stroke();
    const bT=py(Math.max(c.open,c.close)),bB=py(Math.min(c.open,c.close)),bH=Math.max(bB-bT,1.5);
    ctx.fillStyle=col;ctx.globalAlpha=.88;ctx.fillRect(x-cw/2,bT,cw,bH);ctx.globalAlpha=1;
  }
  // ── Phase band shading with labels ──
  if(result?.stageHistory && result.stageHistory.length >= 1) {
    const sh = result.stageHistory;
    const isAcc = mode === 'acc';
    const lmap = {};
    sh.forEach(s => { lmap[s.label] = s.idx; });
    const last = data.length - 1;

    const phases = isAcc ? [
      { label:'Ph.A', from:lmap['SC']||sh[0].idx,                   to:lmap['AR']||sh[1]?.idx||0,    color:'rgba(192,32,46,.06)',  txt:'#c0202e' },
      { label:'Ph.B', from:lmap['AR']||0,                            to:lmap['Sp']||0,                 color:'rgba(176,96,16,.06)', txt:'#b06010' },
      { label:'Ph.C', from:lmap['Sp']||0,                            to:lmap['JAC']||0,                color:'rgba(26,122,66,.08)', txt:'#1a7a42' },
      { label:'Ph.D', from:lmap['JAC']||0,                           to:lmap['JAC']?last-10:0,         color:'rgba(26,80,160,.08)', txt:'#1a50a0' },
      { label:'Ph.E', from:lmap['JAC']?last-10:0,                    to:last,                          color:'rgba(80,30,140,.06)', txt:'#50209e' },
    ] : [
      { label:'Ph.A', from:lmap['BC']||sh[0].idx,                    to:lmap['AR']||sh[1]?.idx||0,    color:'rgba(192,32,46,.06)',  txt:'#c0202e' },
      { label:'Ph.B', from:lmap['AR']||0,                             to:lmap['UT']||lmap['UTAD']||0,  color:'rgba(176,96,16,.06)', txt:'#b06010' },
      { label:'Ph.C', from:lmap['UT']||lmap['UTAD']||0,               to:lmap['UTAD']||lmap['SOW']||0, color:'rgba(192,32,46,.08)', txt:'#c04050' },
      { label:'Ph.D', from:lmap['UTAD']||lmap['SOW']||0,              to:lmap['SOW']||lmap['LPSY']||0, color:'rgba(139,0,24,.08)',  txt:'#8b0018' },
      { label:'Ph.E', from:lmap['SOW']||lmap['LPSY']||sh[sh.length-1].idx, to:last,                   color:'rgba(96,48,160,.06)', txt:'#6030a0' },
    ];

    phases.forEach(ph => {
      if (!ph.from || !ph.to || ph.from >= ph.to) return;
      const x1 = cx(ph.from - offset), x2 = cx(ph.to - offset);
      if (x2 < ml || x1 > W - mr) return;
      const rx1 = Math.max(ml, x1), rx2 = Math.min(W - mr, x2);
      // shaded band
      ctx.fillStyle = ph.color;
      ctx.fillRect(rx1, mt, rx2 - rx1, cH);
      // vertical boundary
      ctx.save();
      ctx.strokeStyle = ph.txt; ctx.setLineDash([3,4]);
      ctx.lineWidth = 0.8; ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.moveTo(rx1, mt); ctx.lineTo(rx1, mt + cH); ctx.stroke();
      ctx.restore();
      // phase label — only if band is wide enough
      if (rx2 - rx1 > 22) {
        const midX = Math.min(Math.max(rx1 + 2, (rx1 + rx2) / 2), rx2 - 2);
        ctx.font = 'bold 8px IBM Plex Mono'; ctx.textAlign = 'center';
        ctx.fillStyle = ph.txt; ctx.globalAlpha = 0.75;
        ctx.fillText(ph.label, midX, mt + 10);
        ctx.globalAlpha = 1;
      }
    });
  }

  // ── Stage event markers (pill labels + dots) ──
  if(result?.stageHistory){
    result.stageHistory.forEach(({idx,label,color})=>{
      const ai = idx - offset; if(ai < 0 || ai >= nC) return;
      const c = candles[ai], x = cx(ai);
      const above = ['AR','JAC','BC','UT','UTAD'].includes(label);
      const yBase = above ? py(c.high) - 6 : py(c.low) + 6;
      // outer dot
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, yBase, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
      // pill background
      ctx.font = 'bold 8px IBM Plex Mono'; ctx.textAlign = 'center';
      const tw = ctx.measureText(label).width + 8;
      const ty = above ? yBase - 14 : yBase + 14;
      ctx.fillStyle = color;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x - tw/2, ty - 8, tw, 11, 3);
      else ctx.rect(x - tw/2, ty - 8, tw, 11);
      ctx.fill();
      // label text
      ctx.fillStyle = '#fff';
      ctx.fillText(label, x, ty);
    });
  }
  // x-axis dates
  ctx.fillStyle='#6b8a72';ctx.font='8px IBM Plex Mono';ctx.textAlign='center';
  const step=Math.ceil(nC/6);
  for(let i=0;i<nC;i+=step){
    const d=candles[i].date;
    ctx.fillText(d?new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'',cx(i),H-5);
  }
  ctx.textAlign='left';
}

/* ── PHASE BAR ── */
function PhaseBar({phase, mode}) {
  const phases=['A','B','C','D','E'];
  const cur=phases.indexOf(phase);
  const cm=mode==="acc"?{A:'ph-a',B:'ph-b',C:'ph-c',D:'ph-d',E:'ph-e'}:{A:'ph-ra',B:'ph-rb',C:'ph-rc',D:'ph-rd',E:'ph-re'};
  const al={A:'SC·AR',B:'Tests',C:'Spring',D:'JAC·LPS',E:'Markup'};
  const dl={A:'PSY·BC',B:'UT·Tests',C:'UTAD',D:'SOW·LPSY',E:'Mkdn'};
  const lbl=mode==="acc"?al:dl;
  return (
    <div>
      <div className="ph-track">
        {phases.map((p,i)=>{let c='ph-seg';if(i<cur)c+=' '+cm[p];else if(i===cur)c+=' '+cm[p]+' ph-blink';return <div key={p} className={c}/>;})}</div>
      <div className="ph-lbls">
        {phases.map(p=><div key={p} className={'ph-lbl'+(phase===p?' cur':'')}>{lbl[p]}</div>)}
      </div>
    </div>
  );
}

/* ── WYCKOFF STAGE CHECKLIST ── */
function StageChecklist({result, candles}) {
  if (!result) return null;
  const isAcc = result.mode === "acc";

  // Helper: format date as DD-MMM-YY
  const fmtDate = (idx) => {
    if (!candles || idx == null || idx < 0 || idx >= candles.length) return null;
    const d = new Date(candles[idx].date);
    if (isNaN(d)) return null;
    return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'2-digit'});
  };
  // Helper: format price (high/low/close) as ₹N,NNN
  const fmtPrice = (idx, field='close') => {
    if (!candles || idx == null || idx < 0 || idx >= candles.length) return null;
    const v = candles[idx][field];
    if (!v) return null;
    return '₹' + Math.round(v).toLocaleString('en-IN');
  };

  // Map each stage to its candle index + which price to show
  const stageInfo = isAcc ? {
    0: { idx: result.scIdx,     field: 'low'   },  // SC — low of selling climax
    1: { idx: result.arIdx,     field: 'high'  },  // AR — high of automatic rally
    2: { idx: null },                               // ST — no single index
    3: { idx: null },                               // Creek
    4: { idx: result.springIdx, field: 'low'   },  // Spring — low of spring bar
    5: { idx: null },                               // STS
    6: { idx: result.jacIdx,    field: 'close' },  // JAC — close of breakout bar
    7: { idx: null },                               // SOS
    8: { idx: result.jacIdx,    field: 'close' },  // LPS — uses jacIdx as reference
    9: { idx: null },                               // Markup
  } : {
    0: { idx: result.bcIdx,     field: 'high'  },  // PSY — high
    1: { idx: result.bcIdx,     field: 'high'  },  // BC — high of buying climax
    2: { idx: result.arIdx,     field: 'low'   },  // AR — low of automatic reaction
    3: { idx: null },                               // ST
    4: { idx: result.utIdx,     field: 'high'  },  // UT — high of upthrust
    5: { idx: result.utadIdx,   field: 'high'  },  // UTAD — high
    6: { idx: result.sokIdx,    field: 'close' },  // SOW — close
    7: { idx: result.sokIdx,    field: 'close' },  // Ice broken
    8: { idx: result.lpsy1,     field: 'close' },  // LPSY
    9: { idx: null },                               // Markdown
  };

  const stages = isAcc ? [
    {label:"SC — Selling Climax",         done:result.scIdx>0,     active:result.stageNum===2},
    {label:"AR — Automatic Rally",        done:result.arIdx>0,     active:result.stageNum===3},
    {label:"ST — Secondary Tests",        done:result.stageNum>=5, active:result.stageNum===5},
    {label:"Creek defined (Phase B end)", done:result.stageNum>=6, active:result.stageNum===6},
    {label:"Spring (Bear trap)",          done:result.springIdx>0, active:result.stageNum===7},
    {label:"STS — Spring Test",           done:result.stageNum>=8, active:result.stageNum===8},
    {label:"JAC — Jump Across Creek",     done:result.jacIdx>0,    active:result.stageNum===9},
    {label:"SOS / Back-Up",              done:result.stageNum>=10,active:result.stageNum===10},
    {label:"LPS — Last Point of Support", done:result.isLPS,       active:result.isLPS},
    {label: result.stageName==="Markup Stalling — Possible Top"
              ? "⚠ Markup Stalling — Possible Top"
              : "Markup / Breakout",
     done:result.stageNum>=14, active:result.stageNum===14,
     warn: result.stageName==="Markup Stalling — Possible Top"},
  ] : [
    {label:"PSY — Preliminary Supply",   done:result.bcIdx>0,     active:result.stageNum===1},
    {label:"BC — Buying Climax",         done:result.bcIdx>0,     active:result.stageNum===2},
    {label:"AR — Automatic Reaction",    done:result.arIdx>0,     active:result.stageNum===4},
    {label:"ST — Secondary Tests",       done:result.stageNum>=5, active:result.stageNum===5},
    {label:"UT — Upthrust",              done:result.utIdx>0,     active:false},
    {label:"UTAD — Upthrust After Dist.",done:result.utadIdx>0,   active:result.stageNum===9},
    {label:"SOW — Sign of Weakness",     done:result.sokIdx>0,    active:result.stageNum===12},
    {label:"Ice broken (SOW below Ice)", done:result.stageNum>=13,active:result.stageNum===13},
    {label:"LPSY — Last Pt Supply",      done:result.isLPSY,      active:result.isLPSY},
    {label:"Markdown / Downtrend",       done:result.stageNum>=15,active:result.stageNum===15},
  ];
  return (
    <div>
      {stages.map((s,i)=>{
        const dotCls = s.warn ? 'stage-dot sd-warn' : s.active ? 'stage-dot sd-active' : s.done ? 'stage-dot sd-done' : 'stage-dot sd-wait';
        const tagCls = s.warn ? 'stage-row-tag tag-warn' : s.active ? 'stage-row-tag tag-active' : s.done ? 'stage-row-tag tag-done' : 'stage-row-tag tag-wait';
        const tagTxt = s.warn ? 'CAUTION' : s.active ? 'ACTIVE' : s.done ? 'DONE' : 'PENDING';
        const info   = stageInfo[i];
        const date   = info?.idx != null ? fmtDate(info.idx)  : null;
        const price  = info?.idx != null ? fmtPrice(info.idx, info.field) : null;
        return (
          <div key={i} className="stage-row">
            <div className={dotCls}/>
            <div className="stage-row-label">{s.label}</div>
            {(date||price) && (s.done||s.active) ? (
              <div style={{display:'flex',gap:'6px',alignItems:'center',flexShrink:0}}>
                {date  && <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--muted)'}}>{date}</span>}
                {price && <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',fontWeight:700,color:'var(--text2)'}}>{price}</span>}
              </div>
            ) : null}
            <div className={tagCls}>{tagTxt}</div>
          </div>
        );
      })}
    </div>
  );
}

/* ── ENTRY CARD ── */
function EntryCard({e, cmp}) {
  const isAcc = e.mode === "acc";
  const tagCls = e.status==="ACTIVE" ? (isAcc?"tag-ab":"tag-as") : e.status==="WAIT" ? "tag-wt" : "tag-w";
  const entryPrice = isAcc ? parseFloat(String(e.entry).replace(/,/g,'')) : parseFloat(String(e.short).replace(/,/g,''));
  const cmvDist = (cmp && entryPrice) ? ((entryPrice - cmp) / cmp * 100) : null;
  const distLabel = cmvDist !== null
    ? (Math.abs(cmvDist) < 0.5 ? '● at entry' : (cmvDist > 0 ? `+${cmvDist.toFixed(1)}% to entry` : `${cmvDist.toFixed(1)}% past entry`))
    : null;
  const distColor = cmvDist === null ? 'var(--muted)'
    : Math.abs(cmvDist) < 0.5 ? 'var(--green)'
    : cmvDist > 0 ? 'var(--muted)'
    : 'var(--amber)';
  return (
    <div className="entry-card">
      <div className="ec-head">
        <span className="ec-type" style={{color:isAcc?'var(--green)':'var(--red)'}}>{isAcc?'▲':'▼'} {e.type}</span>
        <div className="ec-meta">
          {distLabel && <span style={{fontFamily:'IBM Plex Mono',fontSize:'10px',color:distColor}}>{distLabel}</span>}
          {e.rr!=="—" && <span className="ec-rr">R:R {e.rr}</span>}
          <span className={'ec-tag '+tagCls}>{e.status}</span>
        </div>
      </div>
      {e.stop!=="—" && (
        <div className="ec-levels">
          <div className="ec-lv"><div className="ec-lv-l">{isAcc?'ENTRY':'SHORT'}</div><div className="ec-lv-v" style={{color:isAcc?'var(--green)':'var(--red)'}}>₹{isAcc?e.entry:e.short}</div></div>
          <div className="ec-lv"><div className="ec-lv-l">STOP</div><div className="ec-lv-v" style={{color:isAcc?'var(--red)':'var(--green)'}}>₹{e.stop}</div></div>
          <div className="ec-lv"><div className="ec-lv-l">TARGET</div><div className="ec-lv-v" style={{color:'var(--blue)'}}>₹{isAcc?e.target:e.cover}</div></div>
        </div>
      )}
      <div className="ec-desc">{e.desc}</div>
    </div>
  );
}

/* ── DETAIL SHEET ── */
function DetailSheet({opp, tf, onClose}) {
  const canvasRef = useRef(null);
  const zoomRef = useRef({zoom:1, offsetFrac:0});
  const touchRef = useRef({});
  const [zoomState, setZoomState] = useState({zoom:1, offsetFrac:0});
  const [detailLoading, setDetailLoading] = useState(false);
  const [fullCandles, setFullCandles] = useState(opp.candles||null);
  const [accResult, setAccResult] = useState(opp.accResult||null);
  const [distResult, setDistResult] = useState(opp.distResult||null);

  // Chart range options keyed by timeframe — shows correct labels for each TF
  const rangeOptions = {
    '1d':  [{v:60, l:'3M'},{v:120, l:'6M'}, {v:252, l:'1Y'}],
    '1wk': [{v:26, l:'6M'},{v:52,  l:'1Y'}, {v:104, l:'2Y'}],
  };
  const opts = rangeOptions[tf.id] || rangeOptions['1d'];
  const [range, setRange] = useState(opts[1].v);

  const result = opp.type==="BUY" ? accResult : distResult;
  const mode = opp.type==="BUY" ? "acc" : "dist";
  const isAcc = mode === "acc";
  // Stale check: >2% away from entry (matches zone filter and replay logic)
  const priceDeviation = opp.entry > 0 ? Math.abs((opp.lastClose - opp.entry) / opp.entry * 100) : 0;
  const isStale = priceDeviation > 2;
  const staleDir = opp.lastClose < opp.entry ? 'below' : 'above';

  // Fetch using the SAME interval as the scan — so chart matches selected TF
  useEffect(()=>{
    if(!fullCandles||fullCandles.length<30){
      setDetailLoading(true);
      // Fetch with a generous period to have enough bars for the chart range
      const longPeriod = {'1d':'2y','1wk':'5y'}[tf.id]||tf.period;
      fetchOHLCV(opp.yahoo, longPeriod, tf.interval).then(data=>{
        setFullCandles(data);
        setAccResult(detectAccumulation(data));
        setDistResult(detectDistribution(data));
        setDetailLoading(false);
      }).catch(()=>setDetailLoading(false));
    }
  },[]);

  useEffect(()=>{
    if(fullCandles&&canvasRef.current) drawChart(canvasRef.current,fullCandles,result,range,mode,zoomState);
  },[fullCandles,result,range,mode,zoomState]);

  useEffect(()=>{
    const h=()=>{ if(fullCandles&&canvasRef.current) drawChart(canvasRef.current,fullCandles,result,range,mode,zoomRef.current); };
    window.addEventListener('resize',h); return ()=>window.removeEventListener('resize',h);
  },[fullCandles,result,range,mode]);

  useEffect(()=>{ const z={zoom:1,offsetFrac:0}; zoomRef.current=z; setZoomState(z); },[range]);

  const chg = opp.pctChg;
  const chgPos = chg >= 0;
  const confColor = c => c>70?(isAcc?'var(--green)':'var(--red)'):c>50?'var(--amber)':'var(--muted)';

  const handleTouchStart = e => {
    const t = e.touches;
    if(t.length===1){ touchRef.current={panning:true,lastX:t[0].clientX}; }
    else if(t.length===2){
      const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
      touchRef.current={pinching:true,lastDist:Math.sqrt(dx*dx+dy*dy)};
    }
  };
  const handleTouchMove = e => {
    e.preventDefault();
    const t = e.touches, cur = zoomRef.current;
    if(t.length===1&&touchRef.current.panning){
      const dx=t[0].clientX-touchRef.current.lastX;
      touchRef.current.lastX=t[0].clientX;
      const cW=canvasRef.current?.offsetWidth||320;
      const total=Math.min((fullCandles||[]).length,range);
      const vis=Math.max(20,Math.round(total/cur.zoom));
      const maxOff=total-vis; if(maxOff<=0) return;
      const newOff=Math.max(0,Math.min(1,cur.offsetFrac-dx/(cW/vis)/maxOff));
      const z={...cur,offsetFrac:newOff}; zoomRef.current=z; setZoomState(z);
    } else if(t.length===2&&touchRef.current.pinching){
      const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;
      const dist=Math.sqrt(dx*dx+dy*dy), scale=dist/touchRef.current.lastDist;
      touchRef.current.lastDist=dist;
      const newZoom=Math.max(1,Math.min(10,cur.zoom*scale));
      const total=Math.min((fullCandles||[]).length,range);
      const oldVis=Math.max(20,Math.round(total/cur.zoom)), newVis=Math.max(20,Math.round(total/newZoom));
      const maxOld=Math.max(1,total-oldVis), maxNew=Math.max(1,total-newVis);
      const newOff=maxNew>0?Math.max(0,Math.min(1,(cur.offsetFrac*maxOld)/maxNew)):0;
      const z={zoom:newZoom,offsetFrac:newOff}; zoomRef.current=z; setZoomState(z);
    }
  };
  const handleTouchEnd = () => { touchRef.current={}; };

  return (
    <>
      <div className="sheet-overlay" onClick={onClose}/>
      <div className="sheet">
        {/* Sheet header */}
        <div className="sheet-hdr">
          <button className="back-btn" onClick={onClose}>← Back</button>
          <div style={{flex:1}}>
            <div className="sheet-sym">{opp.symbol}</div>
            <div className="sheet-nm">{opp.name} · {opp.sector} · {tf.label}</div>
          </div>
          <div className={'sheet-type '+(isAcc?'buy':'sell')}>{isAcc?'▲ LPS BUY':'▼ LPSY SELL'}</div>
        </div>

        <div className="sheet-body">
          {/* Price hero */}
          <div className="price-hero">
            <div className="ph-top">
              <div className="ph-price">₹{Math.round(opp.lastClose).toLocaleString('en-IN')}</div>
              <div className="ph-right">
                <div className={'ph-chg '+(chgPos?'pos':'neg')}>{chgPos?'+':''}{chg.toFixed(2)}%</div>
                <div className="ph-period">vs prev {tf.id==='1wk'?'week':'day'}</div>
              </div>
            </div>
            <div className="ph-stats">
              <div className="ph-stat">
                <div className="ph-stat-l">ENTRY</div>
                <div className="ph-stat-v" style={{color:'var(--green)'}}>₹{opp.entry.toLocaleString('en-IN')}</div>
              </div>
              <div className="ph-stat">
                <div className="ph-stat-l">STOP</div>
                <div className="ph-stat-v" style={{color:'var(--red)'}}>₹{opp.stop.toLocaleString('en-IN')}</div>
              </div>
              <div className="ph-stat">
                <div className="ph-stat-l">TARGET</div>
                <div className="ph-stat-v" style={{color:'var(--blue)'}}>₹{opp.target.toLocaleString('en-IN')}</div>
              </div>
              <div className="ph-stat">
                <div className="ph-stat-l">R:R</div>
                <div className="ph-stat-v" style={{color:'var(--amber)'}}>1:{opp.rr}</div>
              </div>
              <div className="ph-stat">
                <div className="ph-stat-l">CONFIDENCE</div>
                <div className="ph-stat-v" style={{color:confColor(opp.confidence)}}>{opp.confidence}%</div>
              </div>
              <div className="ph-stat">
                <div className="ph-stat-l">STAGE</div>
                <div className="ph-stat-v" style={{fontSize:'11px',color:'var(--text2)'}}>{result?`Ph.${result.phase}-${result.stageNum}`:'—'}</div>
              </div>
            </div>
          </div>

          {/* Phase + Stage */}
          {detailLoading && <div className="load-wrap"><div className="bspin g"/><div className="load-txt">Loading full data…</div></div>}
          {isStale && !detailLoading && (
            <div style={{background:'var(--amber-bg)',border:'1px solid var(--amber-bd)',borderRadius:'8px',padding:'9px 12px',marginBottom:'10px',fontFamily:'IBM Plex Mono',fontSize:'11px',color:'var(--amber)',lineHeight:1.5}}>
              ⚠ Price moved since scan. Current ₹{opp.lastClose.toLocaleString('en-IN')} is {priceDeviation.toFixed(1)}% {staleDir} entry ₹{opp.entry.toLocaleString('en-IN')} — re-analyse to refresh.
            </div>
          )}
          {result && !detailLoading && (
            <div className="phase-wrap">
              <div className="section-title">Wyckoff Phase Progress</div>
              <PhaseBar phase={result.phase} mode={mode}/>
              <div className={'stage-pill '+result.phClass}>Phase {result.phase} · Stage {result.stageNum}</div>
              <div className="stage-name">{result.stageName}</div>
              <div className="conf-row">
                <div className="conf-bar"><div className="conf-fill" style={{width:result.confidence+'%',background:confColor(result.confidence)}}/></div>
                <div className="conf-pct" style={{color:confColor(result.confidence)}}>{result.confidence}%</div>
              </div>
              {isAcc&&result.isLPS&&<div className="active-banner ab-buy">★ LPS ZONE ACTIVE — Pullback entry after JAC</div>}
              {!isAcc&&result.isLPSY&&<div className="active-banner ab-sell">★ LPSY ZONE ACTIVE — Short at Ice resistance</div>}
            </div>
          )}

          {/* Chart */}
          {fullCandles && !detailLoading && (
            <div className="chart-card">
              <div className="chart-hdr">
                <div className="section-title" style={{margin:0}}>{opp.symbol} · {tf.label} · Pinch to zoom</div>
                <div style={{display:'flex',gap:'6px',alignItems:'center'}}>
                  {zoomState.zoom>1.05&&<button className="zoom-reset-btn" onClick={()=>{const z={zoom:1,offsetFrac:0};zoomRef.current=z;setZoomState(z);}}>Reset</button>}
                  <div className="rng-row">
                    {opts.map(({v,l})=>(
                      <button key={v} className={'r-btn'+(range===v?(isAcc?' ra':' rd'):'')} onClick={()=>setRange(v)}>{l}</button>
                    ))}
                  </div>
                </div>
              </div>
              <div className="chart-zoom-wrap"
                onTouchStart={handleTouchStart}
                onTouchMove={handleTouchMove}
                onTouchEnd={handleTouchEnd}>
                <canvas ref={canvasRef} className="cc" style={{height:'270px'}}/>
                <div className="chart-zoom-hint">{zoomState.zoom<=1.05?'Pinch·Pan':zoomState.zoom.toFixed(1)+'×'}</div>
              </div>
            </div>
          )}

          {/* Wyckoff Stage Checklist */}
          {result && !detailLoading && (
            <div className="stages-card">
              <div className="section-title">Wyckoff Stage Checklist</div>
              <StageChecklist result={result} candles={fullCandles}/>
            </div>
          )}

          {/* ── Wyckoff Detection Diagnostics ── */}
          {result && !detailLoading && fullCandles && (()=>{
            const c = fullCandles;
            const isA = result.mode === 'acc';
            const fmt = (idx, field='close') => {
              if (idx == null || idx < 0 || idx >= c.length) return null;
              const d = new Date(c[idx].date);
              const dateStr = isNaN(d) ? '?' : d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'});
              const price = c[idx][field];
              return { date: dateStr, price: price ? '₹'+Math.round(price).toLocaleString('en-IN') : '—', bar: idx };
            };

            // Prior trend calculation for structural gate
            const pivotIdx = isA ? result.scIdx : result.bcIdx;
            const pivotPrice = isA ? result.scPrice : result.bcTopPrice;
            const isWeekly = c.length >= 2 && Math.abs(new Date(c[c.length-1].date) - new Date(c[c.length-2].date)) / 86400000 >= 5;
            const lookback = isWeekly ? 60 : 90;
            const gateMinDrop = isWeekly ? '30%' : '20%';
            const minRangeBars = isWeekly ? 15 : 20;

            let priorExtreme = null, priorExtremePct = null;
            if (pivotIdx > 0) {
              const lb = Math.max(0, pivotIdx - lookback);
              if (isA) {
                priorExtreme = Math.max(...c.slice(lb, pivotIdx).map(x=>x.high));
                priorExtremePct = priorExtreme > 0 ? ((priorExtreme - pivotPrice) / priorExtreme * 100).toFixed(1) : null;
              } else {
                priorExtreme = Math.min(...c.slice(lb, pivotIdx).map(x=>x.low));
                priorExtremePct = priorExtreme > 0 ? ((pivotPrice - priorExtreme) / priorExtreme * 100).toFixed(1) : null;
              }
            }
            const rangeBars = pivotIdx >= 0 ? c.length - 1 - pivotIdx : null;

            // Events to display
            const events = isA ? [
              { label:'SC — Selling Climax',     ...fmt(result.scIdx,     'low'),   key:'scIdx'    },
              { label:'AR — Automatic Rally',    ...fmt(result.arIdx,     'high'),  key:'arIdx'    },
              { label:'Spring',                  ...fmt(result.springIdx, 'low'),   key:'springIdx'},
              { label:'JAC — Jump Across Creek', ...fmt(result.jacIdx,    'close'), key:'jacIdx'   },
            ] : [
              { label:'BC — Buying Climax',      ...fmt(result.bcIdx,     'high'),  key:'bcIdx'    },
              { label:'AR — Auto Reaction',      ...fmt(result.arIdx,     'low'),   key:'arIdx'    },
              { label:'UT — Upthrust',           ...fmt(result.utIdx,     'high'),  key:'utIdx'    },
              { label:'UTAD',                    ...fmt(result.utadIdx,   'high'),  key:'utadIdx'  },
              { label:'SOW — Sign of Weakness',  ...fmt(result.sokIdx,    'close'), key:'sokIdx'   },
              { label:'LPSY',                    ...fmt(result.lpsy1,     'close'), key:'lpsy1'    },
            ];

            const dot = (ok) => ok
              ? <span style={{color:'var(--green)',fontWeight:700}}>✓</span>
              : <span style={{color:'var(--red)',fontWeight:700}}>✗</span>;

            return (
              <div style={{
                background:'var(--card)',border:'1px solid var(--border)',borderRadius:'12px',
                padding:'14px',boxShadow:'var(--shadow)',marginTop:'10px'
              }}>
                <div className="section-title" style={{marginBottom:'10px'}}>
                  Wyckoff Detection Diagnostics
                </div>

                {/* Structural gate summary */}
                <div style={{
                  background:'var(--bg)',borderRadius:'8px',padding:'8px 10px',
                  marginBottom:'10px',fontFamily:'IBM Plex Mono',fontSize:'9px',
                  border:'1px solid '+(result.wyckoffFit?'var(--green-bd)':'var(--amber-bd)'),
                  color: result.wyckoffFit?'var(--green)':'var(--amber)'
                }}>
                  <div style={{fontWeight:700,marginBottom:'4px'}}>
                    {result.wyckoffFit ? '✓ Structural quality gate passed' : '~ Structural quality gate weak'}
                    <span style={{fontWeight:400,marginLeft:'8px',color:'var(--muted)'}}>
                      ({isWeekly?'Weekly':'Daily'} · min drop {gateMinDrop} · min {minRangeBars} bars)
                    </span>
                  </div>
                  <div style={{display:'flex',gap:'16px',flexWrap:'wrap',color:'var(--muted)'}}>
                    <span>
                      {dot(priorExtremePct && parseFloat(priorExtremePct) >= parseFloat(gateMinDrop))}
                      {' '}Prior {isA?'high':'low'}: {priorExtreme ? '₹'+Math.round(priorExtreme).toLocaleString('en-IN') : '—'}
                      {priorExtremePct ? <span style={{marginLeft:'4px',color:parseFloat(priorExtremePct)>=parseFloat(gateMinDrop)?'var(--green)':'var(--amber)'}}>({priorExtremePct}% {isA?'drop':'rise'})</span> : null}
                    </span>
                    <span>
                      {dot(rangeBars != null && rangeBars >= minRangeBars)}
                      {' '}Range bars: {rangeBars ?? '—'}
                      <span style={{marginLeft:'4px',opacity:0.6}}>(need ≥{minRangeBars})</span>
                    </span>
                  </div>
                </div>

                {/* Detected events table */}
                <div style={{fontFamily:'IBM Plex Mono',fontSize:'9px'}}>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 80px 80px 40px',gap:'2px 8px',
                    color:'var(--muted)',fontWeight:700,paddingBottom:'4px',
                    borderBottom:'1px solid var(--border)',marginBottom:'4px',
                    letterSpacing:'0.5px',fontSize:'8px'}}>
                    <span>EVENT</span><span>DATE</span><span>PRICE</span><span>BAR#</span>
                  </div>
                  {events.map((e,i) => {
                    const detected = e.date != null;
                    return (
                      <div key={i} style={{
                        display:'grid',gridTemplateColumns:'1fr 80px 80px 40px',
                        gap:'2px 8px',padding:'5px 0',
                        borderBottom: i<events.length-1 ? '1px solid var(--border)' : 'none',
                        opacity: detected ? 1 : 0.4,
                      }}>
                        <span style={{color: detected?'var(--text)':'var(--faint)', display:'flex',alignItems:'center',gap:'5px'}}>
                          <span style={{color:detected?'var(--green)':'var(--faint)',fontSize:'10px'}}>{detected?'●':'○'}</span>
                          {e.label}
                        </span>
                        <span style={{color:'var(--muted)'}}>{e.date ?? '—'}</span>
                        <span style={{color:'var(--text2)',fontWeight:700}}>{e.price ?? '—'}</span>
                        <span style={{color:'var(--faint)'}}>{e.bar ?? '—'}</span>
                      </div>
                    );
                  })}
                </div>

                {/* stageKey + wyckoffFit summary line */}
                <div style={{
                  marginTop:'8px',paddingTop:'6px',borderTop:'1px solid var(--border)',
                  fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--muted)',
                  display:'flex',gap:'12px',flexWrap:'wrap'
                }}>
                  <span>Stage: <strong style={{color:'var(--text)'}}>{result.stageKey ?? '—'}</strong></span>
                  <span>Phase: <strong style={{color:'var(--text)'}}>{result.phase}-{result.stageNum}</strong></span>
                  <span>Fit: <strong style={{color:result.wyckoffFit?'var(--green)':'var(--amber)'}}>{result.wyckoffFit?'✓ yes':'~ weak'}</strong></span>
                  <span>TF: <strong style={{color:'var(--text)'}}>{isWeekly?'Weekly':'Daily'}</strong></span>
                  <span>Candles: <strong style={{color:'var(--text)'}}>{c.length}</strong></span>
                </div>
              </div>
            );
          })()}

          {/* Key Levels */}
          {result && !detailLoading && (
            <div className="levels-card">
              <div className="section-title">Key Price Levels</div>
              <div className="levels-grid">
                {isAcc ? (<>
                  <div className="lv"><div className="lv-l">SC Support</div><div className="lv-v" style={{color:'var(--red)'}}>₹{Math.round(result.scPrice).toLocaleString('en-IN')}</div><div className="lv-n">Range bottom</div></div>
                  <div className="lv"><div className="lv-l">Spring Low</div><div className="lv-v" style={{color:'var(--green)'}}>₹{Math.round(result.springLow).toLocaleString('en-IN')}</div><div className="lv-n">Bear trap</div></div>
                  <div className="lv"><div className="lv-l">Creek (AR)</div><div className="lv-v" style={{color:'var(--amber)'}}>₹{Math.round(result.arPrice).toLocaleString('en-IN')}</div><div className="lv-n">Resistance → Support</div></div>
                  <div className="lv"><div className="lv-l">Target 1</div><div className="lv-v" style={{color:'var(--green)'}}>₹{Math.round(result.target1).toLocaleString('en-IN')}</div><div className="lv-n">+0.75× range</div></div>
                  <div className="lv"><div className="lv-l">Target 2</div><div className="lv-v" style={{color:'var(--green)'}}>₹{Math.round(result.target2).toLocaleString('en-IN')}</div><div className="lv-n">+1.25× range</div></div>
                  <div className="lv"><div className="lv-l">Vol Ratio</div><div className="lv-v" style={{color:result.volRatio>1.5?'var(--red)':result.volRatio<.7?'var(--green)':'var(--amber)'}}>{result.volRatio.toFixed(2)}×</div><div className="lv-n">vs avg volume</div></div>
                </>) : (<>
                  <div className="lv"><div className="lv-l">BC Top</div><div className="lv-v" style={{color:'var(--red)'}}>₹{Math.round(result.bcTopPrice).toLocaleString('en-IN')}</div><div className="lv-n">Range peak</div></div>
                  <div className="lv"><div className="lv-l">Ice Level</div><div className="lv-v" style={{color:'var(--blue)'}}>₹{Math.round(result.icePrice).toLocaleString('en-IN')}</div><div className="lv-n">Support → Resistance</div></div>
                  <div className="lv"><div className="lv-l">UTAD Zone</div><div className="lv-v" style={{color:'var(--red)'}}>₹{Math.round(result.bcTopPrice*1.005).toLocaleString('en-IN')}</div><div className="lv-n">Bull trap short zone</div></div>
                  <div className="lv"><div className="lv-l">Target 1</div><div className="lv-v" style={{color:'var(--red)'}}>₹{Math.round(result.target1).toLocaleString('en-IN')}</div><div className="lv-n">-0.75× range</div></div>
                  <div className="lv"><div className="lv-l">Target 2</div><div className="lv-v" style={{color:'var(--red)'}}>₹{Math.round(result.target2).toLocaleString('en-IN')}</div><div className="lv-n">-1.25× range</div></div>
                  <div className="lv"><div className="lv-l">Vol Ratio</div><div className="lv-v" style={{color:result.volRatio>1.5?'var(--red)':result.volRatio<.7?'var(--green)':'var(--amber)'}}>{result.volRatio.toFixed(2)}×</div><div className="lv-n">vs avg volume</div></div>
                </>)}
              </div>
            </div>
          )}

          {/* Entry suggestions */}
          {result && !detailLoading && (
            <div>
              <div className="section-title" style={{padding:'4px 0',fontFamily:'IBM Plex Mono',fontSize:'8px',letterSpacing:'2px',textTransform:'uppercase',color:'var(--muted)'}}>
                {isAcc?'Long Entry Suggestions':'Short Entry Signals'}
              </div>
              {result.entries.map((e,i)=><EntryCard key={i} e={e} cmp={opp.lastClose}/>)}
            </div>
          )}

          <div className="disclaimer">
            <strong>⚠ Educational only.</strong> Not financial advice. Always cross-reference with F&O OI, FII/DII data and sector momentum before executing any trade.
          </div>
        </div>
      </div>
    </>
  );
}

/* ── STOCK SEARCH COMPONENT — open NSE search ── */
function StockSearch({selected, onSelect, onClear}) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const inputRef = useRef(null);
  const wrapRef = useRef(null);

  const q = query.trim();

  // Filter our known universe
  const knownResults = q.length < 1 ? [] : ALL_STOCKS.filter(s => {
    const ql = q.toLowerCase();
    return s.symbol.toLowerCase().startsWith(ql) ||
           s.name.toLowerCase().includes(ql) ||
           s.symbol.toLowerCase().includes(ql);
  }).slice(0, 10);

  // If query looks like a valid NSE symbol (1–15 alphanumeric + &-) and not already in list, offer manual entry
  const isValidSymbol = /^[A-Za-z0-9&\-]{1,15}$/.test(q);
  const alreadyKnown = knownResults.some(s => s.symbol.toLowerCase() === q.toLowerCase());
  const showManual = q.length >= 2 && isValidSymbol && !alreadyKnown;

  const highlight = (text, q) => {
    if (!q) return text;
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return text;
    return <>{text.slice(0, idx)}<span className="sdi-match">{text.slice(idx, idx+q.length)}</span>{text.slice(idx+q.length)}</>;
  };

  // Build a manual stock object from typed symbol
  const makeManualStock = sym => ({
    symbol: sym.toUpperCase(),
    name:   sym.toUpperCase() + ' (NSE)',
    yahoo:  sym.toUpperCase() + '.NS',
    sector: 'NSE',
    cap:    'unknown',
  });

  useEffect(() => {
    const handler = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    document.addEventListener('touchstart', handler);
    return () => { document.removeEventListener('mousedown', handler); document.removeEventListener('touchstart', handler); };
  }, []);

  if (selected) {
    return (
      <div className="selected-pill">
        <span className="sp-sym">{selected.symbol}</span>
        <span className="sp-name">{selected.name}</span>
        <span style={{fontFamily:'IBM Plex Mono',fontSize:'9px',color:'var(--blue)',background:'var(--blue-bg)',border:'1px solid var(--blue-bd)',padding:'2px 7px',borderRadius:'4px',flexShrink:0}}>{selected.sector}</span>
        <button className="sp-clear" onClick={()=>{ onClear(); setQuery(''); }}>×</button>
      </div>
    );
  }

  return (
    <div className="stock-search-wrap" ref={wrapRef}>
      <input
        ref={inputRef}
        className="stock-search-input"
        placeholder="Any NSE symbol or name… e.g. HDFCBANK, Zomato, IREDA"
        value={query}
        onChange={e => { setQuery(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onKeyDown={e => {
          // Enter on a typed symbol that's not in list → use it directly
          if (e.key === 'Enter' && showManual && knownResults.length === 0) {
            onSelect(makeManualStock(q)); setQuery(''); setOpen(false);
          }
        }}
        autoComplete="off" autoCorrect="off" spellCheck="false"
      />
      {query && <button className="stock-search-clear" onClick={() => { setQuery(''); inputRef.current?.focus(); }}>×</button>}

      {open && (knownResults.length > 0 || showManual) && (
        <div className="stock-dropdown">
          {/* Known stocks from our universe */}
          {knownResults.map(s => (
            <div key={s.symbol} className="sdi" onMouseDown={e => e.preventDefault()}
              onClick={() => { onSelect(s); setQuery(''); setOpen(false); }}>
              <span className="sdi-sym">{highlight(s.symbol, q)}</span>
              <span className="sdi-name">{highlight(s.name, q)}</span>
              <span className="sdi-sec">{s.sector}</span>
            </div>
          ))}
          {/* Manual NSE entry — any symbol not in list */}
          {showManual && (
            <div className="sdi sdi-manual" onMouseDown={e => e.preventDefault()}
              onClick={() => { onSelect(makeManualStock(q)); setQuery(''); setOpen(false); }}>
              <span className="sdi-sym" style={{color:'var(--blue)'}}>{q.toUpperCase()}</span>
              <span className="sdi-name" style={{color:'var(--blue)'}}>Scan as NSE:{q.toUpperCase()} →</span>
              <span className="sdi-sec" style={{color:'var(--blue)',borderColor:'var(--blue-bd)',background:'var(--blue-bg)'}}>ANY NSE</span>
            </div>
          )}
        </div>
      )}
      {open && q.length >= 1 && knownResults.length === 0 && !showManual && (
        <div className="stock-dropdown">
